<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un chauffe-eau à accumulation : une cuve isolée, une résistance qui chauffe l'eau, un thermostat qui coupe à la température voulue, l'arrivée d'eau froide en bas avec son groupe de sécurité, le départ d'eau chaude en haut">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le chauffe-eau à accumulation, de l'intérieur</text>
<rect x="40" y="34" width="84" height="130" rx="20" fill="#24282f" stroke="#9aa6b3" stroke-width="3"/><rect x="48" y="42" width="68" height="114" rx="14" fill="#e85b50" fill-opacity="0.16"/><rect x="48" y="110" width="68" height="46" rx="14" fill="#5aa9e6" fill-opacity="0.22"/>
<polyline points="82,150 82,112 90,112 90,150" fill="none" stroke="#ff8c2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="70" y="150" width="32" height="10" rx="2" fill="#ffd23f"/>
<polyline points="56,164 56,184" fill="none" stroke="#5aa9e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="108,164 108,184" fill="none" stroke="#e85b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="140" y="50" text-anchor="start" font-size="9" fill="#e8eaed" font-weight="bold">cuve isolée</text>
<text x="140" y="62" text-anchor="start" font-size="7.5" fill="#9aa6b3" font-weight="normal">l'eau chaude monte en haut</text>
<text x="140" y="90" text-anchor="start" font-size="9" fill="#ff8c2b" font-weight="bold">résistance</text>
<text x="140" y="102" text-anchor="start" font-size="7.5" fill="#9aa6b3" font-weight="normal">elle chauffe l'eau</text>
<text x="140" y="128" text-anchor="start" font-size="9" fill="#ffd23f" font-weight="bold">thermostat</text>
<text x="140" y="140" text-anchor="start" font-size="7.5" fill="#9aa6b3" font-weight="normal">coupe à la température réglée</text>
<text x="140" y="166" text-anchor="start" font-size="7.8" fill="#5aa9e6" font-weight="bold">eau froide + groupe de sécurité</text>
<text x="140" y="180" text-anchor="start" font-size="7.8" fill="#e85b50" font-weight="bold">eau chaude vers les robinets</text>
</svg>
