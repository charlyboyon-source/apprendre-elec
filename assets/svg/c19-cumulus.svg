<path d="M310 172 v-30 m-5 8 l5 -8 l5 8" fill="none" stroke="#d92b2b" stroke-width="2" opacity=".75"/>
<path d="M242 120 L200 120" stroke="#1c2530" stroke-width="1.6"/><circle cx="242" cy="120" r="3" fill="#1c2530"/>
<text x="194" y="114" text-anchor="end" font-size="15.6" font-weight="800" fill="#1c2530">cuve isolée</text>
<text x="194" y="134" text-anchor="end" font-size="13.0" font-weight="500" fill="#5b6673">l'eau chaude monte en haut</text>
