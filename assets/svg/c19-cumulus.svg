<text x="194" y="224" text-anchor="end" font-size="13.0" font-weight="500" fill="#5b6673">elle chauffe l'eau</text>
<path d="M318 300 L412 300" stroke="#1c2530" stroke-width="1.6"/><circle cx="318" cy="300" r="3" fill="#1c2530"/>
<text x="418" y="294" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">thermostat</text>
<text x="418" y="314" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">coupe à la température</text>
<text x="418" y="330" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">réglée</text>
<text x="150" y="374" text-anchor="end" font-size="14.3" font-weight="800" fill="#2166d1">eau froide</text>
<text x="146" y="430" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">+ groupe de sécurité</text>
<text x="446" y="40" text-anchor="start" font-size="14.3" font-weight="800" fill="#d92b2b">eau chaude</text>
<text x="446" y="60" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">vers les robinets</text>
<text x="370" y="412" text-anchor="end" font-size="12.3" font-weight="500" fill="#5b6673">vue en coupe</text>
</svg>
