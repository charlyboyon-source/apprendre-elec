<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le triangle de la loi d'Ohm : U en haut, R et I en bas. U = R × I, R = U / I, I = U / R">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Loi d'Ohm : le triangle</text>
<polygon points="88,40 150,150 26,150" fill="#24282f" stroke="#ffd23f" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="50,108 126,108" fill="none" stroke="#ffd23f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="88,108 88,150" fill="none" stroke="#ffd23f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="92" text-anchor="middle" font-size="22" fill="#ffd23f" font-weight="bold">U</text>
<text x="64" y="140" text-anchor="middle" font-size="18" fill="#ff8c2b" font-weight="bold">R</text>
<text x="112" y="140" text-anchor="middle" font-size="18" fill="#5aa9e6" font-weight="bold">I</text>
<text x="176" y="62" text-anchor="start" font-size="13" fill="#e8eaed" font-weight="bold">U = R × I</text>
<text x="176" y="75" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">on cherche la tension</text>
<text x="176" y="98" text-anchor="start" font-size="13" fill="#e8eaed" font-weight="bold">R = U / I</text>
<text x="176" y="111" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">on cherche la résistance</text>
<text x="176" y="134" text-anchor="start" font-size="13" fill="#e8eaed" font-weight="bold">I = U / R</text>
<text x="176" y="147" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">on cherche l'intensité</text>
<text x="160" y="176" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Cache la grandeur cherchée : il reste la formule</text>
</svg>
