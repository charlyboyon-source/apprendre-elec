<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Chauffe-eau thermodynamique : une pompe à chaleur prend les calories de l'air, il consomme environ trois fois moins. Chauffe-eau solaire : des capteurs chauffent l'eau, avec un appoint électrique quand le soleil manque">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Deux solutions économes</text>
<rect x="12" y="28" width="144" height="140" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="9.5" fill="#5aa9e6" font-weight="bold">THERMODYNAMIQUE</text>
<text x="84" y="68" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">une pompe à chaleur</text>
<text x="84" y="83" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">prend la chaleur de l'air</text>
<text x="84" y="98" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="113" text-anchor="middle" font-size="9" fill="#5aa9e6" font-weight="bold">environ 3 fois moins</text>
<text x="84" y="128" text-anchor="middle" font-size="9" fill="#5aa9e6" font-weight="bold">d'électricité</text>
<text x="84" y="143" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="158" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">résistance en appoint</text>
<rect x="164" y="28" width="144" height="140" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">SOLAIRE</text>
<text x="236" y="68" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">des capteurs sur le toit</text>
<text x="236" y="83" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">chauffent l'eau</text>
<text x="236" y="98" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="113" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">énergie gratuite</text>
<text x="236" y="128" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">quand il y a du soleil</text>
<text x="236" y="143" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="158" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">appoint électrique sinon</text>
</svg>
