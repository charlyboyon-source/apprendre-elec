<text x="164" y="184" text-anchor="middle" font-size="18.2" font-weight="800" fill="#b85a08">chaleur × 1</text>
<text x="476" y="72" text-anchor="middle" font-size="16.2" font-weight="800" fill="#1c2530">courant 2 × I</text>
<text x="476" y="184" text-anchor="middle" font-size="18.2" font-weight="800" fill="#d92b2b">chaleur × 4</text>
<text x="320" y="250" text-anchor="middle" font-size="22.1" font-weight="800" fill="#1c2530">P = R × I²</text>
