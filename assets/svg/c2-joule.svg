<text x="204" y="304" text-anchor="middle" font-size="14.3" font-weight="500" fill="#1c2530">utile dans</text>
<text x="204" y="326" text-anchor="middle" font-size="14.3" font-weight="800" fill="#17804c">un radiateur</text>
<rect x="328" y="270" width="296" height="82" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<path d="M352 314 H450" stroke="url(#chaud)" stroke-width="5"/>
