<text x="530" y="326" text-anchor="middle" font-size="14.3" font-weight="800" fill="#d92b2b">un fil trop fin</text>
<text x="320" y="392" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">Le courant double, la chaleur quadruple</text>
