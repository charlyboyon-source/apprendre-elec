<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Effet Joule : P = R × I². Si le courant double, la chaleur dégagée est multipliée par quatre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Effet Joule : P = R × I²</text>
<polygon points="40,112 64,123 64,139 40,128" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,112 64,123 64,139 40,128" fill="#ffd23f" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,123 92,112 92,128 64,139" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,123 92,112 92,128 64,139" fill="#ffd23f" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,112 68,101 92,112 64,123" fill="#ffd23f" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="66" y="95" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">courant I</text>
<text x="66" y="158" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">chaleur × 1</text>
<polygon points="130,64 154,75 154,139 130,128" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="130,64 154,75 154,139 130,128" fill="#e85b50" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="154,75 182,64 182,128 154,139" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="154,75 182,64 182,128 154,139" fill="#e85b50" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="130,64 158,53 182,64 154,75" fill="#e85b50" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="156" y="47" text-anchor="middle" font-size="9" fill="#e85b50" font-weight="bold">courant 2 × I</text>
<text x="156" y="158" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">chaleur × 4</text>
<text x="214" y="84" text-anchor="start" font-size="13" fill="#ffd23f" font-weight="bold">P = R × I²</text>
<text x="214" y="104" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">utile dans</text>
<text x="214" y="114" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">un radiateur</text>
<text x="214" y="132" text-anchor="start" font-size="7.8" fill="#e85b50" font-weight="normal">dangereux dans</text>
<text x="214" y="142" text-anchor="start" font-size="7.8" fill="#e85b50" font-weight="normal">un fil trop fin</text>
<text x="160" y="181" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Le courant double, la chaleur quadruple</text>
</svg>
