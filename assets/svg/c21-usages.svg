<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Trois usages de l'électricité produite : l'autoconsommation, on consomme sa production ; la vente du surplus, on vend ce qu'on ne consomme pas ; la vente totale, tout part sur le réseau">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Que fait-on de l'électricité produite ?</text>
<rect x="12" y="30" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="35" width="4" height="26" rx="2" fill="#4cd97b"/>
<text x="24" y="51.0" text-anchor="start" font-size="7.5" fill="#4cd97b" font-weight="bold">AUTOCONSOMMATION</text>
<text x="130" y="45.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">on consomme sa production</text>
<text x="130" y="57.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">sinon, le réseau fournit</text>
<rect x="12" y="72" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="77" width="4" height="26" rx="2" fill="#ffd23f"/>
<text x="24" y="93.0" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">VENTE DU SURPLUS</text>
<text x="130" y="87.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">on vend le reste</text>
<text x="130" y="99.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">ce que le logement ne consomme pas</text>
<rect x="12" y="114" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="119" width="4" height="26" rx="2" fill="#ff8c2b"/>
<text x="24" y="135.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">VENTE TOTALE</text>
<text x="130" y="129.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">tout part sur le réseau</text>
<text x="130" y="141.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">le logement achète toute son électricité</text>
<text x="160" y="172" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">Le soleil produit à midi ; le logement consomme surtout matin et soir</text>
</svg>
