<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'énergie : E = P × t, comptée en kilowattheures. Un radiateur de 2 kW pendant 5 h consomme 10 kWh. 1 kWh = 1 000 W pendant 1 heure">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">L'énergie : E = P × t</text>
<polygon points="40,74 64,85 64,119 40,108" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,74 64,85 64,119 40,108" fill="#4cd97b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,85 92,74 92,108 64,119" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,85 92,74 92,108 64,119" fill="#4cd97b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,74 68,63 92,74 64,85" fill="#4cd97b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="66" y="58" text-anchor="middle" font-size="9" fill="#4cd97b" font-weight="bold">compteur</text>
<text x="66" y="140" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">il compte les kWh</text>
<text x="138" y="66" text-anchor="start" font-size="15" fill="#ffd23f" font-weight="bold">E = P × t</text>
<text x="138" y="80" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">l'énergie, en kilowattheures</text>
<text x="138" y="108" text-anchor="start" font-size="11" fill="#4cd97b" font-weight="bold">2 kW × 5 h = 10 kWh</text>
<text x="138" y="122" text-anchor="start" font-size="7.5" fill="#9aa6b3" font-weight="normal">un radiateur pendant 5 heures</text>
<text x="160" y="176" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">1 kWh = 1 000 W pendant 1 heure</text>
</svg>
