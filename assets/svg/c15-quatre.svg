<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Quatre schémas, quatre questions : architectural, où sont les appareils ; unifilaire, quels circuits et quelles protections ; multifilaire, comment raccorder ; développé, comment ça fonctionne">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Quatre schémas, quatre questions</text>
<rect x="12" y="28" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="33" width="4" height="23" rx="2" fill="#ffd23f"/>
<text x="24" y="47.5" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">ARCHITECTURAL</text>
<text x="118" y="42.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">Où sont les appareils ?</text>
<text x="118" y="54.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">sur le plan du logement</text>
<rect x="12" y="66" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="71" width="4" height="23" rx="2" fill="#ff8c2b"/>
<text x="24" y="85.5" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">UNIFILAIRE</text>
<text x="118" y="80.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">Quels circuits, quelles protections ?</text>
<text x="118" y="92.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">un trait par circuit</text>
<rect x="12" y="104" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="109" width="4" height="23" rx="2" fill="#5aa9e6"/>
<text x="24" y="123.5" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">MULTIFILAIRE</text>
<text x="118" y="118.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">Comment raccorder ?</text>
<text x="118" y="130.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">un trait par conducteur</text>
<rect x="12" y="142" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="147" width="4" height="23" rx="2" fill="#4cd97b"/>
<text x="24" y="161.5" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">DÉVELOPPÉ</text>
<text x="118" y="156.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">Comment ça fonctionne ?</text>
<text x="118" y="168.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">de la phase au neutre</text>
</svg>
