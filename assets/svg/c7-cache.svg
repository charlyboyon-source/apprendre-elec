<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Volume caché : l'espace fermé sous la baignoire ou le receveur. Matériel admis, IPX4 et protégé par un différentiel 30 mA ; appareillage interdit, ni prise ni interrupteur">
