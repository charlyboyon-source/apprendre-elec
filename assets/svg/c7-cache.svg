<polygon points="40,86 80,104.33333333333333 80,114.33333333333333 40,96" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,86 80,104.33333333333333 80,114.33333333333333 40,96" fill="#5aa9e6" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="80,104.33333333333333 190,61.11904761904761 190,71.11904761904762 80,114.33333333333333" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="80,104.33333333333333 190,61.11904761904761 190,71.11904761904762 80,114.33333333333333" fill="#5aa9e6" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,86 150,42.785714285714285 190,61.11904761904761 80,104.33333333333333" fill="#5aa9e6" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="206" y="100" text-anchor="start" font-size="10.5" fill="#b48cf2" font-weight="bold">VOLUME CACHÉ</text>
<text x="206" y="112" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">sous la baignoire</text>
<text x="206" y="122" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">ou le receveur</text>
<rect x="14" y="156" width="142" height="30" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="85" y="168" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">MATÉRIEL : OUI</text>
<text x="85" y="179" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">IPX4 + DDR 30 mA</text>
<rect x="164" y="156" width="142" height="30" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="235" y="168" text-anchor="middle" font-size="8.5" fill="#e85b50" font-weight="bold">APPAREILLAGE : NON</text>
<text x="235" y="179" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">ni prise, ni interrupteur</text>
</svg>
