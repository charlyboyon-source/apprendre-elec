<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 194" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Volume caché : l'espace sous la baignoire ou le receveur. Le matériel y est admis s'il est IPX4 et protégé par un DDR 30 mA ; l'appareillage, prise ou interrupteur, y est interdit">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Volume caché : sous la baignoire</text>
