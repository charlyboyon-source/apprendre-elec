<rect x="152" y="280" width="166" height="48" fill="#c5cad0" opacity=".9"/><path d="M152 280 H318" stroke="#7d858e" stroke-dasharray="4 3"/>
<path d="M296 140 H314 V272" fill="none" stroke="#8d949c" stroke-width="5"/><circle cx="290" cy="140" r="9" fill="#aab1b9"/>
<text x="235.0" y="310" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">VOLUME CACHÉ</text>
<text x="450" y="96" text-anchor="middle" font-size="15.0" font-weight="500" fill="#1c2530">sous la baignoire</text>
<text x="450" y="118" text-anchor="middle" font-size="15.0" font-weight="500" fill="#1c2530">ou le receveur</text>
<rect x="360" y="140" width="264" height="74" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="492" y="170" text-anchor="middle" font-size="16.9" font-weight="800" fill="#17804c">MATÉRIEL : OUI</text>
<text x="492" y="196" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">IPX4 + DDR 30 mA</text>
<rect x="360" y="224" width="264" height="74" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="492" y="254" text-anchor="middle" font-size="16.9" font-weight="800" fill="#d92b2b">APPAREILLAGE : NON</text>
<text x="492" y="280" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">ni prise, ni interrupteur</text>
