<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le récepteur transforme l'énergie électrique : en lumière, la lampe ; en chaleur, le radiateur ; en mouvement, le moteur. Il est branché entre la phase et le neutre, jamais entre la phase et la terre">
