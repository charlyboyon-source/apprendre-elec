<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un récepteur transforme l'énergie électrique en lumière, en chaleur ou en mouvement ; il se branche entre la phase et le neutre, jamais entre la phase et la terre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le récepteur transforme l'énergie</text>
<polygon points="40,62 64,73 64,99 40,88" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,62 64,73 64,99 40,88" fill="#ffd23f" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,73 92,62 92,88 64,99" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,73 92,62 92,88 64,99" fill="#ffd23f" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,62 68,51 92,62 64,73" fill="#ffd23f" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="66" y="120" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">lumière</text>
<text x="66" y="132" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">lampe</text>
<polygon points="134,62 158,73 158,99 134,88" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="134,62 158,73 158,99 134,88" fill="#e85b50" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="158,73 186,62 186,88 158,99" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="158,73 186,62 186,88 158,99" fill="#e85b50" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="134,62 162,51 186,62 158,73" fill="#e85b50" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="160" y="120" text-anchor="middle" font-size="9.5" fill="#e85b50" font-weight="bold">chaleur</text>
<text x="160" y="132" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">radiateur</text>
<polygon points="228,62 252,73 252,99 228,88" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="228,62 252,73 252,99 228,88" fill="#ff8c2b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="252,73 280,62 280,88 252,99" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="252,73 280,62 280,88 252,99" fill="#ff8c2b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="228,62 256,51 280,62 252,73" fill="#ff8c2b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="254" y="120" text-anchor="middle" font-size="9.5" fill="#ff8c2b" font-weight="bold">mouvement</text>
<text x="254" y="132" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">moteur</text>
<rect x="30" y="144" width="260" height="34" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="160" y="158" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">Branché entre PHASE et NEUTRE</text>
<text x="160" y="171" text-anchor="middle" font-size="8" fill="#e85b50" font-weight="bold">jamais entre la phase et la terre</text>
</svg>
