<path d="M190 146 V196" fill="none" stroke="#f28c28" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(190 212) rotate(0)"><path d="M20.0 0.0 L26.0 0.0" stroke="#f2a20c" stroke-width="2.4" stroke-linecap="round"/><path d="M14.1 14.1 L18.4 18.4" stroke="#f2a20c" stroke-width="2.4" stroke-linecap="round"/><path d="M0.0 20.0 L0.0 26.0" stroke="#f2a20c" stroke-width="2.4" stroke-linecap="round"/><path d="M-14.1 14.1 L-18.4 18.4" stroke="#f2a20c" stroke-width="2.4" stroke-linecap="round"/><path d="M-20.0 0.0 L-26.0 0.0" stroke="#f2a20c" stroke-width="2.4" stroke-linecap="round"/><path d="M-14.1 -14.1 L-18.4 -18.4" stroke="#f2a20c" stroke-width="2.4" stroke-linecap="round"/><path d="M-0.0 -20.0 L-0.0 -26.0" stroke="#f2a20c" stroke-width="2.4" stroke-linecap="round"/><path d="M14.1 -14.1 L18.4 -18.4" stroke="#f2a20c" stroke-width="2.4" stroke-linecap="round"/><circle r="15" fill="#ffd23f" stroke="#1c2530" stroke-width="2.6"/><path d="M-10.5 -10.5 L10.5 10.5 M10.5 -10.5 L-10.5 10.5" stroke="#1c2530" stroke-width="2.4"/></g>
<text x="220" y="218" text-anchor="start" font-size="16.9" font-weight="800" fill="#1c2530">E1</text>
<path d="M190 228 V296" fill="none" stroke="#2166d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="390" y="98" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">la phase en haut,</text>
<text x="390" y="120" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">le neutre en bas</text>
<text x="390" y="174" text-anchor="start" font-size="15.6" font-weight="500" fill="#1c2530">entre les deux :</text>
<text x="390" y="196" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">le fonctionnement</text>
<text x="390" y="246" text-anchor="start" font-size="15.6" font-weight="500" fill="#5b6673">pas l'emplacement</text>
<text x="390" y="268" text-anchor="start" font-size="15.6" font-weight="500" fill="#5b6673">des appareils</text>
<rect x="24" y="340" width="592" height="46" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="369.0" text-anchor="middle" font-size="16.2" font-weight="800" fill="#1c2530">Le schéma pour comprendre un montage</text>
</svg>
