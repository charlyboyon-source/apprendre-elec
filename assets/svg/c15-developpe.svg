<text x="40" y="318" text-anchor="start" font-size="14.3" font-weight="800" fill="#2166d1">neutre</text>
<g transform="translate(190 86) rotate(0)"><path d="M0 0 V20 M0 40 V60" stroke="#1c2530" stroke-width="2.6"/><path d="M0 20 L0 40" stroke="#1c2530" stroke-width="2.6" stroke-linecap="round"/><path d="M-5 40 H5" stroke="#1c2530" stroke-width="2.6"/></g>
