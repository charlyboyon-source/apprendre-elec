<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Choisir le conduit selon la pose : encastré, ICTA ; apparent, IRL ou goulotte ; enterré, TPC rouge">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">À chaque pose son conduit</text>
<rect x="12" y="32" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="37" width="4" height="26" rx="2" fill="#ffd23f"/>
<text x="24" y="53.0" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">ENCASTRÉ</text>
<text x="100" y="47.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">ICTA</text>
<text x="100" y="59.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">dans les murs, les cloisons, les dalles</text>
<rect x="12" y="74" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="79" width="4" height="26" rx="2" fill="#ff8c2b"/>
<text x="24" y="95.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">APPARENT</text>
<text x="100" y="89.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IRL ou goulotte</text>
<text x="100" y="101.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">garage, cave, rénovation</text>
<rect x="12" y="116" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="121" width="4" height="26" rx="2" fill="#e85b50"/>
<text x="24" y="137.0" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">ENTERRÉ</text>
<text x="100" y="131.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">TPC rouge</text>
<text x="100" y="143.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">dans une tranchée, avec grillage avertisseur</text>
<text x="160" y="168" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Le conduit se choisit avant le fil</text>
</svg>
