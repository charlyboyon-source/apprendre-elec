<text x="56" y="146" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">radiateur, four</text>
<polygon points="102,72 126,83 126,113 102,102" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="102,72 126,83 126,113 102,102" fill="#ffd23f" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="126,83 154,72 154,102 126,113" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="126,83 154,72 154,102 126,113" fill="#ffd23f" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="102,72 130,61 154,72 126,83" fill="#ffd23f" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="128" y="134" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">éclairer</text>
<text x="128" y="146" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">lampes</text>
<polygon points="174,72 198,83 198,113 174,102" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="174,72 198,83 198,113 174,102" fill="#ff8c2b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="198,83 226,72 226,102 198,113" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="198,83 226,72 226,102 198,113" fill="#ff8c2b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="174,72 202,61 226,72 198,83" fill="#ff8c2b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="200" y="134" text-anchor="middle" font-size="9" fill="#ff8c2b" font-weight="bold">mouvoir</text>
<text x="200" y="146" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">force motrice</text>
<polygon points="246,72 270,83 270,113 246,102" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="246,72 270,83 270,113 246,102" fill="#5aa9e6" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="270,83 298,72 298,102 270,113" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="270,83 298,72 298,102 270,113" fill="#5aa9e6" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="246,72 274,61 298,72 270,83" fill="#5aa9e6" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="272" y="134" text-anchor="middle" font-size="9" fill="#5aa9e6" font-weight="bold">communiquer</text>
<text x="272" y="146" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">réseaux, box</text>
<text x="160" y="176" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Chauffage · éclairage · force motrice · communication</text>
