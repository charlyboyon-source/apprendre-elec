<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Les quatre usages de l'électricité : chauffer, éclairer, mettre en mouvement (force motrice), communiquer">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">L'électricité sert à quatre choses</text>
<polygon points="30,72 54,83 54,113 30,102" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="30,72 54,83 54,113 30,102" fill="#e85b50" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="54,83 82,72 82,102 54,113" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="54,83 82,72 82,102 54,113" fill="#e85b50" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="30,72 58,61 82,72 54,83" fill="#e85b50" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
