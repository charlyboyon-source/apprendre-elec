<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Les conducteurs : la phase en rouge, marron ou noir ; le neutre en bleu clair, couleur réservée ; la terre en vert-jaune, couleur réservée">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Phase, neutre, terre : les couleurs</text>
<polygon points="40,62 64,73 64,99 40,88" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,62 64,73 64,99 40,88" fill="#e85b50" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,73 92,62 92,88 64,99" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,73 92,62 92,88 64,99" fill="#e85b50" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,62 68,51 92,62 64,73" fill="#e85b50" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="66" y="120" text-anchor="middle" font-size="9.5" fill="#e85b50" font-weight="bold">PHASE</text>
<text x="66" y="133" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">rouge, marron</text>
<text x="66" y="144" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">ou noir</text>
<polygon points="134,62 158,73 158,99 134,88" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="134,62 158,73 158,99 134,88" fill="#5aa9e6" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="158,73 186,62 186,88 158,99" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="158,73 186,62 186,88 158,99" fill="#5aa9e6" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="134,62 162,51 186,62 158,73" fill="#5aa9e6" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="160" y="120" text-anchor="middle" font-size="9.5" fill="#5aa9e6" font-weight="bold">NEUTRE</text>
<text x="160" y="133" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">bleu clair</text>
<text x="160" y="144" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">couleur réservée</text>
<polygon points="228,62 252,73 252,99 228,88" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="228,62 252,73 252,99 228,88" fill="#4cd97b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="252,73 280,62 280,88 252,99" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="252,73 280,62 280,88 252,99" fill="#4cd97b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="228,62 256,51 280,62 252,73" fill="#4cd97b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="254" y="120" text-anchor="middle" font-size="9.5" fill="#4cd97b" font-weight="bold">TERRE</text>
<text x="254" y="133" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">vert-jaune</text>
<text x="254" y="144" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">couleur réservée</text>
<polygon points="242,56.5 270,45.5 280,50 252,61" fill="#ffd23f"/>
<text x="160" y="174" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">La section se choisit selon le courant à transporter</text>
</svg>
