<text x="318" y="234" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">bleu clair</text>
<text x="318" y="256" text-anchor="middle" font-size="13.7" font-weight="500" fill="#5b6673">couleur réservée</text>
