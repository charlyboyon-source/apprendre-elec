<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 195" font-family="'Segoe UI',system-ui,sans-serif">
<rect x="70" y="35" width="180" height="80" rx="8" fill="none" stroke="#e8eaed" stroke-width="2"/>
<rect x="92" y="55" width="136" height="42" rx="4" fill="none" stroke="#9aa3b0" stroke-width="2"/>
<text x="160" y="50" text-anchor="middle" font-size="8" fill="#9aa3b0" font-weight="normal">plaque signalétique</text>
<text x="128" y="80" text-anchor="middle" font-size="11" fill="#e8eaed" font-weight="bold">230 V</text>
<text x="196" y="80" text-anchor="middle" font-size="11" fill="#ff8c2b" font-weight="bold">2300 W</text>
<text x="110" y="140" text-anchor="start" font-size="12" fill="#ffd23f" font-weight="bold">P = U × I</text>
<text x="230" y="140" text-anchor="middle" font-size="9" fill="#5ab0f0" font-weight="normal">I = P / U = 10 A</text>
<text x="160" y="186" text-anchor="middle" font-size="9" fill="#9aa3b0">La plaque indique tension et puissance</text>
</svg>