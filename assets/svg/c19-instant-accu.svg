<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Chauffe-eau instantané : il chauffe l'eau au moment où elle passe, sans réserve, avec une forte puissance pendant peu de temps. À accumulation : il chauffe lentement une réserve d'eau dans une cuve isolée">
