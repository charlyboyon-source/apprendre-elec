<text x="164" y="272" text-anchor="middle" font-size="14.3" font-weight="500" fill="#1c2530">chauffe l'eau au moment</text>
<text x="164" y="292" text-anchor="middle" font-size="14.3" font-weight="500" fill="#1c2530">où elle passe</text>
<text x="164" y="318" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">pas de réserve</text>
