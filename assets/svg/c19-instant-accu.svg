<text x="476" y="272" text-anchor="middle" font-size="14.3" font-weight="500" fill="#1c2530">chauffe lentement</text>
<text x="476" y="292" text-anchor="middle" font-size="14.3" font-weight="500" fill="#1c2530">une réserve d'eau</text>
<text x="476" y="318" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">une cuve isolée</text>
<text x="476" y="346" text-anchor="middle" font-size="13.7" font-weight="500" fill="#2166d1">puissance modérée,</text>
