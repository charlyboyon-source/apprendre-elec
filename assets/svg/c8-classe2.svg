<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Matériel de classe II : double isolation, symbole du double carré, pas de borne de terre, jamais relié au conducteur de protection">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Classe II : la double isolation</text>
<rect x="36" y="52" width="76" height="76" rx="3" fill="none" stroke="#e8eaed" stroke-width="3"/><rect x="54" y="70" width="40" height="40" rx="2" fill="none" stroke="#e8eaed" stroke-width="3"/>
<text x="74" y="146" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">le double carré</text>
<text x="136" y="66" text-anchor="start" font-size="11" fill="#ffd23f" font-weight="bold">CLASSE II</text>
<text x="136" y="86" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">double isolation</text>
<text x="136" y="100" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">pas de borne de terre</text>
<text x="136" y="114" text-anchor="start" font-size="8" fill="#e85b50" font-weight="bold">jamais reliée au PE</text>
<text x="136" y="132" text-anchor="start" font-size="7.5" fill="#9aa6b3" font-weight="normal">perceuse, sèche-cheveux, luminaires</text>
<text x="160" y="176" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Sa protection ne dépend pas de la terre</text>
</svg>
