<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Boucle de défaut en régime TT : phase, défaut, masse, conducteur de protection, prise de terre des masses, sol, prise de terre du neutre, retour à la source. Tension de contact Uc = R terre × I défaut. R inférieure ou égale à UL sur I delta n : 50 V divisés par 0,5 A = 100 ohms">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">La boucle de défaut en régime TT</text>
<polyline points="80,52 240,52" fill="none" stroke="#e85b50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="165,52 157,48 157,56" fill="#ff8c2b"/>
<text x="160" y="46" text-anchor="middle" font-size="7.5" fill="#e85b50" font-weight="normal">phase</text>
<text x="160" y="66" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">I défaut</text>
<rect x="16" y="38" width="64" height="30" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="48" y="56.5" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">source</text>
<rect x="240" y="38" width="64" height="30" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="272" y="52" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">masse</text>
<text x="272" y="62" text-anchor="middle" font-size="7" fill="#e85b50" font-weight="normal">en défaut</text>
<polyline points="272,68 272,116" fill="none" stroke="#4cd97b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="272,68 272,116" fill="none" stroke="#ffd23f" stroke-width="3" stroke-dasharray="4 5" stroke-linejoin="round"/>
<polygon points="272,99 268,91 276,91" fill="#ff8c2b"/>
<polyline points="262,118.0 282,118.0" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="265.5,122.5 278.5,122.5" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="269,127.0 275,127.0" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="48,68 48,116" fill="none" stroke="#5aa9e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="48,87 44,95 52,95" fill="#ff8c2b"/>
<polyline points="38,118.0 58,118.0" fill="none" stroke="#5aa9e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="41.5,122.5 54.5,122.5" fill="none" stroke="#5aa9e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="45,127.0 51,127.0" fill="none" stroke="#5aa9e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="66,124 254,124" fill="none" stroke="#9aa6b3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<polygon points="155,124 163,120 163,128" fill="#ff8c2b"/>
<text x="160" y="118" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">le sol</text>
<text x="60" y="88" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">2 terres en série :</text>
<text x="60" y="99" text-anchor="start" font-size="8" fill="#ff8c2b" font-weight="bold">courant faible</text>
<text x="260" y="88" text-anchor="end" font-size="7.5" fill="#e8eaed" font-weight="normal">tension de contact</text>
<text x="260" y="99" text-anchor="end" font-size="7.8" fill="#ffd23f" font-weight="bold">Uc = R(terre) × I(défaut)</text>
<rect x="30" y="140" width="260" height="40" rx="9" fill="#ffd23f" stroke="#ffd23f" stroke-width="1.2" fill-opacity="0.07"/>
<text x="160" y="156" text-anchor="middle" font-size="10" fill="#e8eaed" font-weight="bold">R ≤ UL / IΔn</text>
<text x="160" y="172" text-anchor="middle" font-size="11.5" fill="#ffd23f" font-weight="bold">50 V / 0,5 A = 100 Ω</text>
<text x="160" y="193" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">Avec un différentiel 500 mA : prise de terre de 100 Ω au maximum</text>
</svg>
