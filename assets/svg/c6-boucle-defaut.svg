<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Boucle de défaut en TT : le courant de défaut part de la phase, traverse la masse en défaut, le conducteur de protection, la prise de terre du logement, le sol, puis la prise de terre du neutre. Deux terres en série : courant faible. Tension de contact Uc égale R terre fois I défaut ; R inférieure ou égale à UL sur IΔn, 50 V sur 0,5 A, 100 Ω">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<linearGradient id="icta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949c"/><stop offset=".3" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6b727a"/></linearGradient>
<linearGradient id="tpc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b02020"/><stop offset=".3" stop-color="#ff6b5e"/><stop offset="1" stop-color="#8e1414"/></linearGradient>
<linearGradient id="irl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1b9"/><stop offset=".3" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8d949c"/></linearGradient>
<linearGradient id="terre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a877"/><stop offset="1" stop-color="#a98557"/></linearGradient>
<pattern id="vj" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2e9e4f"/><rect width="7" height="16" fill="#f2d21a"/></pattern>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
<linearGradient id="cellule" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4a8a"/><stop offset="1" stop-color="#16285a"/></linearGradient>
<linearGradient id="cuve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset=".55" stop-color="#ffb3a0"/><stop offset="1" stop-color="#7fb8f0"/></linearGradient>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">La boucle de défaut en régime TT</text>
<rect x="24" y="280" width="592" height="70" fill="url(#terre)"/><rect x="24" y="280" width="592" height="4" fill="#8f6f45"/>
<rect x="84" y="60" width="12" height="220" fill="#9aa1a9" stroke="#7d858e"/><g filter="url(#ombre)"><rect x="60" y="80" width="60" height="56" rx="6" fill="#aab1b9" stroke="#7d858e"/></g>
<rect x="68" y="68" width="8" height="14" rx="2" fill="#e8eaed" stroke="#7d858e"/>
<rect x="84" y="68" width="8" height="14" rx="2" fill="#e8eaed" stroke="#7d858e"/>
<rect x="100" y="68" width="8" height="14" rx="2" fill="#e8eaed" stroke="#7d858e"/>
<text x="90" y="48" text-anchor="middle" font-size="13.7" font-weight="800" fill="#1c2530">source</text>
<path d="M120 96 H440" fill="none" stroke="#d92b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M120 118 H440" fill="none" stroke="#2166d1" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M76 128 V280" fill="none" stroke="#2166d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="72" y="280" width="8" height="40" fill="url(#acierH)" stroke="#7d858e"/><path d="M72 320 L76 332 L80 320" fill="#9aa1a9"/>
<rect x="465.0" y="128.0" width="70" height="84.0" rx="5" fill="url(#nez)" stroke="#aab1b9"/><rect x="469.0" y="132.0" width="62" height="9" rx="2" fill="#d5d9de"/><circle cx="525.0" cy="136.5" r="3" fill="#5b6673"/><circle cx="500" cy="176" r="22.4" fill="#cfe3f7" stroke="#7d858e" stroke-width="3"/>
<polygon points="531.8,154.7 524.3,154.7 527.1,161.7 521.8,156.4 518.8,163.3 518.8,155.8 511.8,158.6 517.1,153.3 510.2,150.3 517.7,150.3 514.9,143.3 520.2,148.6 523.2,141.7 523.2,149.2 530.2,146.4 524.9,151.7" fill="#ffc21a" stroke="#e8590c" stroke-width="1.5"/>
<path d="M440 96 H480 V140" fill="none" stroke="#d92b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M500 212 V280" fill="none" stroke="#2e9e4f" stroke-width="5" stroke-linejoin="round"/><path d="M500 212 V280" fill="none" stroke="#f2d21a" stroke-width="5" stroke-dasharray="6 6" stroke-linejoin="round"/>
<rect x="496" y="280" width="8" height="40" fill="url(#acierH)" stroke="#7d858e"/><path d="M496 320 L500 332 L504 320" fill="#9aa1a9"/>
<path d="M140 96 H476 V150 L500 200 V318 Q300 300 76 318 V128" fill="none" stroke="#f28c28" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".85" stroke-dasharray="2 10"/>
<text x="300" y="86" text-anchor="middle" font-size="13.7" font-weight="800" fill="#d92b2b">phase</text>
<text x="300" y="320" text-anchor="middle" font-size="14.3" font-weight="800" fill="#5e3b17">le sol</text>
<text x="560" y="150" text-anchor="start" font-size="13.7" font-weight="800" fill="#1c2530">masse</text>
<text x="560" y="168" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">en défaut</text>
<text x="300" y="160" text-anchor="middle" font-size="15.6" font-weight="800" fill="#e8790c">I défaut</text>
<rect x="16" y="346" width="196" height="64" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="114" y="372" text-anchor="middle" font-size="13.7" font-weight="800" fill="#1c2530">2 terres en série :</text>
<text x="114" y="394" text-anchor="middle" font-size="13.0" font-weight="500" fill="#1c2530">courant faible</text>
<rect x="220" y="346" width="196" height="64" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="318" y="372" text-anchor="middle" font-size="13.7" font-weight="800" fill="#1c2530">tension de contact</text>
<text x="318" y="394" text-anchor="middle" font-size="12.3" font-weight="500" fill="#1c2530">Uc = R(terre) × I(défaut)</text>
<rect x="424" y="346" width="196" height="64" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="522" y="372" text-anchor="middle" font-size="13.7" font-weight="800" fill="#1c2530">R ≤ UL / IΔn</text>
<text x="522" y="394" text-anchor="middle" font-size="13.0" font-weight="800" fill="#2166d1">50 V / 0,5 A = 100 Ω</text>
<text x="320" y="432" text-anchor="middle" font-size="12.3" font-weight="500" fill="#5b6673">Avec un différentiel 500 mA : prise de terre de 100 Ω au maximum</text>
</svg>
