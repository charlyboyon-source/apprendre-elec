<text x="95" y="256" text-anchor="middle" font-size="15.6" font-weight="800" fill="#b85a08">PANNEAUX</text>
<text x="95" y="278" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">courant continu</text>
<text x="95" y="298" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">tension variable</text>
<text x="305" y="256" text-anchor="middle" font-size="15.6" font-weight="800" fill="#b85a08">ONDULEUR</text>
<text x="305" y="278" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">il convertit</text>
<text x="305" y="298" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">et se synchronise</text>
<text x="535" y="256" text-anchor="middle" font-size="15.6" font-weight="800" fill="#b85a08">INSTALLATION</text>
<text x="535" y="278" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">alternatif</text>
<text x="535" y="298" text-anchor="middle" font-size="13.7" font-weight="800" fill="#1c2530">230 V · 50 Hz</text>
<rect x="24" y="316" width="592" height="58" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="340.5" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">Si le réseau est coupé, l'onduleur s'arrête</text>
<text x="320" y="361.5" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">c'est le découplage : il protège ceux qui travaillent sur le réseau</text>
<text x="320" y="404" text-anchor="middle" font-size="13.7" font-weight="500" fill="#5b6673">Micro-onduleurs : un petit onduleur sous chaque panneau</text>
