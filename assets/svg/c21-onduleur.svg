<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'onduleur transforme le courant continu des panneaux en courant alternatif 230 V 50 Hz, synchronisé avec le réseau ; il s'arrête si le réseau disparaît">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">L'onduleur : du continu à l'alternatif</text>
<rect x="12" y="38" width="90" height="50" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="57" y="53" text-anchor="middle" font-size="8.5" fill="#5aa9e6" font-weight="bold">PANNEAUX</text>
<text x="57" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">courant continu</text>
<text x="57" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">tension variable</text>
<polyline points="105,63.0 110,63.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,63.0 108,59.0 108,67.0" fill="#9aa6b3"/>
<rect x="115" y="38" width="90" height="50" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="160" y="53" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">ONDULEUR</text>
<text x="160" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">il convertit</text>
<text x="160" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">et se synchronise</text>
<polyline points="208,63.0 213,63.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,63.0 211,59.0 211,67.0" fill="#9aa6b3"/>
<rect x="218" y="38" width="90" height="50" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="263" y="53" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">INSTALLATION</text>
<text x="263" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">alternatif</text>
<text x="263" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">230 V · 50 Hz</text>
<rect x="12" y="104" width="296" height="34" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="160" y="118" text-anchor="middle" font-size="9" fill="#e85b50" font-weight="bold">Si le réseau est coupé, l'onduleur s'arrête</text>
<text x="160" y="131" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">c'est le découplage : il protège ceux qui travaillent sur le réseau</text>
<text x="160" y="162" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">Micro-onduleurs : un petit onduleur sous chaque panneau</text>
</svg>
