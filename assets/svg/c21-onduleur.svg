<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'onduleur convertit le courant continu des panneaux, à tension variable, en courant alternatif 230 V 50 Hz, synchronisé au réseau. Si le réseau est coupé, il s'arrête : c'est le découplage">
