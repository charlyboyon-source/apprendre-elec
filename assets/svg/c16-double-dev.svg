<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Double allumage : un interrupteur double commande deux points lumineux indépendants E1 et E2 ; la phase est commune aux deux contacts S1 et S2">
