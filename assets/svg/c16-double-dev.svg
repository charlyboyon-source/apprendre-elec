<text x="302" y="140" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">S2</text>
<path d="M280 164 V214" fill="none" stroke="#f28c28" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(280 230) rotate(0)"><circle r="15" fill="#ffffff" stroke="#1c2530" stroke-width="2.6"/><path d="M-10.5 -10.5 L10.5 10.5 M10.5 -10.5 L-10.5 10.5" stroke="#1c2530" stroke-width="2.4"/></g>
<text x="308" y="236" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">E2</text>
<path d="M280 245 V300" fill="none" stroke="#2166d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="190" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">interrupteur double</text>
<text x="420" y="104" text-anchor="start" font-size="16.2" font-weight="800" fill="#1c2530">1 interrupteur</text>
<text x="420" y="126" text-anchor="start" font-size="16.2" font-weight="800" fill="#1c2530">double</text>
<text x="420" y="176" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">2 points lumineux</text>
<text x="420" y="198" text-anchor="start" font-size="15.0" font-weight="500" fill="#1c2530">indépendants</text>
