<text x="420" y="270" text-anchor="start" font-size="15.0" font-weight="800" fill="#d92b2b">commune aux deux</text>
<rect x="24" y="340" width="592" height="52" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="361.5" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">Deux simples allumages réunis</text>
<text x="320" y="382.5" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">dans le même appareil</text>
