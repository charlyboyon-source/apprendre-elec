<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Schéma développé du double allumage : la phase alimente deux contacts S1 et S2 ; chacun commande son point lumineux E1 ou E2 ; les deux lampes reviennent au même neutre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Double allumage : le schéma développé</text>
<polyline points="30,44 190,44" fill="none" stroke="#e85b50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="38" text-anchor="start" font-size="7.5" fill="#e85b50" font-weight="bold">phase</text>
<polyline points="30,150 190,150" fill="none" stroke="#5aa9e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="164" text-anchor="start" font-size="7.5" fill="#5aa9e6" font-weight="bold">neutre</text>
<polyline points="80,44 80,66" fill="none" stroke="#e85b50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="80" cy="68" r="2.4" fill="#e8eaed"/><circle cx="80" cy="92" r="2.4" fill="#e8eaed"/>
<polyline points="80,92 70,70" fill="none" stroke="#e8eaed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="80,92 80,112" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="80" cy="122" r="9" fill="#1c1f24" stroke="#ffd23f" stroke-width="2"/>
<polyline points="73.7,115.7 86.3,128.3" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="73.7,128.3 86.3,115.7" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="80,132 80,150" fill="none" stroke="#5aa9e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="92" y="84" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="bold">S1</text>
<text x="94" y="126" text-anchor="start" font-size="8" fill="#ffd23f" font-weight="bold">E1</text>
<polyline points="146,44 146,66" fill="none" stroke="#e85b50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="146" cy="68" r="2.4" fill="#e8eaed"/><circle cx="146" cy="92" r="2.4" fill="#e8eaed"/>
<polyline points="146,92 136,70" fill="none" stroke="#e8eaed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="146,92 146,112" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="146" cy="122" r="9" fill="#1c1f24" stroke="#ffd23f" stroke-width="2"/>
<polyline points="139.7,115.7 152.3,128.3" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="139.7,128.3 152.3,115.7" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="146,132 146,150" fill="none" stroke="#5aa9e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="158" y="84" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="bold">S2</text>
<text x="160" y="126" text-anchor="start" font-size="8" fill="#ffd23f" font-weight="bold">E2</text>
<text x="204" y="62" text-anchor="start" font-size="9" fill="#ffd23f" font-weight="bold">1 interrupteur</text>
<text x="204" y="73" text-anchor="start" font-size="9" fill="#ffd23f" font-weight="bold">double</text>
<text x="204" y="98" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">2 points lumineux</text>
<text x="204" y="110" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">indépendants</text>
<text x="204" y="136" text-anchor="start" font-size="8" fill="#e85b50" font-weight="normal">la phase est</text>
<text x="204" y="146" text-anchor="start" font-size="8" fill="#e85b50" font-weight="normal">commune aux deux</text>
<text x="160" y="178" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Deux simples allumages réunis dans le même appareil</text>
</svg>
