<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Schéma développé d'une minuterie : dans le circuit de commande, les boutons-poussoirs en parallèle relient la phase à l'entrée de commande de la minuterie, elle-même reliée au neutre ; dans le circuit de puissance, le contact temporisé de la minuterie alimente la lampe E1 reliée au neutre">
