<text x="540" y="428" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b85a08">Circuit de puissance</text>
<path d="M244 290 L500 290 L500 172 L524 172" fill="none" stroke="#5b6673" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="372" y="282" text-anchor="middle" font-size="11.5" font-weight="500" fill="#5b6673">un appui ferme le contact ;</text>
<text x="372" y="308" text-anchor="middle" font-size="11.5" font-weight="500" fill="#5b6673">il se rouvre seul après la durée réglée</text>
