<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Simple allumage : un interrupteur S1 et un point lumineux E1. Interrupteur ouvert, la lampe est éteinte ; fermé, elle s'allume. En orange, le retour lampe">
