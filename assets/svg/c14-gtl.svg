<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'espace technique électrique du logement regroupe le panneau de contrôle avec le compteur et l'AGCP, le tableau de répartition et le tableau de communication">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Tout au même endroit : l'ETEL</text>
<rect x="40" y="30" width="86" height="146" rx="6" fill="#24282f" stroke="#ffd23f" stroke-width="2"/>
<rect x="50" y="40" width="66" height="36" rx="4" fill="#ff8c2b" fill-opacity="0.18" stroke="#ff8c2b" stroke-width="1.5"/>
<rect x="50" y="84" width="66" height="36" rx="4" fill="#4cd97b" fill-opacity="0.18" stroke="#4cd97b" stroke-width="1.5"/>
<rect x="50" y="128" width="66" height="36" rx="4" fill="#5aa9e6" fill-opacity="0.18" stroke="#5aa9e6" stroke-width="1.5"/>
<text x="144" y="54" text-anchor="start" font-size="9" fill="#ff8c2b" font-weight="bold">panneau de contrôle</text>
<text x="144" y="66" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">le compteur et l'AGCP</text>
<text x="144" y="98" text-anchor="start" font-size="9" fill="#4cd97b" font-weight="bold">tableau de répartition</text>
<text x="144" y="110" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">les protections des circuits</text>
<text x="144" y="142" text-anchor="start" font-size="9" fill="#5aa9e6" font-weight="bold">tableau de communication</text>
<text x="144" y="154" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">téléphone, internet, télévision</text>
<text x="214" y="182" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">Courant fort et communication, réunis</text>
</svg>
