<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Schéma multifilaire : un trait par conducteur, chacun à sa couleur, jusqu'aux bornes de l'appareil : ici la phase, le neutre et la protection d'une prise de courant">
