<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Les quatre formules : U = R × I la loi d'Ohm, P = U × I la puissance, P = R × I² l'effet Joule, E = P × t l'énergie">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Les quatre formules du bloc</text>
<rect x="12" y="28" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="33" width="4" height="23" rx="2" fill="#ffd23f"/>
<text x="24" y="47.5" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">U = R × I</text>
<text x="104" y="42.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">la loi d'Ohm</text>
<text x="104" y="54.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">volts = ohms × ampères</text>
<rect x="12" y="66" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="71" width="4" height="23" rx="2" fill="#ff8c2b"/>
<text x="24" y="85.5" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">P = U × I</text>
<text x="104" y="80.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">la puissance</text>
<text x="104" y="92.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">watts = volts × ampères</text>
<rect x="12" y="104" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="109" width="4" height="23" rx="2" fill="#e85b50"/>
<text x="24" y="123.5" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">P = R × I²</text>
<text x="104" y="118.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">l'effet Joule</text>
<text x="104" y="130.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">la chaleur dégagée</text>
<rect x="12" y="142" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="147" width="4" height="23" rx="2" fill="#4cd97b"/>
<text x="24" y="161.5" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">E = P × t</text>
<text x="104" y="156.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">l'énergie</text>
<text x="104" y="168.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">kilowattheures = kW × heures</text>
</svg>
