<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170" viewBox="0 0 300 170" role="img" aria-label="Décodage des symboles d'habilitation">
  <text x="150" y="30" text-anchor="middle" font-size="22" fill="#ffd23f" font-family="monospace" font-weight="bold">B R</text>
  <line x1="138" y1="36" x2="110" y2="54" stroke="#e8744f" stroke-width="1"/>
  <line x1="162" y1="36" x2="195" y2="54" stroke="#5ab0f0" stroke-width="1"/>
  <g font-family="monospace" font-size="8.5">
  <text x="70" y="64" text-anchor="middle" fill="#e8744f" font-weight="bold">1re lettre : TENSION</text>
  <text x="20" y="84" fill="#e8ecf0">B = basse tension</text>
  <text x="20" y="98" fill="#9aa6b3">H = haute tension</text>
  <text x="230" y="64" text-anchor="middle" fill="#5ab0f0" font-weight="bold">2e caractère : RÔLE</text>
  <text x="160" y="84" fill="#9aa6b3">0 = non électricien</text>
  <text x="160" y="98" fill="#9aa6b3">1 = exécutant</text>
  <text x="160" y="112" fill="#9aa6b3">2 = chargé de travaux</text>
  <text x="160" y="126" fill="#e8ecf0">R = intervention générale</text>
  <text x="160" y="140" fill="#e8ecf0">S = interv. élémentaire</text>
  </g>
  <text x="70" y="116" font-size="8" fill="#9aa6b3" font-family="monospace">V = au voisinage</text>
  <text x="70" y="130" font-size="8" fill="#9aa6b3" font-family="monospace">C = consignation</text>
  <text x="150" y="162" text-anchor="middle" font-size="7.5" fill="#5b6775" font-family="monospace">Ex. B0 peintre · BS petit dépannage · BR dépanneur</text>
</svg>