<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 194" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Montage en parallèle : chaque récepteur a sa dérivation entre les deux mêmes points, la même tension pour tous, les courants s'additionnent, 1/Re = 1/R1 + 1/R2">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">En parallèle : chacun sa dérivation</text>
<polyline points="40,56 250,56" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="40,126 250,126" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="40,56 40,126" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="31" y="77" width="18" height="28" rx="4" fill="#24282f" stroke="#ffd23f" stroke-width="2"/>
<text x="40" y="94.5" text-anchor="middle" font-size="10" fill="#ffd23f" font-weight="bold">G</text>
<polyline points="150,56 150,126" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="135.0" y="83" width="30" height="16" rx="2" fill="#24282f" stroke="#ff8c2b" stroke-width="2"/>
<text x="150" y="94.5" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">R1</text>
<polygon points="150,75 146,67 154,67" fill="#ffd23f"/>
<polyline points="250,56 250,126" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="235.0" y="83" width="30" height="16" rx="2" fill="#24282f" stroke="#ff8c2b" stroke-width="2"/>
<text x="250" y="94.5" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">R2</text>
<polygon points="250,75 246,67 254,67" fill="#ffd23f"/>
<circle cx="150" cy="56" r="3" fill="#ff8c2b"/><circle cx="150" cy="126" r="3" fill="#ff8c2b"/>
<text x="96" y="95" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">même U</text>
<text x="200" y="95" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">I1 + I2</text>
<text x="160" y="152" text-anchor="middle" font-size="13" fill="#e8eaed" font-weight="bold">1/Re = 1/R1 + 1/R2</text>
<text x="160" y="168" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">les courants s'additionnent</text>
<text x="160" y="185" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">C'est le montage du logement</text>
</svg>
