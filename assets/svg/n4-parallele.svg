<text x="204" y="70" text-anchor="middle" font-size="14.3" font-weight="800" fill="#d92b2b">I1 + I2</text>
<path d="M260 120 L260.0 140.0" stroke="#2166d1" stroke-width="3"/><polygon points="260.0,148.0 266.0,136.0 254.0,136.0" fill="#2166d1"/>
<path d="M420 120 L420.0 140.0" stroke="#2166d1" stroke-width="3"/><polygon points="420.0,148.0 426.0,136.0 414.0,136.0" fill="#2166d1"/>
<text x="340" y="334" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">même U</text>
<rect x="470" y="80" width="154" height="220" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="547" y="126" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">1/Re =</text>
<text x="547" y="152" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">1/R1 + 1/R2</text>
<text x="547" y="206" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">les courants</text>
<text x="547" y="226" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">s'additionnent</text>
<rect x="24" y="350" width="592" height="46" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="379.0" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">C'est le montage du logement</text>
</svg>
