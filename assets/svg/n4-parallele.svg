<rect x="410" y="150" width="20" height="80" fill="#fff"/>
<g transform="translate(420 190) rotate(90)"><rect x="-24" y="-10" width="48" height="20" fill="#fff" stroke="#1c2530" stroke-width="2.6"/></g>
