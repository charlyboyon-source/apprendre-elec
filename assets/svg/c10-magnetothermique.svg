<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le disjoncteur magnétothermique réunit deux déclencheurs : le bilame, thermique, contre la surcharge ; l'électroaimant, magnétique, contre le court-circuit">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Un disjoncteur, deux déclencheurs</text>
<rect x="12" y="28" width="144" height="138" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="9.5" fill="#ff8c2b" font-weight="bold">THERMIQUE</text>
<text x="84" y="68" text-anchor="middle" font-size="10" fill="#ff8c2b" font-weight="bold">le BILAME</text>
<text x="84" y="83" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="98" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">il chauffe et se déforme</text>
<text x="84" y="113" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="128" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">contre la SURCHARGE</text>
<text x="84" y="143" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="158" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">déclenchement temporisé</text>
<rect x="164" y="28" width="144" height="138" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="9.5" fill="#e85b50" font-weight="bold">MAGNÉTIQUE</text>
<text x="236" y="68" text-anchor="middle" font-size="10" fill="#e85b50" font-weight="bold">l'ÉLECTROAIMANT</text>
<text x="236" y="83" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="98" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">il attire un noyau</text>
<text x="236" y="113" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="128" text-anchor="middle" font-size="8.2" fill="#e8eaed" font-weight="bold">contre le COURT-CIRCUIT</text>
<text x="236" y="143" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="158" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">déclenchement instantané</text>
<text x="160" y="182" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Après un déclenchement : chercher la cause, puis réarmer</text>
</svg>
