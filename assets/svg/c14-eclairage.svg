<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un circuit d'éclairage : conducteurs de 1,5 mm², disjoncteur de 16 A au maximum, 8 points lumineux au maximum ; au moins deux circuits dans un logement de plus de 35 m²">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le circuit d'éclairage</text>
<rect x="12" y="34" width="90" height="62" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="57" y="58" text-anchor="middle" font-size="15" fill="#ff8c2b" font-weight="bold">1,5 mm²</text>
<text x="57" y="75" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">la section</text>
<text x="57" y="87" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">des conducteurs</text>
<rect x="115" y="34" width="90" height="62" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="160" y="58" text-anchor="middle" font-size="15" fill="#ffd23f" font-weight="bold">16 A</text>
<text x="160" y="75" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">le disjoncteur</text>
<text x="160" y="87" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">au maximum</text>
<rect x="218" y="34" width="90" height="62" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="263" y="58" text-anchor="middle" font-size="15" fill="#4cd97b" font-weight="bold">8 points</text>
<text x="263" y="75" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">lumineux</text>
<text x="263" y="87" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">par circuit, au plus</text>
<rect x="40" y="110" width="240" height="28" rx="9" fill="#ffd23f" stroke="#ffd23f" stroke-width="1.2" fill-opacity="0.07"/>
<text x="160" y="128" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">Au moins 2 circuits au-delà de 35 m²</text>
<text x="160" y="162" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">Un circuit en panne ne doit pas plonger tout le logement dans le noir</text>
</svg>
