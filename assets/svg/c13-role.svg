<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un conduit a deux rôles : protéger mécaniquement les conducteurs, et permettre de les remplacer sans casser le mur">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Un conduit : deux rôles</text>
<rect x="12" y="28" width="144" height="118" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">PROTÉGER</text>
<text x="84" y="68" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">les conducteurs isolés</text>
<text x="84" y="83" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">n'ont que leur isolant</text>
<text x="84" y="98" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="113" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">le conduit encaisse</text>
<text x="84" y="128" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">les chocs et les frottements</text>
<rect x="164" y="28" width="144" height="118" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="9.5" fill="#4cd97b" font-weight="bold">REMPLACER</text>
<text x="236" y="68" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">un fil abîmé ou trop fin</text>
<text x="236" y="83" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">doit pouvoir être retiré</text>
<text x="236" y="98" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="113" text-anchor="middle" font-size="8.2" fill="#4cd97b" font-weight="bold">on le tire et on en repasse</text>
<text x="236" y="128" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">un autre, sans casser le mur</text>
<text x="160" y="166" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Des conducteurs isolés ne se posent jamais sans protection</text>
</svg>
