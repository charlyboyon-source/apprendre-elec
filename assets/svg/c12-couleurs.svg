<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Couleurs des conducteurs : phase en rouge, marron ou noir ; neutre toujours en bleu clair ; conducteur de protection toujours en vert-jaune">
<defs>
