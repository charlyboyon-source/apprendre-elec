<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Couleurs des conducteurs : phase en rouge, marron ou noir ; neutre toujours en bleu clair ; conducteur de protection toujours en vert-jaune">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Les couleurs ne se choisissent pas au hasard</text>
<rect x="12" y="32" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="37" width="4" height="26" rx="2" fill="#e85b50"/>
<text x="24" y="53.0" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">PHASE</text>
<text x="100" y="47.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">rouge, marron ou noir</text>
<text x="100" y="59.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">toute couleur sauf bleu clair et vert/jaune</text>
<rect x="12" y="74" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="79" width="4" height="26" rx="2" fill="#5aa9e6"/>
<text x="24" y="95.0" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">NEUTRE</text>
<text x="100" y="89.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">bleu clair</text>
<text x="100" y="101.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">couleur réservée au neutre</text>
<rect x="12" y="116" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="121" width="4" height="26" rx="2" fill="#4cd97b"/>
<text x="24" y="137.0" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">PROTECTION</text>
<text x="100" y="131.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">vert/jaune</text>
<text x="100" y="143.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">couleur réservée à la terre</text>
<text x="160" y="170" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">Bleu clair et vert/jaune : jamais pour autre chose</text>
</svg>
