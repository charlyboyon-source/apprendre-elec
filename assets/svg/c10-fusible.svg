<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le fusible : son élément fond quand le courant dépasse son calibre ; il ne se réarme pas, on le remplace par un fusible neuf de même calibre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le fusible : il fond pour protéger</text>
<rect x="30" y="52" width="120" height="26" rx="5" fill="#24282f" stroke="#e8eaed" stroke-width="1.8"/><rect x="22" y="55" width="12" height="20" rx="2" fill="#9aa6b3"/><rect x="146" y="55" width="12" height="20" rx="2" fill="#9aa6b3"/>
<polyline points="38,65 142,65" fill="none" stroke="#ffd23f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="104" width="120" height="26" rx="5" fill="#24282f" stroke="#e8eaed" stroke-width="1.8"/><rect x="22" y="107" width="12" height="20" rx="2" fill="#9aa6b3"/><rect x="146" y="107" width="12" height="20" rx="2" fill="#9aa6b3"/>
<polyline points="38,117 78,117" fill="none" stroke="#5a626e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="104,117 142,117" fill="none" stroke="#5a626e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="84,111 90,117 86,123" fill="none" stroke="#e85b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="98,111 94,117 99,123" fill="none" stroke="#e85b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="62" text-anchor="start" font-size="9" fill="#4cd97b" font-weight="bold">en service</text>
<text x="176" y="74" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">l'élément conduit le courant</text>
<text x="176" y="114" text-anchor="start" font-size="9" fill="#e85b50" font-weight="bold">fondu</text>
<text x="176" y="126" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">le circuit est ouvert</text>
<text x="160" y="160" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">Il ne se réarme pas : on le remplace, au même calibre</text>
</svg>
