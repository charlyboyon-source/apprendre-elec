<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un atome : un noyau positif entouré d'électrons négatifs ; dans un métal, des électrons libres passent d'un atome à l'autre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">L'atome et ses électrons</text>
<ellipse cx="92" cy="100" rx="56" ry="22" fill="none" stroke="#5a626e" stroke-width="1.4" transform="rotate(28 92 100)"/><ellipse cx="92" cy="100" rx="56" ry="22" fill="none" stroke="#5a626e" stroke-width="1.4" transform="rotate(-28 92 100)"/>
<circle cx="92" cy="100" r="14" fill="#e85b50"/>
<text x="92" y="105" text-anchor="middle" font-size="14" fill="#1c1f24" font-weight="bold">+</text>
<circle cx="43" cy="74" r="5" fill="#5aa9e6"/>
<circle cx="141" cy="126" r="5" fill="#5aa9e6"/>
<circle cx="43" cy="126" r="5" fill="#5aa9e6"/>
<circle cx="168" cy="62" r="5" fill="#ffd23f"/>
<polyline points="176,62 196,62" fill="none" stroke="#ffd23f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="203,62 195,58 195,66" fill="#ffd23f"/>
<text x="210" y="58" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">électron libre</text>
<text x="210" y="69" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">il quitte son atome</text>
<text x="210" y="98" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">noyau</text>
<text x="210" y="109" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">charge positive (+)</text>
<text x="210" y="132" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">électrons</text>
<text x="210" y="143" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">charge négative (−)</text>
<text x="160" y="181" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Dans un métal, les électrons libres passent d'atome en atome</text>
</svg>
