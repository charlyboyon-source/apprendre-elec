<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Montage 3 fils : la commande et la puissance utilisent la même phase. Trois conducteurs relient le télérupteur à l'installation : la phase vers les boutons-poussoirs, le retour des boutons-poussoirs, le retour lampe">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le montage 3 fils</text>
<rect x="12" y="38" width="90" height="50" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="57" y="53" text-anchor="middle" font-size="8.5" fill="#e85b50" font-weight="bold">PHASE</text>
<text x="57" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">vers tous</text>
<text x="57" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">les boutons-poussoirs</text>
<polyline points="105,63.0 110,63.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,63.0 108,59.0 108,67.0" fill="#9aa6b3"/>
<rect x="115" y="38" width="90" height="50" rx="9" fill="#24282f" stroke="#e8eaed" stroke-width="1.2" />
<text x="160" y="53" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">RETOUR BP</text>
<text x="160" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">des boutons-poussoirs</text>
<text x="160" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">vers la borne A1</text>
<polyline points="208,63.0 213,63.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,63.0 211,59.0 211,67.0" fill="#9aa6b3"/>
<rect x="218" y="38" width="90" height="50" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="263" y="53" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">RETOUR LAMPE</text>
<text x="263" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">de la borne 2</text>
<text x="263" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">vers les lampes</text>
<rect x="12" y="104" width="296" height="34" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="160" y="118" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">Une seule phase pour la commande et la puissance</text>
<text x="160" y="131" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">A2 au neutre · borne 1 à la phase</text>
<text x="160" y="160" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">À chaque bouton-poussoir : 2 fils, la phase et le retour</text>
<text x="160" y="178" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Le montage le plus courant en logement</text>
</svg>
