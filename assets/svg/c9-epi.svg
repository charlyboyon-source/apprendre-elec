<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Protections individuelles : gants isolants, écran facial, casque isolant, chaussures de sécurité. Protections collectives : nappes isolantes, balisage, cadenas de condamnation">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Se protéger : individuel et collectif</text>
<rect x="12" y="30" width="144" height="118" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="84" y="47" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">INDIVIDUEL (EPI)</text>
<circle cx="26" cy="64" r="2.4" fill="#ffd23f"/>
<text x="34" y="67" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">gants isolants vérifiés</text>
<circle cx="26" cy="80" r="2.4" fill="#ffd23f"/>
<text x="34" y="83" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">écran facial</text>
<circle cx="26" cy="96" r="2.4" fill="#ffd23f"/>
<text x="34" y="99" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">casque isolant</text>
<circle cx="26" cy="112" r="2.4" fill="#ffd23f"/>
<text x="34" y="115" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">chaussures de sécurité</text>
<circle cx="26" cy="128" r="2.4" fill="#ffd23f"/>
<text x="34" y="131" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">vêtements couvrants</text>
<rect x="164" y="30" width="144" height="118" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="236" y="47" text-anchor="middle" font-size="9" fill="#5aa9e6" font-weight="bold">COLLECTIF</text>
<circle cx="178" cy="64" r="2.4" fill="#5aa9e6"/>
<text x="186" y="67" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">nappes isolantes</text>
<circle cx="178" cy="80" r="2.4" fill="#5aa9e6"/>
<text x="186" y="83" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">balisage de la zone</text>
<circle cx="178" cy="96" r="2.4" fill="#5aa9e6"/>
<text x="186" y="99" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">cadenas de condamnation</text>
<circle cx="178" cy="112" r="2.4" fill="#5aa9e6"/>
<text x="186" y="115" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">pancartes</text>
<text x="160" y="168" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">Un EPI abîmé ne protège plus : on le contrôle avant chaque usage</text>
</svg>
