<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Circuits spécialisés : plaque de cuisson en 6 mm² sous 32 A ; lave-linge, four, lave-vaisselle et chauffe-eau en 2,5 mm² sous 20 A chacun ; VMC en 1,5 mm² sous 2 A">
