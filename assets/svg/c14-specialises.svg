<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Circuits spécialisés : plaque de cuisson en 6 mm² sous 32 A ; lave-linge, four, lave-vaisselle et chauffe-eau en 2,5 mm² sous 20 A chacun ; VMC en 1,5 mm² sous 2 A">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Les circuits spécialisés : un appareil, un circuit</text>
<rect x="12" y="30" width="296" height="34" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="35" width="4" height="24" rx="2" fill="#e85b50"/>
<text x="24" y="50.0" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">PLAQUE DE CUISSON</text>
<text x="132" y="50.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">6 mm² · disjoncteur 32 A</text>
<rect x="12" y="70" width="296" height="34" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="75" width="4" height="24" rx="2" fill="#ff8c2b"/>
<text x="24" y="90.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">LAVE-LINGE, FOUR…</text>
<text x="132" y="84.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">2,5 mm² · disjoncteur 20 A</text>
<text x="132" y="96.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">lave-vaisselle, sèche-linge, chauffe-eau</text>
<rect x="12" y="110" width="296" height="34" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="115" width="4" height="24" rx="2" fill="#5aa9e6"/>
<text x="24" y="130.0" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">VMC</text>
<text x="132" y="130.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">1,5 mm² · disjoncteur 2 A</text>
<rect x="40" y="152" width="240" height="28" rx="9" fill="#ffd23f" stroke="#ffd23f" stroke-width="1.2" fill-opacity="0.07"/>
<text x="160" y="170" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">Au moins 4 circuits spécialisés par logement</text>
