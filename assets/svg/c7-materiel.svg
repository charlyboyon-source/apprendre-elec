<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Matériel autorisé par volume. Volume 0 : IPX7, TBTS 12 V uniquement. Volume 1 : IPX4, TBTS 12 V, chauffe-eau instantané. Volume 2 : IPX4, classe II, prise rasoir 20 à 50 VA. Hors volume : prises et interrupteurs 230 V, lave-linge, sous DDR 30 mA">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Ce qui est admis, volume par volume</text>
<rect x="12" y="28" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="33" width="4" height="23" rx="2" fill="#5aa9e6"/>
<text x="24" y="48" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">VOLUME 0</text>
<text x="104" y="42" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IPX7</text>
<text x="104" y="54" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">TBTS 12 V uniquement</text>
<rect x="12" y="66" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="71" width="4" height="23" rx="2" fill="#ff8c2b"/>
<text x="24" y="86" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">VOLUME 1</text>
<text x="104" y="80" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IPX4 (IPX5 si jets horizontaux)</text>
<text x="104" y="92" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">TBTS 12 V · chauffe-eau instantané</text>
<rect x="12" y="104" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="109" width="4" height="23" rx="2" fill="#ffd23f"/>
<text x="24" y="124" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">VOLUME 2</text>
<text x="104" y="118" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IPX4 (IPX5 si jets horizontaux)</text>
<text x="104" y="130" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">classe II · prise rasoir 20 à 50 VA</text>
<rect x="12" y="142" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="147" width="4" height="23" rx="2" fill="#4cd97b"/>
<text x="24" y="162" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">HORS VOLUME</text>
<text x="104" y="156" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">prises et interrupteurs 230 V</text>
<text x="104" y="168" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">lave-linge · tout sous DDR 30 mA</text>
<text x="160" y="191" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Volume caché : matériel IPX4 + 30 mA, jamais d'appareillage</text>
</svg>
