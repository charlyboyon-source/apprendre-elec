<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Principe du DDR : la phase et le neutre traversent un tore ; courants égaux, rien ne se passe ; s'ils diffèrent à cause d'une fuite vers la terre, le DDR coupe. Sensibilité 30 mA pour les personnes, 300 ou 500 mA contre l'incendie">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le DDR compare la phase et le neutre</text>
<polyline points="20,62 300,62" fill="none" stroke="#e85b50" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="20,92 300,92" fill="none" stroke="#5aa9e6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="130" cy="77" rx="14" ry="33" fill="none" stroke="#ffd23f" stroke-width="6"/>
<polygon points="75,62 67,58 67,66" fill="#e85b50"/>
<polygon points="65,92 73,88 73,96" fill="#5aa9e6"/>
<text x="60" y="53" text-anchor="middle" font-size="8" fill="#e85b50" font-weight="bold">I phase</text>
<text x="60" y="107" text-anchor="middle" font-size="8" fill="#5aa9e6" font-weight="bold">I neutre</text>
<text x="130" y="124" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">tore</text>
<polyline points="252,62 252,112" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<polygon points="252,119 248,111 256,111" fill="#ff8c2b"/>
<text x="244" y="112" text-anchor="end" font-size="7.5" fill="#ff8c2b" font-weight="normal">fuite vers la terre</text>
<text x="252" y="53" text-anchor="middle" font-size="7.5" fill="#ff8c2b" font-weight="bold">défaut</text>
<rect x="14" y="134" width="142" height="24" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="85" y="149.5" text-anchor="middle" font-size="8" fill="#4cd97b" font-weight="normal">égaux : rien ne se passe</text>
<rect x="164" y="134" width="142" height="24" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="235" y="149.5" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">différents : il coupe</text>
<rect x="14" y="166" width="142" height="26" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="85" y="183" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"><tspan fill="#4cd97b" font-weight="bold" font-size="10">30 mA</tspan> : les personnes</text>
<rect x="164" y="166" width="142" height="26" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="235" y="183" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"><tspan fill="#ff8c2b" font-weight="bold" font-size="10">300 / 500 mA</tspan> : incendie</text>
</svg>
