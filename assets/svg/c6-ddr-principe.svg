<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Vue en coupe d'un dispositif différentiel : la phase et le neutre traversent un tore. Si leurs courants sont égaux, rien ne se passe ; s'ils diffèrent, à cause d'une fuite vers la terre, la bobine de détection fait déclencher l'appareil">
