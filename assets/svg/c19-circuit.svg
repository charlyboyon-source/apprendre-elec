<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Circuit du chauffe-eau : circuit spécialisé en 2,5 mm², disjoncteur 20 A, protégé par un différentiel 30 mA du logement, raccordé sans prise de courant. Exemple : 2 300 W sous 230 V, 10 A">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<linearGradient id="icta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949c"/><stop offset=".3" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6b727a"/></linearGradient>
<linearGradient id="tpc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b02020"/><stop offset=".3" stop-color="#ff6b5e"/><stop offset="1" stop-color="#8e1414"/></linearGradient>
<linearGradient id="irl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1b9"/><stop offset=".3" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8d949c"/></linearGradient>
<linearGradient id="terre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a877"/><stop offset="1" stop-color="#a98557"/></linearGradient>
<pattern id="vj" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2e9e4f"/><rect width="7" height="16" fill="#f2d21a"/></pattern>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
<linearGradient id="cellule" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4a8a"/><stop offset="1" stop-color="#16285a"/></linearGradient>
<linearGradient id="cuve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset=".55" stop-color="#ffb3a0"/><stop offset="1" stop-color="#7fb8f0"/></linearGradient>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Le circuit du chauffe-eau</text>
<g filter="url(#ombre)"><rect x="30" y="56" width="124" height="150" rx="12" fill="#f7f8f9" stroke="#c5cad0"/></g>
<rect x="38" y="107.69999999999999" width="108" height="12.6" fill="url(#acierH)" stroke="#9aa1a9" stroke-width=".6"/>
<g transform="translate(42 72) scale(0.35)"><rect width="140" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="140" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="35" y="30"/><use href="#borne" x="105" y="30"/><use href="#borne" x="35" y="210"/><use href="#borne" x="105" y="210"/><rect x="20" y="72" width="34" height="62" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="24" y="72" width="26" height="34" rx="4" fill="url(#manette)"/><rect x="76" y="72" width="46" height="24" rx="4" fill="#f2a20c" stroke="#b97a05"/><text x="99" y="89" text-anchor="middle" font-size="13" font-weight="800" fill="#3a2a00">TEST</text><text x="99" y="120" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2530">40 A</text><text x="99" y="141" text-anchor="middle" font-size="16" font-weight="800" fill="#2166d1">30 mA</text><g transform="translate(0 -84)"><rect x="18" y="222" width="38" height="24" rx="3" fill="none" stroke="#1c2530" stroke-width="1.4"/><path d="M24 232 q4 -10 8 0 t8 0" fill="none" stroke="#1c2530" stroke-width="1.4"/></g><text x="99" y="166" text-anchor="middle" font-size="14" font-weight="800" fill="#1c2530">type AC</text></g>
<g transform="translate(92 72) scale(0.35)"><rect width="70" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="70" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="20" y="30"/><use href="#borne" x="50" y="30"/><use href="#borne" x="20" y="210"/><use href="#borne" x="50" y="210"/><rect x="18" y="72" width="34" height="56" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="22" y="72" width="26" height="30" rx="4" fill="url(#manette)"/><text x="35" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2530">C20</text><text x="35" y="169" text-anchor="middle" font-size="9" font-weight="500" fill="#5b6673">230 V~</text></g>
<path d="M154 120 H440" fill="none" stroke="#d92b2b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M154 136 H440" fill="none" stroke="#2166d1" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M154 152 H440" fill="none" stroke="#2e9e4f" stroke-width="6" stroke-linejoin="round"/><path d="M154 152 H440" fill="none" stroke="#f2d21a" stroke-width="6" stroke-dasharray="6 6" stroke-linejoin="round"/>
<rect x="436" y="108" width="36" height="56" rx="5" fill="#fff" stroke="#8d949c" stroke-width="2"/>
<g filter="url(#ombre)"><rect x="500" y="52" width="80" height="160" rx="24.0" fill="#f4f5f7" stroke="#8d949c" stroke-width="2"/></g>
<text x="456" y="186" text-anchor="middle" font-size="12.3" font-weight="500" fill="#5b6673">sortie de câble</text>
<rect x="16" y="226" width="196" height="94" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="114" y="256" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">2,5 mm²</text>
<text x="114" y="280" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">la section</text>
<text x="114" y="300" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">des conducteurs</text>
<rect x="220" y="226" width="196" height="94" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="318" y="256" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">20 A</text>
<text x="318" y="280" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">le disjoncteur</text>
<text x="318" y="300" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">circuit spécialisé</text>
<rect x="424" y="226" width="196" height="94" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="522" y="256" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">30 mA</text>
<text x="522" y="280" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">le différentiel</text>
<text x="522" y="300" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">du logement</text>
<text x="320" y="346" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">2 300 W / 230 V = 10 A</text>
<rect x="24" y="360" width="592" height="40" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="386.0" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">Un circuit pour lui seul, raccordé sans prise de courant</text>
</svg>
