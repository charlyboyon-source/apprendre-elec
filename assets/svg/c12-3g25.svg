<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Lire 3G2,5 : 3 conducteurs, G signifie que l'un d'eux est le vert-jaune, 2,5 est la section en millimètres carrés">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Lire un câble : 3G2,5</text>
<text x="58.666666666666664" y="62" text-anchor="middle" font-size="26" fill="#ffd23f" font-weight="bold">3</text>
<rect x="12.0" y="82" width="93.33333333333333" height="58" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="58.666666666666664" y="98" text-anchor="middle" font-size="8" fill="#ffd23f" font-weight="bold">NOMBRE</text>
<text x="58.666666666666664" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">de conducteurs</text>
<text x="58.666666666666664" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">dans le câble</text>
<text x="160.0" y="62" text-anchor="middle" font-size="26" fill="#4cd97b" font-weight="bold">G</text>
<rect x="113.33333333333333" y="82" width="93.33333333333333" height="58" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="160.0" y="98" text-anchor="middle" font-size="8" fill="#4cd97b" font-weight="bold">TERRE</text>
<text x="160.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">avec un</text>
<text x="160.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">vert/jaune</text>
<text x="261.3333333333333" y="62" text-anchor="middle" font-size="26" fill="#ff8c2b" font-weight="bold">2,5</text>
<rect x="214.66666666666666" y="82" width="93.33333333333333" height="58" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="261.3333333333333" y="98" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">SECTION</text>
<text x="261.3333333333333" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">en mm²</text>
<text x="261.3333333333333" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">de chaque âme</text>
<text x="160" y="160" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">5G1,5 : 5 conducteurs dont le vert/jaune, en 1,5 mm²</text>
</svg>
