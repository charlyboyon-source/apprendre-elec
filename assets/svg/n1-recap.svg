<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Les trois grandeurs : U la tension pousse, en volts ; I l'intensité circule, en ampères ; R la résistance freine, en ohms">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Trois grandeurs à ne plus confondre</text>
<rect x="12" y="36" width="90" height="62" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="57" y="60" text-anchor="middle" font-size="20" fill="#ffd23f" font-weight="bold">U</text>
<text x="57" y="77" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">la tension pousse</text>
<text x="57" y="90" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">en volts (V)</text>
<rect x="115" y="36" width="90" height="62" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="160" y="60" text-anchor="middle" font-size="20" fill="#5aa9e6" font-weight="bold">I</text>
<text x="160" y="77" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">l'intensité circule</text>
<text x="160" y="90" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">en ampères (A)</text>
<rect x="218" y="36" width="90" height="62" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="263" y="60" text-anchor="middle" font-size="20" fill="#ff8c2b" font-weight="bold">R</text>
<text x="263" y="77" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">la résistance freine</text>
<text x="263" y="90" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">en ohms (Ω)</text>
<text x="160" y="122" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">Elles sont liées : c'est la loi d'Ohm</text>
<text x="160" y="142" text-anchor="middle" font-size="8" fill="#e85b50" font-weight="bold">On dit « tension », jamais « voltage »</text>
<text x="160" y="160" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">Suite au module 2</text>
</svg>
