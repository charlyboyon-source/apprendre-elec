<text x="164" y="216" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">électrons libres : ça passe</text>
<text x="164" y="252" text-anchor="middle" font-size="14.3" font-weight="500" fill="#1c2530">cuivre, aluminium</text>
<text x="164" y="274" text-anchor="middle" font-size="14.3" font-weight="500" fill="#5b6673">tous les métaux</text>
