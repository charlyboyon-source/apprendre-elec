<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un conducteur comme le cuivre possède des électrons libres : le courant passe. Un isolant comme le PVC garde ses électrons prisonniers : le courant est bloqué">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Conducteur ou isolant ?</text>
<rect x="12" y="28" width="144" height="148" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="10" fill="#4cd97b" font-weight="bold">CONDUCTEUR</text>
<polygon points="58,74 82,85 82,115 58,104" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="58,74 82,85 82,115 58,104" fill="#ff8c2b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="82,85 110,74 110,104 82,115" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="82,85 110,74 110,104 82,115" fill="#ff8c2b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="58,74 86,63 110,74 82,85" fill="#ff8c2b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="84" y="136" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">électrons libres : ça passe</text>
<text x="84" y="150" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">cuivre, aluminium</text>
<text x="84" y="164" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">tous les métaux</text>
<rect x="164" y="28" width="144" height="148" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="10" fill="#e85b50" font-weight="bold">ISOLANT</text>
<polygon points="210,74 234,85 234,115 210,104" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="210,74 234,85 234,115 210,104" fill="#5a626e" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="234,85 262,74 262,104 234,115" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="234,85 262,74 262,104 234,115" fill="#5a626e" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="210,74 238,63 262,74 234,85" fill="#5a626e" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="236" y="136" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">électrons prisonniers : ça bloque</text>
<text x="236" y="150" text-anchor="middle" font-size="8.5" fill="#9aa6b3" font-weight="bold">PVC, verre, air sec</text>
<text x="236" y="164" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">gaines, capots</text>
</svg>
