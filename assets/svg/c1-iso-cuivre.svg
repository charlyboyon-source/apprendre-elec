<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un conducteur, comme le cuivre, a des électrons libres : le courant passe. Un isolant, comme le PVC, le verre ou l'air sec, garde ses électrons prisonniers : le courant ne passe pas">
