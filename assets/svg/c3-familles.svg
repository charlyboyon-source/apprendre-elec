<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Les cinq familles de composants d'un circuit, dans l'ordre : générateur, protection, commande, récepteur, reliés par les conducteurs">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Les 5 familles de composants</text>
<polyline points="40,104 290,104" fill="none" stroke="#ff8c2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="20,70 36,81 36,107 20,96" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="20,70 36,81 36,107 20,96" fill="#ffd23f" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="36,81 58,70 58,96 36,107" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="36,81 58,70 58,96 36,107" fill="#ffd23f" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="20,70 42,59 58,70 36,81" fill="#ffd23f" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="39" y="48" text-anchor="middle" font-size="11" fill="#ffd23f" font-weight="bold">1</text>
<text x="39" y="126" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">générateur</text>
<text x="39" y="138" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">la source</text>
<polygon points="94,70 110,81 110,107 94,96" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="94,70 110,81 110,107 94,96" fill="#e85b50" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="110,81 132,70 132,96 110,107" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="110,81 132,70 132,96 110,107" fill="#e85b50" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="94,70 116,59 132,70 110,81" fill="#e85b50" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="113" y="48" text-anchor="middle" font-size="11" fill="#e85b50" font-weight="bold">2</text>
<text x="113" y="126" text-anchor="middle" font-size="8.5" fill="#e85b50" font-weight="bold">protection</text>
<text x="113" y="138" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">disjoncteur</text>
<polygon points="168,70 184,81 184,107 168,96" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="168,70 184,81 184,107 168,96" fill="#5aa9e6" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="184,81 206,70 206,96 184,107" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="184,81 206,70 206,96 184,107" fill="#5aa9e6" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="168,70 190,59 206,70 184,81" fill="#5aa9e6" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="187" y="48" text-anchor="middle" font-size="11" fill="#5aa9e6" font-weight="bold">3</text>
<text x="187" y="126" text-anchor="middle" font-size="8.5" fill="#5aa9e6" font-weight="bold">commande</text>
<text x="187" y="138" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">interrupteur</text>
<polygon points="242,70 258,81 258,107 242,96" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="242,70 258,81 258,107 242,96" fill="#4cd97b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="258,81 280,70 280,96 258,107" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="258,81 280,70 280,96 258,107" fill="#4cd97b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="242,70 264,59 280,70 258,81" fill="#4cd97b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="261" y="48" text-anchor="middle" font-size="11" fill="#4cd97b" font-weight="bold">4</text>
<text x="261" y="126" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">récepteur</text>
<text x="261" y="138" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">lampe</text>
<polygon points="75,104 67,100 67,108" fill="#ff8c2b"/>
<polygon points="149,104 141,100 141,108" fill="#ff8c2b"/>
<polygon points="223,104 215,100 215,108" fill="#ff8c2b"/>
<rect x="60" y="150" width="200" height="24" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="160" y="166" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"><tspan fill="#ff8c2b" font-weight="bold" font-size="10">5</tspan> · les <tspan fill="#ff8c2b" font-weight="bold" font-size="9">conducteurs</tspan> relient le tout</text>
</svg>
