<rect x="520" y="121.0" width="60" height="14" rx="2.8" fill="#d92b2b"/><rect x="520" y="123.0" width="60" height="2.8" fill="#fff" opacity=".28"/><ellipse cx="580" cy="128" rx="2.3" ry="7.0" fill="#d92b2b" stroke="#00000033"/>
<rect x="578" y="146.5" width="26" height="7" fill="url(#cuivreH)"/><ellipse cx="604" cy="150" rx="1.4" ry="3.5" fill="#f3c592" stroke="#8f4f17" stroke-width=".8"/>
