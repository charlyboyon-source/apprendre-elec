<circle cx="320" cy="70" r="15" fill="#1c2530"/><text x="320" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">3</text>
<g filter="url(#ombre)"><rect x="288.0" y="118.0" width="64" height="64" rx="9.0" fill="url(#nez)" stroke="#b3b9c0"/></g>
<rect x="299.5" y="129.5" width="41.0" height="41.0" rx="5" fill="#f4f5f7" stroke="#aab1b9"/><path d="M305.9 150.0 H334.1" stroke="#c5cad0"/>
<text x="320" y="256" text-anchor="middle" font-size="13.7" font-weight="800" fill="#b85a08">commande</text>
