<circle cx="443" cy="70" r="15" fill="#1c2530"/><text x="443" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">4</text>
<circle cx="443" cy="140" r="26" fill="#fff1c2" stroke="#ffc21a" stroke-width="2.5"/><path d="M433.9 147.8 q4.4 -13.0 9.1 0 q4.4 13.0 9.1 0" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="431.3" y="163.4" width="23.4" height="16.9" rx="3" fill="url(#acierH)" stroke="#7d858e"/>
<text x="443" y="256" text-anchor="middle" font-size="13.7" font-weight="800" fill="#b85a08">récepteur</text>
<text x="443" y="278" text-anchor="middle" font-size="12.3" font-weight="500" fill="#5b6673">lampe</text>
<rect x="508" y="44" width="116" height="250" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
