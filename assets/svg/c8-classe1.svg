<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Matériel de classe I : isolation principale et borne de terre obligatoire, la masse est reliée au conducteur de protection">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Classe I : la sécurité par la terre</text>
<polygon points="40,62 64,73 64,115 40,104" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,62 64,73 64,115 40,104" fill="#5a626e" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,73 92,62 92,104 64,115" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,73 92,62 92,104 64,115" fill="#5a626e" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,62 68,51 92,62 64,73" fill="#5a626e" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<polyline points="64,115 64,148" fill="none" stroke="#4cd97b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="64,115 64,148" fill="none" stroke="#ffd23f" stroke-width="3" stroke-dasharray="4 5" stroke-linejoin="round"/>
<polyline points="54,150.0 74,150.0" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="57.5,154.5 70.5,154.5" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="61,159.0 67,159.0" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="70" text-anchor="start" font-size="11" fill="#ffd23f" font-weight="bold">CLASSE I</text>
<text x="124" y="88" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">isolation principale</text>
<text x="124" y="102" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">+ borne de terre obligatoire</text>
<text x="124" y="116" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">masse reliée au PE</text>
<text x="124" y="134" text-anchor="start" font-size="7.5" fill="#9aa6b3" font-weight="normal">lave-linge, four, réfrigérateur</text>
<text x="160" y="182" text-anchor="middle" font-size="7.5" fill="#e85b50" font-weight="normal">Sans terre raccordée, un matériel de classe I n'est plus protégé</text>
</svg>
