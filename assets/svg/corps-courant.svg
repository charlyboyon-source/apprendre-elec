<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Deux trajets du courant dans le corps : main vers pied, entre une phase et la terre ; main vers main, entre une phase et le neutre. Dans les deux cas, le courant traverse le thorax, le cœur et les poumons">
