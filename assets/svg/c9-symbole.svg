<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Lire un symbole d'habilitation, exemple B1V : B pour basse tension (H pour haute tension), 1 pour exécutant (0, 1, 2, R, S, C, E selon le rôle), V pour voisinage">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Lire un symbole : l'exemple B1V</text>
<text x="57" y="66" text-anchor="middle" font-size="30" fill="#ffd23f" font-weight="bold">B</text>
<text x="160" y="66" text-anchor="middle" font-size="30" fill="#ff8c2b" font-weight="bold">1</text>
<text x="263" y="66" text-anchor="middle" font-size="30" fill="#4cd97b" font-weight="bold">V</text>
<rect x="12" y="82" width="90" height="62" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="57" y="98" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">LA TENSION</text>
<text x="57" y="116" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">B = basse tension</text>
<text x="57" y="130" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">H = haute tension</text>
<rect x="115" y="82" width="90" height="62" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="160" y="98" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">LE RÔLE</text>
<text x="160" y="116" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">0 · 1 · 2</text>
<text x="160" y="130" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">R · S · C · E</text>
<rect x="218" y="82" width="90" height="62" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="263" y="98" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">L'ATTRIBUT</text>
<text x="263" y="116" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">V = au voisinage</text>
<text x="263" y="130" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">T = sous tension</text>
<text x="160" y="166" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">B1V : basse tension · exécutant · au voisinage</text>
<text x="160" y="182" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">On lit caractère par caractère, de gauche à droite</text>
</svg>
