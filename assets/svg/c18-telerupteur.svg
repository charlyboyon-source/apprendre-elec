<text x="190" y="222" text-anchor="end" font-size="15.6" font-weight="800" fill="#2166d1">LA BOBINE</text>
<text x="190" y="244" text-anchor="end" font-size="13.7" font-weight="500" fill="#1c2530">bornes A1 et A2</text>
<text x="190" y="264" text-anchor="end" font-size="13.0" font-weight="500" fill="#1c2530">reçoit les impulsions</text>
<text x="190" y="283" text-anchor="end" font-size="13.0" font-weight="500" fill="#1c2530">des boutons-poussoirs</text>
<text x="190" y="306" text-anchor="end" font-size="13.7" font-weight="800" fill="#2166d1">COMMANDE</text>
<path d="M340 124 L446 124" stroke="#f28c28" stroke-width="1.6"/><circle cx="340" cy="124" r="3" fill="#f28c28"/>
<text x="452" y="104" text-anchor="start" font-size="15.6" font-weight="800" fill="#f28c28">LE CONTACT</text>
<text x="452" y="126" text-anchor="start" font-size="13.7" font-weight="500" fill="#1c2530">bornes 1 et 2</text>
<text x="452" y="146" text-anchor="start" font-size="13.0" font-weight="500" fill="#1c2530">il change d'état</text>
<text x="452" y="165" text-anchor="start" font-size="13.0" font-weight="500" fill="#1c2530">à chaque impulsion</text>
<text x="452" y="188" text-anchor="start" font-size="13.7" font-weight="800" fill="#f28c28">PUISSANCE</text>
