<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le télérupteur a deux parties : une bobine, bornes A1 et A2, qui reçoit les impulsions des boutons-poussoirs ; un contact, bornes 1 et 2, qui allume ou éteint les lampes">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le télérupteur : une bobine et un contact</text>
<rect x="12" y="28" width="144" height="122" rx="9" fill="#24282f" stroke="#e8eaed" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="9.5" fill="#e8eaed" font-weight="bold">LA BOBINE</text>
<text x="84" y="68" text-anchor="middle" font-size="10" fill="#e8eaed" font-weight="bold">bornes A1 et A2</text>
<text x="84" y="83" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="98" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">elle reçoit les impulsions</text>
<text x="84" y="113" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">des boutons-poussoirs</text>
<text x="84" y="128" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="143" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">circuit de COMMANDE</text>
<rect x="164" y="28" width="144" height="122" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">LE CONTACT</text>
<text x="236" y="68" text-anchor="middle" font-size="10" fill="#ffd23f" font-weight="bold">bornes 1 et 2</text>
<text x="236" y="83" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="98" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">il change d'état</text>
<text x="236" y="113" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">à chaque impulsion</text>
<text x="236" y="128" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="143" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">circuit de PUISSANCE</text>
<text x="160" y="170" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">Le contact garde sa position entre deux impulsions</text>
</svg>
