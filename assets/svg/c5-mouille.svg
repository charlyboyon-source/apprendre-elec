<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 185" font-family="'Segoe UI',system-ui,sans-serif">
<text x="160" y="20" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">C'est l'intensité qui tue : I = U / R</text>
<line x1="160" y1="34" x2="160" y2="150" stroke="#2d323b" stroke-width="1.2"/>
<text x="80" y="52" text-anchor="middle" font-size="9.5" fill="#4cd97b" font-weight="bold">PEAU SÈCHE</text>
<text x="80" y="80" text-anchor="middle" font-size="10" fill="#e8eaed" font-weight="bold">R élevée</text>
<text x="80" y="96" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">(plusieurs milliers d'Ω)</text>
<line x1="80" y1="108" x2="80" y2="124" stroke="#4cd97b" stroke-width="2" stroke-linecap="round"/><polygon points="80,124 77.4,118.6 82.6,118.6" fill="#4cd97b"/>
<text x="80" y="140" text-anchor="middle" font-size="9" fill="#4cd97b" font-weight="normal">courant faible</text>
<text x="240" y="52" text-anchor="middle" font-size="9.5" fill="#e85b50" font-weight="bold">PEAU MOUILLÉE</text>
<text x="240" y="80" text-anchor="middle" font-size="10" fill="#e8eaed" font-weight="bold">R ≈ 1 000 Ω</text>
<text x="240" y="96" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">230 V / 1000 Ω</text>
<line x1="240" y1="108" x2="240" y2="124" stroke="#e85b50" stroke-width="2" stroke-linecap="round"/><polygon points="240,124 237.4,118.6 242.6,118.6" fill="#e85b50"/>
<text x="240" y="140" text-anchor="middle" font-size="11" fill="#e85b50" font-weight="bold">= 230 mA</text>
<text x="160" y="170" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">La tension impose le courant à travers la résistance du corps</text>
</svg>