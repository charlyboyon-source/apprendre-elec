<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Quatre façons de produire l'électricité : le magnétisme donne de l'alternatif, le photovoltaïque et la chimie donnent du continu, l'électricité statique reste marginale">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Quatre façons de produire l'électricité</text>
<rect x="12" y="28" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="33" width="4" height="23" rx="2" fill="#ffd23f"/>
<text x="24" y="47.5" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">MAGNÉTISME</text>
<text x="128" y="42.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">courant alternatif</text>
<text x="128" y="54.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">alternateur : centrales, éoliennes</text>
<rect x="12" y="66" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="71" width="4" height="23" rx="2" fill="#ff8c2b"/>
<text x="24" y="85.5" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">PHOTOVOLTAÏQUE</text>
<text x="128" y="80.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">courant continu</text>
<text x="128" y="92.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">panneaux solaires</text>
<rect x="12" y="104" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="109" width="4" height="23" rx="2" fill="#4cd97b"/>
<text x="24" y="123.5" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">CHIMIQUE</text>
<text x="128" y="118.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">courant continu</text>
<text x="128" y="130.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">piles, batteries</text>
<rect x="12" y="142" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="147" width="4" height="23" rx="2" fill="#9aa6b3"/>
<text x="24" y="161.5" text-anchor="start" font-size="8.5" fill="#9aa6b3" font-weight="bold">STATIQUE</text>
<text x="128" y="156.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">usage marginal</text>
<text x="128" y="168.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">frottement</text>
</svg>
