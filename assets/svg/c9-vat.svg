<rect x="328" y="138.0" width="40" height="12" rx="2.4" fill="#2166d1"/><rect x="328" y="139.7" width="40" height="2.4" fill="#fff" opacity=".28"/><ellipse cx="368" cy="144" rx="2.0" ry="6.0" fill="#2166d1" stroke="#00000033"/>
