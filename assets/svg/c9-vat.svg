<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Vérification d'absence de tension : tester le vérificateur sur une source connue, vérifier tous les conducteurs, retester le vérificateur aussitôt après ; au plus près de la zone de travail">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">La VAT : tester, vérifier, retester</text>
<rect x="12" y="38" width="90" height="48" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="57" y="53" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">1 · TESTER</text>
<text x="57" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">le vérificateur, sur</text>
<text x="57" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">une source connue</text>
<polyline points="105,62.0 110,62.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,62.0 108,58.0 108,66.0" fill="#9aa6b3"/>
<rect x="115" y="38" width="90" height="48" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="160" y="53" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">2 · VÉRIFIER</text>
<text x="160" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">entre tous les</text>
<text x="160" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">conducteurs + la terre</text>
<polyline points="208,62.0 213,62.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,62.0 211,58.0 211,66.0" fill="#9aa6b3"/>
<rect x="218" y="38" width="90" height="48" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="263" y="53" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">3 · RETESTER</text>
<text x="263" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">le vérificateur,</text>
<text x="263" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">aussitôt après</text>
<rect x="40" y="104" width="240" height="28" rx="9" fill="#4cd97b" stroke="#4cd97b" stroke-width="1.2" fill-opacity="0.07"/>
<text x="160" y="122" text-anchor="middle" font-size="9" fill="#4cd97b" font-weight="bold">Au plus près de la zone de travail</text>
<text x="160" y="156" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Un vérificateur dédié, jamais un simple multimètre</text>
</svg>
