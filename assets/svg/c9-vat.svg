<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Vérification d'absence de tension en trois temps : tester le vérificateur sur une source connue ; vérifier entre tous les conducteurs et par rapport à la terre ; retester le vérificateur aussitôt après. Au plus près de la zone de travail, avec un vérificateur dédié">
