<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le permutateur, à quatre bornes, se place sur les navettes entre les deux va-et-vient : il les laisse passer tout droit ou il les croise">
