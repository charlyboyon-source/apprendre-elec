<path d="M110 298 H150 L210 298 H250" fill="none" stroke="#7b4fc9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="360" y="214" width="200" height="104" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="460" y="240" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">croisé</text>
<path d="M390 262 H430 L490 298 H530" fill="none" stroke="#7b4fc9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M390 298 H430 L490 262 H530" fill="none" stroke="#7b4fc9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="24" y="334" width="592" height="62" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="360.5" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">Il laisse passer les navettes tout droit, ou il les croise</text>
<text x="320" y="381.5" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">Il se place toujours entre les deux va-et-vient</text>
