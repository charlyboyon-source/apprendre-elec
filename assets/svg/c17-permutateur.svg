<rect x="267" y="89" width="18" height="18" rx="3" fill="#d9b25a" stroke="#8a6416"/><circle cx="276" cy="98" r="5" fill="url(#vis)"/>
<rect x="267" y="129" width="18" height="18" rx="3" fill="#d9b25a" stroke="#8a6416"/><circle cx="276" cy="138" r="5" fill="url(#vis)"/>
<rect x="355" y="89" width="18" height="18" rx="3" fill="#d9b25a" stroke="#8a6416"/><circle cx="364" cy="98" r="5" fill="url(#vis)"/>
<rect x="355" y="129" width="18" height="18" rx="3" fill="#d9b25a" stroke="#8a6416"/><circle cx="364" cy="138" r="5" fill="url(#vis)"/>
<text x="320" y="60" text-anchor="middle" font-size="16.2" font-weight="800" fill="#b85a08">PERMUTATEUR</text>
<text x="320" y="186" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">4 bornes</text>
<rect x="80" y="214" width="200" height="104" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="180" y="240" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">tout droit</text>
