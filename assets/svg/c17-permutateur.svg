</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Trois endroits : le permutateur</text>
<circle cx="74" cy="118" r="4" fill="#1c2530"/><circle cx="114" cy="98" r="3.5" fill="#fff" stroke="#1c2530" stroke-width="2"/><circle cx="114" cy="138" r="3.5" fill="#fff" stroke="#1c2530" stroke-width="2"/>
