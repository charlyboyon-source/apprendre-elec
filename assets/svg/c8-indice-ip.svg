<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Indice IP : le premier chiffre note la protection contre les corps solides et la poussière, de 0 à 6 ; le deuxième la protection contre l'eau. Un X remplace un chiffre non précisé">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Lire un indice IP</text>
<text x="124" y="66" text-anchor="end" font-size="26" fill="#e8eaed" font-weight="bold">IP</text>
<text x="142" y="66" text-anchor="middle" font-size="26" fill="#ffd23f" font-weight="bold">4</text>
<text x="170" y="66" text-anchor="middle" font-size="26" fill="#5aa9e6" font-weight="bold">4</text>
<polyline points="142,72 84,92" fill="none" stroke="#ffd23f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="170,72 236,92" fill="none" stroke="#5aa9e6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="252" y="60" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">X = chiffre non précisé</text>
<rect x="12" y="92" width="144" height="92" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="84" y="107" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">1er chiffre : les solides</text>
<text x="22" y="123" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">2 : un doigt (12,5 mm)</text>
<text x="22" y="137" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">4 : un fil (1 mm)</text>
<text x="22" y="151" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">5 : protégé de la poussière</text>
<text x="22" y="165" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">6 : étanche à la poussière</text>
<rect x="164" y="92" width="144" height="92" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="236" y="107" text-anchor="middle" font-size="8.5" fill="#5aa9e6" font-weight="bold">2e chiffre : l'eau</text>
<text x="174" y="123" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">4 : projections</text>
<text x="174" y="137" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">5 : jets</text>
<text x="174" y="151" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">7 : immersion temporaire</text>
<text x="174" y="165" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">8 : immersion prolongée</text>
</svg>
