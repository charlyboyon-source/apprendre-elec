<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Les protections : le fusible ou le disjoncteur protègent l'installation contre la surcharge et le court-circuit ; le DDR protège les personnes contre les fuites à la terre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Deux protections, deux rôles</text>
<rect x="12" y="30" width="144" height="116" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="84" y="48" text-anchor="middle" font-size="9.5" fill="#ff8c2b" font-weight="bold">FUSIBLE</text>
<text x="84" y="60" text-anchor="middle" font-size="9.5" fill="#ff8c2b" font-weight="bold">ou DISJONCTEUR</text>
<text x="84" y="82" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">surcharge</text>
<text x="84" y="94" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">court-circuit</text>
<text x="84" y="118" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">protège l'installation</text>
<text x="84" y="132" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">les conducteurs</text>
<rect x="164" y="30" width="144" height="116" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="236" y="54" text-anchor="middle" font-size="11" fill="#4cd97b" font-weight="bold">DDR</text>
<text x="236" y="88" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">fuite à la terre</text>
<text x="236" y="118" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">protège les personnes</text>
<text x="236" y="132" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">sensibilité 30 mA</text>
<text x="160" y="170" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">Toujours sur la phase, en amont du circuit</text>
</svg>
