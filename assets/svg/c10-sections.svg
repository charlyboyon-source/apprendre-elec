<text x="320" y="337" text-anchor="middle" font-size="15.6" font-weight="500" fill="#5b6673">en bas la section du conducteur, en haut le calibre maximal</text>
<rect x="30" y="350" width="580" height="38" rx="10" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="375" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">Le disjoncteur protège le conducteur : jamais plus fort que lui</text>
