<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Calibre maximal du disjoncteur selon la section du conducteur : 1,5 mm² 16 A ; 2,5 mm² 20 A ; 6 mm² 32 A ; 10 mm² 40 A ; 16 mm² 63 A">
