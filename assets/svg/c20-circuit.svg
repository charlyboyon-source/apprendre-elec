<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le circuit de recharge : un circuit spécialisé dédié, un différentiel 30 mA de type A au minimum, et une qualification obligatoire pour installer une borne de plus de 3,7 kW">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le circuit de recharge</text>
<rect x="12" y="34" width="90" height="62" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="57" y="58" text-anchor="middle" font-size="15" fill="#ffd23f" font-weight="bold">DÉDIÉ</text>
<text x="57" y="75" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">un circuit</text>
<text x="57" y="87" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">rien que pour lui</text>
<rect x="115" y="34" width="90" height="62" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="160" y="58" text-anchor="middle" font-size="15" fill="#4cd97b" font-weight="bold">30 mA</text>
<text x="160" y="75" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">type A minimum</text>
<text x="160" y="87" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">type B selon la borne</text>
<rect x="218" y="34" width="90" height="62" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="263" y="58" text-anchor="middle" font-size="15" fill="#e85b50" font-weight="bold">> 3,7 kW</text>
<text x="263" y="75" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">qualification</text>
<text x="263" y="87" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">obligatoire</text>
<rect x="12" y="108" width="296" height="30" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="160" y="127" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">Méthode aval : son calibre compte EN ENTIER</text>
<text x="160" y="158" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">La notice de la borne fixe le type de différentiel</text>
<text x="160" y="176" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Prise renforcée : 2,5 mm², 20 A · Borne 32 A : 6 mm² au moins</text>
</svg>
