<text x="350" y="112" text-anchor="start" font-size="16.9" font-weight="800" fill="#1c2530">1,80 m au maximum</text>
<text x="350" y="134" text-anchor="start" font-size="14.3" font-weight="500" fill="#5b6673">dans tous les logements</text>
<text x="350" y="190" text-anchor="start" font-size="16.9" font-weight="800" fill="#17804c">0,90 m à 1,30 m</text>
<text x="350" y="212" text-anchor="start" font-size="14.3" font-weight="500" fill="#5b6673">accessibilité aux personnes</text>
