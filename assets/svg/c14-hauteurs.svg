<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Hauteur des organes de manœuvre du panneau de contrôle : 1,80 m au maximum ; entre 0,90 m et 1,30 m quand l'accessibilité aux personnes à mobilité réduite est exigée">
