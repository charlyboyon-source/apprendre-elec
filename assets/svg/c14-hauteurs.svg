<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Hauteur des organes de manœuvre du panneau de contrôle : 1,80 m au maximum ; entre 0,90 m et 1,30 m quand l'accessibilité aux personnes à mobilité réduite est exigée">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">À quelle hauteur ? Il faut pouvoir l'atteindre</text>
<polyline points="70,34 70,170" fill="none" stroke="#5a626e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="60,170 250,170" fill="none" stroke="#5a626e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="64,44 76,44" fill="none" stroke="#e85b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="47" text-anchor="end" font-size="8.5" fill="#e85b50" font-weight="bold">1,80 m</text>
<polyline points="64,89 76,89" fill="none" stroke="#4cd97b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="92" text-anchor="end" font-size="8.5" fill="#4cd97b" font-weight="bold">1,30 m</text>
<polyline points="64,120 76,120" fill="none" stroke="#4cd97b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="123" text-anchor="end" font-size="8.5" fill="#4cd97b" font-weight="bold">0,90 m</text>
<polyline points="64,170 76,170" fill="none" stroke="#9aa6b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="173" text-anchor="end" font-size="8.5" fill="#9aa6b3" font-weight="bold">sol</text>
<rect x="78" y="89" width="60" height="31" rx="3" fill="#4cd97b" fill-opacity="0.22" stroke="#4cd97b" stroke-width="1.6"/>
<polyline points="84,44 138,44" fill="none" stroke="#e85b50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>
<text x="150" y="48" text-anchor="start" font-size="9.5" fill="#e85b50" font-weight="bold">1,80 m au maximum</text>
<text x="150" y="60" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">dans tous les logements</text>
<text x="150" y="102" text-anchor="start" font-size="9.5" fill="#4cd97b" font-weight="bold">0,90 m à 1,30 m</text>
<text x="150" y="114" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">accessibilité aux personnes</text>
<text x="150" y="124" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">à mobilité réduite (PMR)</text>
<text x="160" y="188" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Hauteur des organes de manœuvre, depuis le sol fini</text>
</svg>
