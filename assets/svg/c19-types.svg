<text x="200" y="134" text-anchor="middle" font-size="7" fill="#5aa9e6" font-weight="bold">thermodynamique</text>
<text x="200" y="146" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">calories de l'air</text>
<polygon points="246,70 270,81 270,113 246,102" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="246,70 270,81 270,113 246,102" fill="#ffd23f" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="270,81 298,70 298,102 270,113" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="270,81 298,70 298,102 270,113" fill="#ffd23f" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="246,70 274,59 298,70 270,81" fill="#ffd23f" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="272" y="134" text-anchor="middle" font-size="7.8" fill="#ffd23f" font-weight="bold">solaire</text>
<text x="272" y="146" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">capteurs + appoint</text>
<text x="160" y="176" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">ECS : eau chaude sanitaire</text>
