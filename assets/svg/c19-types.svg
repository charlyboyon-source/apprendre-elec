<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Quatre façons de produire l'eau chaude sanitaire : instantané, à accumulation, thermodynamique, solaire">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Quatre façons de chauffer l'eau</text>
<polygon points="30,70 54,81 54,113 30,102" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="30,70 54,81 54,113 30,102" fill="#e85b50" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="54,81 82,70 82,102 54,113" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="54,81 82,70 82,102 54,113" fill="#e85b50" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="30,70 58,59 82,70 54,81" fill="#e85b50" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
