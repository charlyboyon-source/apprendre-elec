<text x="320" y="334" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">1 borne commune + 2 bornes de navette</text>
<text x="320" y="366" text-anchor="middle" font-size="14.3" font-weight="500" fill="#5b6673">Le commun n'est jamais relié aux deux navettes à la fois</text>
