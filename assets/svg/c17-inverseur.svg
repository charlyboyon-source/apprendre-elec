<polyline points="234,88 288,88" fill="none" stroke="#b48cf2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="198" y="70" text-anchor="middle" font-size="7" fill="#e8eaed" font-weight="bold">commun</text>
<text x="282" y="61" text-anchor="end" font-size="7" fill="#b48cf2" font-weight="bold">navette 1</text>
<text x="282" y="102" text-anchor="end" font-size="7" fill="#b48cf2" font-weight="bold">navette 2</text>
<text x="236" y="118" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">position 2</text>
<text x="160" y="146" text-anchor="middle" font-size="9.5" fill="#e8eaed" font-weight="bold">1 borne commune + 2 bornes de navette</text>
<text x="160" y="166" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Le commun n'est jamais relié aux deux navettes à la fois</text>
