<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'interrupteur va-et-vient est un inverseur à trois bornes : une borne commune et deux bornes de navette ; le commun est relié à l'une ou à l'autre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le va-et-vient : un inverseur à 3 bornes</text>
