<polyline points="32,78 62,78" fill="none" stroke="#e85b50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="82" cy="68" r="2.4" fill="#b48cf2"/>
<circle cx="82" cy="88" r="2.4" fill="#b48cf2"/>
<circle cx="62" cy="78" r="2.6" fill="#e8eaed"/>
