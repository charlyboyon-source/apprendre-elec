<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'interrupteur va-et-vient est un inverseur à trois bornes : le commun est relié soit à la navette 1, soit à la navette 2, jamais aux deux à la fois">
