<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="IRL : Isolant, Rigide, Lisse. Le tube rigide de la pose apparente, fixé par des colliers">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le conduit IRL, lettre par lettre</text>
<text x="58.666666666666664" y="62" text-anchor="middle" font-size="26" fill="#ffd23f" font-weight="bold">I</text>
<rect x="12.0" y="82" width="93.33333333333333" height="58" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="58.666666666666664" y="98" text-anchor="middle" font-size="8" fill="#ffd23f" font-weight="bold">ISOLANT</text>
<text x="58.666666666666664" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">en matière</text>
<text x="58.666666666666664" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">plastique</text>
<text x="160.0" y="62" text-anchor="middle" font-size="26" fill="#ff8c2b" font-weight="bold">R</text>
<rect x="113.33333333333333" y="82" width="93.33333333333333" height="58" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="160.0" y="98" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">RIGIDE</text>
<text x="160.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">ne se courbe pas</text>
<text x="160.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">à la main</text>
<text x="261.3333333333333" y="62" text-anchor="middle" font-size="26" fill="#4cd97b" font-weight="bold">L</text>
<rect x="214.66666666666666" y="82" width="93.33333333333333" height="58" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="261.3333333333333" y="98" text-anchor="middle" font-size="8" fill="#4cd97b" font-weight="bold">LISSE</text>
<text x="261.3333333333333" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">paroi</text>
<text x="261.3333333333333" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">sans anneaux</text>
<text x="160" y="160" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Le tube de la pose apparente : garage, cave, atelier</text>
