<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Câblage du contacteur heures creuses. Commande : la phase, un disjoncteur de 2 A, le contact C1-C2 du compteur, la bobine A1-A2, le neutre. Puissance : la phase, le disjoncteur de 20 A, le contact du contacteur, le chauffe-eau, le neutre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le contacteur heures creuses : le câblage</text>
<polyline points="24,40 296,40" fill="none" stroke="#e85b50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="18" y="34" text-anchor="start" font-size="7.5" fill="#e85b50" font-weight="bold">phase</text>
<polyline points="24,166 296,166" fill="none" stroke="#5aa9e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="18" y="180" text-anchor="start" font-size="7.5" fill="#5aa9e6" font-weight="bold">neutre</text>
<polyline points="82,40 82,52" fill="none" stroke="#e85b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
