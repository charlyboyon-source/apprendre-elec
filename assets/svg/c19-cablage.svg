<text x="96" y="108" text-anchor="start" font-size="6.8" fill="#9aa6b3" font-weight="normal">compteur</text>
<polyline points="99,127 196,127" fill="none" stroke="#9aa6b3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<polyline points="210,40 210,52" fill="none" stroke="#e85b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="193" y="52" width="34" height="18" rx="3" fill="#24282f" stroke="#ffd23f" stroke-width="1.6"/>
<text x="210" y="64.5" text-anchor="middle" font-size="7" fill="#ffd23f" font-weight="bold">20 A</text>
<polyline points="210,70 210,82" fill="none" stroke="#e85b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="210" cy="84" r="2.4" fill="#ffd23f"/><circle cx="210" cy="104" r="2.4" fill="#ffd23f"/>
<polyline points="210,104 200,86" fill="none" stroke="#ffd23f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="210,104 210,118" fill="none" stroke="#ff8c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="193" y="118" width="34" height="18" rx="3" fill="#24282f" stroke="#e85b50" stroke-width="1.6"/>
<text x="210" y="130.5" text-anchor="middle" font-size="7" fill="#e85b50" font-weight="bold">ECS</text>
<polyline points="210,136 210,166" fill="none" stroke="#5aa9e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="224" y="98" text-anchor="start" font-size="7.5" fill="#ffd23f" font-weight="bold">contact</text>
<text x="232" y="131" text-anchor="start" font-size="7" fill="#e85b50" font-weight="bold">chauffe-eau</text>
<text x="82" y="194" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">COMMANDE</text>
