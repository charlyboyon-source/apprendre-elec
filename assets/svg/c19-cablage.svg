<circle cx="82" cy="84" r="2.4" fill="#ff8c2b"/><circle cx="82" cy="104" r="2.4" fill="#ff8c2b"/>
<polyline points="82,104 72,86" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="82,104 82,118" fill="none" stroke="#e8eaed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="65" y="118" width="34" height="18" rx="3" fill="#24282f" stroke="#e8eaed" stroke-width="1.6"/>
<text x="82" y="130.5" text-anchor="middle" font-size="7" fill="#e8eaed" font-weight="bold">A1 A2</text>
<polyline points="82,136 82,166" fill="none" stroke="#5aa9e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
