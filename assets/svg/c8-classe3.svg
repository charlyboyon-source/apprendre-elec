<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Matériel de classe III : alimenté en très basse tension de sécurité, 50 V au plus en alternatif, 120 V en continu lisse ; symbole : un losange contenant III">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Classe III : la très basse tension</text>
<polygon points="74,48 116,90 74,132 32,90" fill="none" stroke="#e8eaed" stroke-width="3" stroke-linejoin="round"/>
<text x="74" y="97" text-anchor="middle" font-size="17" fill="#e8eaed" font-weight="bold">III</text>
<text x="74" y="148" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">le losange III</text>
<text x="136" y="62" text-anchor="start" font-size="11" fill="#ffd23f" font-weight="bold">CLASSE III</text>
<text x="136" y="80" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">alimentée en TBTS</text>
<text x="136" y="98" text-anchor="start" font-size="12" fill="#4cd97b" font-weight="bold">≤ 50 V</text>
<text x="182" y="98" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">en alternatif</text>
<text x="136" y="114" text-anchor="start" font-size="12" fill="#4cd97b" font-weight="bold">≤ 120 V</text>
<text x="188" y="114" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">en continu lisse</text>
<text x="136" y="132" text-anchor="start" font-size="7.5" fill="#9aa6b3" font-weight="normal">spots 12 V, jouets</text>
<text x="160" y="176" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Source de sécurité, circuits séparés de la terre</text>
</svg>
