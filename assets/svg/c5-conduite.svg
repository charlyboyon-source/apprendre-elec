<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 188" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Conduite à tenir face à une victime : 1 Protéger, 2 Examiner, 3 Alerter (15, 18, 112), 4 Secourir ; et toujours faire consulter">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Face à une victime : 4 étapes, toujours dans cet ordre</text>
<line x1="24" y1="43.5" x2="24" y2="136.5" stroke="#ffd23f" stroke-opacity="0.45" stroke-width="2"/>
<rect x="42" y="30" width="265" height="27" rx="8" fill="#24282f" stroke="#3a404b" stroke-width="1.2"/>
<circle cx="24" cy="43.5" r="9" fill="#ffd23f"/><text x="24" y="47.1" text-anchor="middle" font-size="10.5" fill="#1c1f24" font-weight="bold">1</text>
<g transform="translate(60 43.5) scale(0.68)"><line x1="-16" y1="4" x2="-7" y2="4" stroke="#e8eaed" stroke-width="2.4" stroke-linecap="round"/><line x1="7" y1="4" x2="16" y2="4" stroke="#e8eaed" stroke-width="2.4" stroke-linecap="round"/><line x1="-7" y1="4" x2="5" y2="-10" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/><circle cx="-7" cy="4" r="2.8" fill="#e8eaed"/><circle cx="7" cy="4" r="2.8" fill="#e8eaed"/></g>
<text x="80" y="41.5" font-size="9" fill="#e8eaed" font-weight="bold"><tspan fill="#ffd23f">P</tspan>ROTÉGER</text>
<text x="80" y="52" font-size="8" fill="#9aa6b3" font-weight="normal">Couper le courant. Ne pas toucher la victime avant.</text>
<rect x="42" y="61" width="265" height="27" rx="8" fill="#24282f" stroke="#3a404b" stroke-width="1.2"/>
<circle cx="24" cy="74.5" r="9" fill="#ffd23f"/><text x="24" y="78.1" text-anchor="middle" font-size="10.5" fill="#1c1f24" font-weight="bold">2</text>
<g transform="translate(60 74.5) scale(0.68)"><path d="M-14,0 Q0,-14 14,0 Q0,14 -14,0 Z" fill="none" stroke="#e8eaed" stroke-width="2.4" stroke-linejoin="round"/><circle cx="0" cy="0" r="4.4" fill="#ffd23f"/></g>
<text x="80" y="72.5" font-size="9" fill="#e8eaed" font-weight="bold"><tspan fill="#ffd23f">E</tspan>XAMINER</text>
<text x="80" y="83" font-size="8" fill="#9aa6b3" font-weight="normal">La victime répond-elle ? Respire-t-elle ?</text>
<rect x="42" y="92" width="265" height="27" rx="8" fill="#24282f" stroke="#3a404b" stroke-width="1.2"/>
<circle cx="24" cy="105.5" r="9" fill="#ffd23f"/><text x="24" y="109.1" text-anchor="middle" font-size="10.5" fill="#1c1f24" font-weight="bold">3</text>
<g transform="translate(60 105.5) scale(0.68)"><rect x="-12" y="-14" width="15" height="28" rx="3.2" fill="none" stroke="#e8eaed" stroke-width="2.4"/><circle cx="-4.5" cy="8.5" r="1.7" fill="#e8eaed"/><path d="M8,-6 q4,6 0,12" fill="none" stroke="#ffd23f" stroke-width="2.4" stroke-linecap="round"/><path d="M13,-10 q7,10 0,20" fill="none" stroke="#ffd23f" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="80" y="103.5" font-size="9" fill="#e8eaed" font-weight="bold"><tspan fill="#ffd23f">A</tspan>LERTER</text>
<text x="80" y="114" font-size="8" fill="#9aa6b3" font-weight="normal"><tspan fill="#ffd23f" font-weight="bold">15</tspan> SAMU · <tspan fill="#ffd23f" font-weight="bold">18</tspan> pompiers · <tspan fill="#ffd23f" font-weight="bold">112</tspan> urgence européenne</text>
<rect x="42" y="123" width="265" height="27" rx="8" fill="#24282f" stroke="#3a404b" stroke-width="1.2"/>
<circle cx="24" cy="136.5" r="9" fill="#ffd23f"/><text x="24" y="140.1" text-anchor="middle" font-size="10.5" fill="#1c1f24" font-weight="bold">4</text>
<g transform="translate(60 136.5) scale(0.68)"><path d="M0,11.35 C-18.4,-2.4499999999999997 -10.35,-15.099999999999998 0,-5.4399999999999995 C10.35,-15.099999999999998 18.4,-2.4499999999999997 0,11.35 Z" fill="none" stroke="#e85b50" stroke-width="2.4" stroke-linejoin="round"/><polyline points="-9,0 -4,0 -1.5,-6 1.5,6 4,0 9,0" fill="none" stroke="#e8eaed" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="80" y="134.5" font-size="9" fill="#e8eaed" font-weight="bold"><tspan fill="#ffd23f">S</tspan>ECOURIR</text>
<text x="80" y="145" font-size="8" fill="#9aa6b3" font-weight="normal">Premiers secours ; si arrêt : massage cardiaque, DAE.</text>
<rect x="13" y="158" width="294" height="22" rx="11" fill="#4cd97b" fill-opacity="0.08" stroke="#4cd97b" stroke-opacity="0.55" stroke-width="1"/>
<text x="160" y="172" text-anchor="middle" font-size="8.2" fill="#4cd97b" font-weight="normal">Et toujours : faire consulter un médecin, même si la victime va bien</text>
</svg>
