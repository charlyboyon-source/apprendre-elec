<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 165" font-family="'Segoe UI',system-ui,sans-serif">
<text x="160" y="20" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Face à une victime : 4 étapes, dans l'ordre</text><circle cx="48" cy="66" r="17" fill="none" stroke="#ffd23f" stroke-width="2"/><text x="48" y="71" text-anchor="middle" font-size="13" fill="#ffd23f" font-weight="bold">1</text><text x="48" y="100" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">PROTÉGER</text><text x="48" y="114" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">couper · ne pas toucher</text><line x1="68" y1="66" x2="108" y2="66" stroke="#9aa6b3" stroke-width="2" stroke-linecap="round"/><polygon points="108,66 102.6,68.6 102.6,63.4" fill="#9aa6b3"/><circle cx="128" cy="66" r="17" fill="none" stroke="#ffd23f" stroke-width="2"/><text x="128" y="71" text-anchor="middle" font-size="13" fill="#ffd23f" font-weight="bold">2</text><text x="128" y="100" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">EXAMINER</text><text x="128" y="114" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">parle ? respire ?</text><line x1="148" y1="66" x2="188" y2="66" stroke="#9aa6b3" stroke-width="2" stroke-linecap="round"/><polygon points="188,66 182.6,68.6 182.6,63.4" fill="#9aa6b3"/><circle cx="208" cy="66" r="17" fill="none" stroke="#ffd23f" stroke-width="2"/><text x="208" y="71" text-anchor="middle" font-size="13" fill="#ffd23f" font-weight="bold">3</text><text x="208" y="100" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">ALERTER</text><text x="208" y="114" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">15 · 18 · 112</text><line x1="228" y1="66" x2="268" y2="66" stroke="#9aa6b3" stroke-width="2" stroke-linecap="round"/><polygon points="268,66 262.6,68.6 262.6,63.4" fill="#9aa6b3"/><circle cx="288" cy="66" r="17" fill="none" stroke="#ffd23f" stroke-width="2"/><text x="288" y="71" text-anchor="middle" font-size="13" fill="#ffd23f" font-weight="bold">4</text><text x="288" y="100" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">SECOURIR</text><text x="288" y="114" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">gestes de secours</text><text x="160" y="152" text-anchor="middle" font-size="8.5" fill="#9aa6b3" font-weight="normal">Et toujours : faire consulter la victime</text>
</svg>