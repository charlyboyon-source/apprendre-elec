<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Conduite à tenir face à une victime : 1, protéger, couper le courant, ne pas toucher la victime avant ; 2, examiner, répond-elle, respire-t-elle ; 3, alerter le 15, le 18 ou le 112 ; 4, secourir, et si arrêt, massage cardiaque et défibrillateur. Toujours faire consulter un médecin">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<linearGradient id="icta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949c"/><stop offset=".3" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6b727a"/></linearGradient>
<linearGradient id="tpc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b02020"/><stop offset=".3" stop-color="#ff6b5e"/><stop offset="1" stop-color="#8e1414"/></linearGradient>
<linearGradient id="irl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1b9"/><stop offset=".3" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8d949c"/></linearGradient>
<linearGradient id="terre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a877"/><stop offset="1" stop-color="#a98557"/></linearGradient>
<pattern id="vj" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2e9e4f"/><rect width="7" height="16" fill="#f2d21a"/></pattern>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
<linearGradient id="cellule" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4a8a"/><stop offset="1" stop-color="#16285a"/></linearGradient>
<linearGradient id="cuve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset=".55" stop-color="#ffb3a0"/><stop offset="1" stop-color="#7fb8f0"/></linearGradient>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Face à une victime : 4 étapes, dans cet ordre</text>
<rect x="16" y="44" width="608" height="78" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<circle cx="52" cy="83" r="22" fill="#d92b2b"/><text x="52" y="91" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
<g transform="translate(92 52) scale(0.26)"><rect width="70" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="70" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="20" y="30"/><use href="#borne" x="50" y="30"/><use href="#borne" x="20" y="210"/><use href="#borne" x="50" y="210"/><rect x="18" y="72" width="34" height="56" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="22" y="100" width="26" height="30" rx="4" fill="url(#manette)"/><text x="35" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2530"></text><text x="35" y="169" text-anchor="middle" font-size="9" font-weight="500" fill="#5b6673">230 V~</text></g>
<text x="160" y="76" text-anchor="start" font-size="16.9" font-weight="800" fill="#d92b2b">PROTÉGER</text>
<text x="160" y="100" text-anchor="start" font-size="13.7" font-weight="500" fill="#1c2530">Couper le courant. Ne pas toucher la victime avant.</text>
<rect x="16" y="130" width="608" height="78" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<circle cx="52" cy="169" r="22" fill="#b85a08"/><text x="52" y="177" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
<circle cx="112" cy="169" r="18" fill="none" stroke="#1c2530" stroke-width="3"/><path d="M125 182 l14 14" stroke="#1c2530" stroke-width="4" stroke-linecap="round"/>
<text x="160" y="162" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">EXAMINER</text>
<text x="160" y="186" text-anchor="start" font-size="13.7" font-weight="500" fill="#1c2530">La victime répond-elle ? Respire-t-elle ?</text>
<rect x="16" y="216" width="608" height="78" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<circle cx="52" cy="255" r="22" fill="#2166d1"/><text x="52" y="263" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text>
<rect x="96" y="228" width="32" height="54" rx="6" fill="#2b3036"/><rect x="100" y="234" width="24" height="36" rx="2" fill="#9bd0ff"/>
<text x="160" y="248" text-anchor="start" font-size="16.9" font-weight="800" fill="#2166d1">ALERTER</text>
<text x="160" y="272" text-anchor="start" font-size="13.7" font-weight="500" fill="#1c2530">15 (SAMU) · 18 (pompiers) · 112</text>
<rect x="16" y="302" width="608" height="78" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<circle cx="52" cy="341" r="22" fill="#17804c"/><text x="52" y="349" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text>
<path d="M112 322 c-10 -12 -26 -4 -18 10 l18 18 l18 -18 c8 -14 -8 -22 -18 -10z" fill="#d92b2b"/><path d="M104 332 l6 6 l4 -10 l4 14 l4 -6" fill="none" stroke="#fff" stroke-width="2"/>
<text x="160" y="334" text-anchor="start" font-size="16.9" font-weight="800" fill="#17804c">SECOURIR</text>
<text x="160" y="358" text-anchor="start" font-size="13.7" font-weight="500" fill="#1c2530">Premiers secours ; si arrêt : massage cardiaque, DAE.</text>
<rect x="24" y="392" width="592" height="40" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="418.0" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">Et toujours : faire consulter un médecin, même si la victime va bien</text>
</svg>
