<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Méthode amont : le calibre de l'interrupteur différentiel est au moins égal à celui du disjoncteur de branchement. Exemple : AGCP réglé sur 45 A, interrupteur différentiel de 63 A">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Méthode amont : au moins le calibre de l'AGCP</text>
<g transform="translate(84 70) scale(1.0)" filter="url(#ombre)"><rect width="124" height="172" rx="8" fill="url(#corps)" stroke="#b3b9c0"/><rect y="34" width="124" height="104" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="26" y="17"/><use href="#borne" x="98" y="17"/><use href="#borne" x="26" y="155"/><use href="#borne" x="98" y="155"/><rect x="38" y="46" width="48" height="66" rx="6" fill="#d5d9de" stroke="#b3b9c0"/><rect x="43" y="50" width="38" height="36" rx="5" fill="url(#manette)"/><rect x="94" y="50" width="24" height="18" rx="4" fill="#f2a20c" stroke="#b97a05"/><text x="106" y="63" text-anchor="middle" font-size="11" font-weight="800" fill="#3a2a00">T</text><text x="62" y="131" text-anchor="middle" font-size="15" font-weight="800" fill="#1c2530">45 A</text></g>
<text x="146" y="60" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">AGCP</text>
<text x="146" y="274" text-anchor="middle" font-size="22.1" font-weight="800" fill="#1c2530">45 A</text>
<g transform="translate(424 62) scale(0.74)" filter="url(#ombre)"><rect width="140" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="140" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="35" y="30"/><use href="#borne" x="105" y="30"/><use href="#borne" x="35" y="210"/><use href="#borne" x="105" y="210"/><rect x="20" y="72" width="34" height="62" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="24" y="72" width="26" height="34" rx="4" fill="url(#manette)"/><rect x="76" y="72" width="46" height="24" rx="4" fill="#f2a20c" stroke="#b97a05"/><text x="99" y="89" text-anchor="middle" font-size="13" font-weight="800" fill="#3a2a00">TEST</text><text x="99" y="120" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2530">63 A</text><text x="99" y="141" text-anchor="middle" font-size="16" font-weight="800" fill="#2166d1">30 mA</text><g transform="translate(0 -84)"><rect x="18" y="222" width="38" height="24" rx="3" fill="none" stroke="#1c2530" stroke-width="1.4"/><path d="M24 232 q4 -10 8 0 t8 0" fill="none" stroke="#1c2530" stroke-width="1.4"/><path d="M24 240 q4 -8 8 0 M40 240 h0" fill="none" stroke="#1c2530" stroke-width="1.4"/><path d="M42 232 h8" stroke="#1c2530" stroke-width="1.4"/></g><text x="99" y="166" text-anchor="middle" font-size="14" font-weight="800" fill="#1c2530">type A</text></g>
<text x="476" y="52" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">interrupteur diff.</text>
<text x="476" y="274" text-anchor="middle" font-size="22.1" font-weight="800" fill="#1c2530">63 A</text>
<path d="M210 150 H420" stroke="#d92b2b" stroke-width="7"/>
<path d="M210 166 H420" stroke="#2166d1" stroke-width="7"/>
<circle cx="316" cy="158" r="30" fill="#fff" stroke="#1c2530" stroke-width="2.5"/><text x="316" y="172" text-anchor="middle" font-size="40" font-weight="800" fill="#1c2530">≤</text>
<rect x="30" y="296" width="580" height="42" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="323" text-anchor="middle" font-size="16.2" font-weight="800" fill="#1c2530">calibre du différentiel ≥ calibre de l'AGCP</text>
<text x="320" y="368" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">Calibres courants : 25 A · 40 A · 63 A</text>
<text x="320" y="396" text-anchor="middle" font-size="16.2" font-weight="500" fill="#5b6673">40 A serait trop faible pour un AGCP de 45 A</text>
</svg>
