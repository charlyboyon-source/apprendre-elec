<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Méthode amont : le calibre de l'interrupteur différentiel est au moins égal à celui du disjoncteur de branchement. Exemple : AGCP réglé sur 45 A, interrupteur différentiel de 63 A">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Méthode amont : au moins le calibre de l'AGCP</text>
<rect x="24" y="44" width="110" height="56" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="79" y="62" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">AGCP</text>
<text x="79" y="84" text-anchor="middle" font-size="15" fill="#e8eaed" font-weight="bold">45 A</text>
<polyline points="138,72 176,72" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="185,72 177,68 177,76" fill="#ff8c2b"/>
<rect x="186" y="44" width="110" height="56" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="241" y="62" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">interrupteur diff.</text>
<text x="241" y="84" text-anchor="middle" font-size="15" fill="#e8eaed" font-weight="bold">63 A</text>
<text x="160" y="126" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">calibre du différentiel ≥ calibre de l'AGCP</text>
<text x="160" y="146" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">Calibres courants : 25 A · 40 A · 63 A</text>
<text x="160" y="166" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">40 A serait trop faible pour un AGCP de 45 A</text>
</svg>
