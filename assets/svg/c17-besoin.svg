<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le va-et-vient commande un même point lumineux depuis deux endroits : par exemple aux deux bouts d'un couloir">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Une lampe, deux endroits pour la commander</text>
<rect x="30" y="60" width="260" height="56" rx="4" fill="none" stroke="#9aa6b3" stroke-width="2.4"/>
<circle cx="160" cy="88" r="11" fill="#1c1f24" stroke="#ffd23f" stroke-width="2"/>
<polyline points="152.3,80.3 167.7,95.7" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="152.3,95.7 167.7,80.3" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="25" y="76" width="10" height="24" rx="2" fill="#ff8c2b"/>
<rect x="285" y="76" width="10" height="24" rx="2" fill="#ff8c2b"/>
<text x="52" y="52" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">interrupteur 1</text>
<text x="268" y="52" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">interrupteur 2</text>
<text x="160" y="132" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">couloir</text>
<text x="160" y="154" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">On allume en entrant, on éteint en sortant par l'autre bout</text>
<text x="160" y="172" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Couloir, escalier, chambre, pièce à deux portes</text>
</svg>
