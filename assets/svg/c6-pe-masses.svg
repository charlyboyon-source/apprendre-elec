<path d="M108 250 H540 V286" fill="none" stroke="#2e9e4f" stroke-width="6" stroke-linejoin="round"/><path d="M108 250 H540 V286" fill="none" stroke="#f2d21a" stroke-width="6" stroke-dasharray="6 6" stroke-linejoin="round"/>
<rect x="480" y="286" width="140" height="60" fill="url(#terre)"/><rect x="480" y="286" width="140" height="4" fill="#8f6f45"/>
