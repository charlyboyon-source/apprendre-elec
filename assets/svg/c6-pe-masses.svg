<text x="440" y="58" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">chauffe-eau</text>
<text x="300" y="272" text-anchor="middle" font-size="15.6" font-weight="800" fill="#17804c">PE vert/jaune</text>
<text x="560" y="372" text-anchor="end" font-size="14.3" font-weight="800" fill="#1c2530">prise de terre</text>
<text x="240" y="340" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">Le PE ne conduit du courant qu'en cas de défaut</text>
