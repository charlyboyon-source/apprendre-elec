<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le conducteur de protection PE, vert et jaune, relie les masses du four, du lave-linge et du chauffe-eau à la prise de terre. Il ne conduit du courant qu'en cas de défaut">
