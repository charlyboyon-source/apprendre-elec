<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Alimentation d'un chantier : le coffret de branchement provisoire, qui relève de la NF C 14-100, alimente le coffret de chantier équipé d'un interrupteur différentiel 30 mA">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le courant sur un chantier</text>
<rect x="12" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#9aa6b3" stroke-width="1.2" />
<text x="57" y="55" text-anchor="middle" font-size="8.5" fill="#9aa6b3" font-weight="bold">RÉSEAU</text>
<text x="57" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">le distributeur</text>
<text x="57" y="78" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">alimente</text>
<polyline points="105,65.0 110,65.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,65.0 108,61.0 108,69.0" fill="#9aa6b3"/>
<rect x="115" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="160" y="55" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">BRANCHEMENT</text>
<text x="160" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">provisoire</text>
<text x="160" y="78" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">NF C 14-100</text>
<polyline points="208,65.0 213,65.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,65.0 211,61.0 211,69.0" fill="#9aa6b3"/>
<rect x="218" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="263" y="55" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">COFFRET</text>
<text x="263" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">de chantier</text>
<text x="263" y="78" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">différentiel 30 mA</text>
<text x="160" y="118" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">Toutes les prises du chantier sont protégées en 30 mA</text>
<text x="160" y="142" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Rallonges déroulées, matériel en bon état, à l'abri de l'eau</text>
<text x="160" y="162" text-anchor="middle" font-size="8" fill="#e85b50" font-weight="bold">Un chantier est un milieu mouillé : tension limite 25 V</text>
</svg>
