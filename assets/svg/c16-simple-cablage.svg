<text x="169" y="304" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">2 fils à l'interrupteur</text>
<text x="169" y="328" text-anchor="middle" font-size="14.3" font-weight="500" fill="#1c2530">phase + retour</text>
