<text x="79" y="248" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">tableau</text>
<text x="300" y="176" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">interrupteur</text>
<text x="600" y="140" text-anchor="end" font-size="15.0" font-weight="800" fill="#1c2530">lampe</text>
<text x="200" y="108" text-anchor="middle" font-size="14.3" font-weight="800" fill="#d92b2b">phase</text>
<text x="420" y="108" text-anchor="middle" font-size="14.3" font-weight="800" fill="#f28c28">retour lampe</text>
<text x="334" y="240" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">neutre et protection : directs</text>
