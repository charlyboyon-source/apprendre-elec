<text x="471" y="304" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">3 fils à la lampe</text>
<text x="471" y="328" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">retour, neutre, protection</text>
<text x="320" y="394" text-anchor="middle" font-size="14.3" font-weight="500" fill="#5b6673">Tout le circuit est en 1,5 mm²</text>
