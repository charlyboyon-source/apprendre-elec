<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Montage 4 fils : le circuit de commande est séparé du circuit de puissance ; deux conducteurs pour la commande, deux pour la puissance">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le montage 4 fils</text>
<rect x="12" y="28" width="144" height="112" rx="9" fill="#24282f" stroke="#e8eaed" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="9.5" fill="#e8eaed" font-weight="bold">COMMANDE</text>
<text x="84" y="68" text-anchor="middle" font-size="11" fill="#e8eaed" font-weight="bold">2 conducteurs</text>
<text x="84" y="83" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="98" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">son alimentation</text>
<text x="84" y="113" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">et le retour des</text>
<text x="84" y="128" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">boutons-poussoirs</text>
<rect x="164" y="28" width="144" height="112" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">PUISSANCE</text>
<text x="236" y="68" text-anchor="middle" font-size="11" fill="#ffd23f" font-weight="bold">2 conducteurs</text>
<text x="236" y="83" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="98" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">la phase</text>
<text x="236" y="113" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">et le retour lampe</text>
<text x="160" y="160" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">Deux circuits séparés : 2 + 2 = 4 fils</text>
<text x="160" y="176" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Utile quand la commande a sa propre alimentation</text>
</svg>
