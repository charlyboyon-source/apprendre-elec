<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="La puissance : P = U × I, en watts. Pour trouver le courant d'un appareil : I = P / U, soit 2 300 W divisés par 230 V = 10 A">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">La puissance : P = U × I</text>
<polygon points="40,74 64,85 64,119 40,108" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,74 64,85 64,119 40,108" fill="#e85b50" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,85 92,74 92,108 64,119" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="64,85 92,74 92,108 64,119" fill="#e85b50" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="40,74 68,63 92,74 64,85" fill="#e85b50" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="66" y="58" text-anchor="middle" font-size="11" fill="#e85b50" font-weight="bold">2 300 W</text>
<text x="66" y="140" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">un appareil</text>
<text x="138" y="66" text-anchor="start" font-size="15" fill="#ffd23f" font-weight="bold">P = U × I</text>
<text x="138" y="80" text-anchor="start" font-size="7.8" fill="#e8eaed" font-weight="normal">la puissance, en watts (W)</text>
<text x="138" y="108" text-anchor="start" font-size="13" fill="#e8eaed" font-weight="bold">I = P / U</text>
<text x="138" y="124" text-anchor="start" font-size="11" fill="#4cd97b" font-weight="bold">2 300 / 230 = 10 A</text>
<text x="160" y="176" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">De la puissance d'un appareil, on déduit son courant</text>
</svg>
