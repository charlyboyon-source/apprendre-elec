<path d="M120 226 H200 V182 H470 V226 H560" fill="#fff1c2" stroke="#e0a800" stroke-width="3"/>
<text x="213" y="74" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">appui</text>
