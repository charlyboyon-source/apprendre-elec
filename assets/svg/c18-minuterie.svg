<text x="515" y="250" text-anchor="middle" font-size="13.7" font-weight="500" fill="#5b6673">éteint</text>
<path d="M200 270 H470" stroke="#1c2530" stroke-width="1.8"/><path d="M200 262 V278 M470 262 V278" stroke="#1c2530" stroke-width="1.8"/>
<text x="335" y="294" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">durée réglée</text>
<text x="590" y="124" text-anchor="end" font-size="14.3" font-weight="500" fill="#5b6673">t</text>
<text x="320" y="330" text-anchor="middle" font-size="15.0" font-weight="500" fill="#5b6673">Escaliers, couloirs, parties communes</text>
<rect x="24" y="344" width="592" height="46" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="373.0" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">Boutons-poussoirs en parallèle, comme pour un télérupteur</text>
