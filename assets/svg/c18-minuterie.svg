<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Chronogramme de la minuterie : un appui sur le bouton-poussoir allume la lampe, qui s'éteint seule une fois la durée réglée écoulée">
