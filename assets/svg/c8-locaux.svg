<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Choisir selon le local : salon sec IP20 ; salle de bain IPX4 à IPX7 selon le volume ; extérieur IP44 ou plus ; atelier poussiéreux IP5X ou IP6X ; parking ou local public IK élevé">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">À chaque local son matériel</text>
<rect x="12" y="26" width="296" height="26" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="31" width="4" height="16" rx="2" fill="#4cd97b"/>
<text x="24" y="42.0" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">Salon sec</text>
<text x="128" y="42.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IP20</text>
<rect x="12" y="56" width="296" height="26" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="61" width="4" height="16" rx="2" fill="#5aa9e6"/>
<text x="24" y="72.0" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">Salle de bain</text>
<text x="128" y="72.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IPX4 à IPX7 selon le volume</text>
<rect x="12" y="86" width="296" height="26" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="91" width="4" height="16" rx="2" fill="#ffd23f"/>
<text x="24" y="102.0" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">Extérieur</text>
<text x="128" y="102.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IP44 ou plus, avec un bon IK</text>
<rect x="12" y="116" width="296" height="26" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="121" width="4" height="16" rx="2" fill="#ff8c2b"/>
<text x="24" y="132.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">Atelier poussiéreux</text>
<text x="128" y="132.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IP5X ou IP6X</text>
<rect x="12" y="146" width="296" height="26" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="151" width="4" height="16" rx="2" fill="#e85b50"/>
<text x="24" y="162.0" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">Parking, local public</text>
<text x="128" y="162.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">IK élevé</text>
<text x="160" y="188" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">On ne sous-classe jamais un matériel</text>
</svg>
