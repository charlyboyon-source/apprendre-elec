<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170" viewBox="0 0 300 170" role="img" aria-label="Contact direct et contact indirect">
  <text x="75" y="16" text-anchor="middle" font-size="9" fill="#e85b50" font-weight="bold">CONTACT DIRECT</text>
  <line x1="40" y1="30" x2="40" y2="120" stroke="#e8744f" stroke-width="3"/>
  <text x="20" y="30" font-size="8" fill="#e8744f">fil nu</text>
  <circle cx="95" cy="45" r="9" fill="none" stroke="#e8ecf0" stroke-width="1.6"/>
  <line x1="95" y1="54" x2="95" y2="92" stroke="#e8ecf0" stroke-width="1.6"/>
  <line x1="95" y1="64" x2="44" y2="60" stroke="#e8ecf0" stroke-width="1.6"/>
  <line x1="95" y1="92" x2="82" y2="120" stroke="#e8ecf0" stroke-width="1.6"/>
  <line x1="95" y1="92" x2="108" y2="120" stroke="#e8ecf0" stroke-width="1.6"/>
  <text x="48" y="52" font-size="8" fill="#e85b50">⚡</text>
  <text x="75" y="140" text-anchor="middle" font-size="7.5" fill="#9aa6b3">on touche une pièce</text>
  <text x="75" y="151" text-anchor="middle" font-size="7.5" fill="#9aa6b3">normalement sous tension</text>
  <line x1="150" y1="14" x2="150" y2="160" stroke="#2d323b" stroke-width="1"/>
  <text x="225" y="16" text-anchor="middle" font-size="9" fill="#e8744f" font-weight="bold">CONTACT INDIRECT</text>
  <rect x="186" y="34" width="34" height="48" rx="3" fill="none" stroke="#9aa6b3" stroke-width="2"/>
  <text x="203" y="62" text-anchor="middle" font-size="8" fill="#9aa6b3">masse</text>
  <line x1="186" y1="44" x2="172" y2="44" stroke="#e8744f" stroke-width="2"/>
  <text x="160" y="40" font-size="7" fill="#e8744f">défaut</text>
  <circle cx="248" cy="48" r="9" fill="none" stroke="#e8ecf0" stroke-width="1.6"/>
  <line x1="248" y1="57" x2="248" y2="95" stroke="#e8ecf0" stroke-width="1.6"/>
  <line x1="248" y1="66" x2="221" y2="60" stroke="#e8ecf0" stroke-width="1.6"/>
  <line x1="248" y1="95" x2="235" y2="120" stroke="#e8ecf0" stroke-width="1.6"/>
  <line x1="248" y1="95" x2="261" y2="120" stroke="#e8ecf0" stroke-width="1.6"/>
  <text x="225" y="140" text-anchor="middle" font-size="7.5" fill="#9aa6b3">on touche une masse mise</text>
  <text x="225" y="151" text-anchor="middle" font-size="7.5" fill="#9aa6b3">sous tension par un défaut</text>
</svg>