<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="De la cellule à l'installation : des cellules assemblées forment un module ; des modules forment un champ. La puissance d'un module s'exprime en watts-crête, par exemple 400 Wc">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">De la cellule au champ de panneaux</text>
<rect x="12" y="36" width="90" height="50" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="57" y="51" text-anchor="middle" font-size="8.5" fill="#5aa9e6" font-weight="bold">CELLULE</text>
<text x="57" y="64" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">la brique</text>
<text x="57" y="74" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">de base</text>
<polyline points="105,61.0 110,61.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,61.0 108,57.0 108,65.0" fill="#9aa6b3"/>
<rect x="115" y="36" width="90" height="50" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="160" y="51" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">MODULE</text>
<text x="160" y="64" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">des cellules</text>
<text x="160" y="74" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">assemblées : le panneau</text>
<polyline points="208,61.0 213,61.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,61.0 211,57.0 211,65.0" fill="#9aa6b3"/>
<rect x="218" y="36" width="90" height="50" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="263" y="51" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">CHAMP</text>
<text x="263" y="64" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">plusieurs modules</text>
<text x="263" y="74" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">reliés entre eux</text>
<rect x="40" y="100" width="240" height="30" rx="9" fill="#ffd23f" stroke="#ffd23f" stroke-width="1.2" fill-opacity="0.07"/>
<text x="160" y="119" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">8 modules de 400 Wc = 3 200 Wc = 3,2 kWc</text>
<text x="160" y="150" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">Wc : watt-crête, la puissance en plein soleil</text>
<text x="160" y="168" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">La puissance réelle varie avec le soleil, l'orientation et l'ombre</text>
</svg>
