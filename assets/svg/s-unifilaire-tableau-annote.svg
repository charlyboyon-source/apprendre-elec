<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Schéma unifilaire annoté d'un tableau de logement : de haut en bas, le disjoncteur de branchement, deux interrupteurs différentiels 30 mA de type AC et de type A, puis les disjoncteurs avec leur calibre, la section des conducteurs et ce qu'ils alimentent ; trois traits obliques sur un trait signifient trois conducteurs">
