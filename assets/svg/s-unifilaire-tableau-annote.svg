<text x="387" y="91" text-anchor="start" font-size="12" font-weight="800" fill="#1c2530">Disjoncteur de branchement (AGCP)</text>
<path d="M365 110 L365 136" stroke="#1c2530" stroke-width="2.4" stroke-linecap="round"/>
