<text x="520.0" y="32" text-anchor="middle" font-size="19" font-weight="800" fill="#1c2530">Lire le schéma unifilaire d'un tableau</text>
<path d="M365 58 L365 76" stroke="#1c2530" stroke-width="2.4" stroke-linecap="round"/>
