<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Les modes de charge : mode 2, sur une prise avec un boîtier de contrôle sur le câble ; mode 3, sur une borne dédiée qui dialogue avec le véhicule ; mode 4, charge rapide en courant continu sur borne publique">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Les modes de charge</text>
<rect x="12" y="28" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="33" width="4" height="23" rx="2" fill="#9aa6b3"/>
<text x="24" y="47.5" text-anchor="start" font-size="8.5" fill="#9aa6b3" font-weight="bold">MODE 1</text>
<text x="92" y="42.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">prise ordinaire, sans contrôle</text>
<text x="92" y="54.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">à proscrire pour une voiture</text>
<rect x="12" y="66" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="71" width="4" height="23" rx="2" fill="#ff8c2b"/>
<text x="24" y="85.5" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">MODE 2</text>
<text x="92" y="80.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">prise + boîtier sur le câble</text>
<text x="92" y="92.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">charge lente, à la maison</text>
<rect x="12" y="104" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="109" width="4" height="23" rx="2" fill="#4cd97b"/>
<text x="24" y="123.5" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">MODE 3</text>
<text x="92" y="118.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">borne dédiée</text>
<text x="92" y="130.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">elle dialogue avec le véhicule</text>
<rect x="12" y="142" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="147" width="4" height="23" rx="2" fill="#5aa9e6"/>
<text x="24" y="161.5" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">MODE 4</text>
<text x="92" y="156.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">courant continu</text>
<text x="92" y="168.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">charge rapide, bornes publiques</text>
</svg>
