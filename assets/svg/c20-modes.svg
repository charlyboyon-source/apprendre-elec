<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Les quatre modes de charge : mode 1, prise ordinaire sans contrôle, à proscrire ; mode 2, prise et boîtier de contrôle sur le câble ; mode 3, borne dédiée qui dialogue avec le véhicule ; mode 4, courant continu, charge rapide">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<linearGradient id="icta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949c"/><stop offset=".3" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6b727a"/></linearGradient>
<linearGradient id="tpc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b02020"/><stop offset=".3" stop-color="#ff6b5e"/><stop offset="1" stop-color="#8e1414"/></linearGradient>
<linearGradient id="irl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1b9"/><stop offset=".3" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8d949c"/></linearGradient>
<linearGradient id="terre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a877"/><stop offset="1" stop-color="#a98557"/></linearGradient>
<pattern id="vj" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2e9e4f"/><rect width="7" height="16" fill="#f2d21a"/></pattern>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
<linearGradient id="cellule" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4a8a"/><stop offset="1" stop-color="#16285a"/></linearGradient>
<linearGradient id="cuve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset=".55" stop-color="#ffb3a0"/><stop offset="1" stop-color="#7fb8f0"/></linearGradient>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Les modes de charge</text>
<rect x="16" y="44" width="608" height="84" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<rect x="32.0" y="66.0" width="40" height="40" rx="5.7" fill="url(#nez)" stroke="#b3b9c0"/><circle cx="52" cy="86" r="14.8" fill="#e4e7ea" stroke="#b3b9c0"/><circle cx="46.0" cy="87.6" r="2.4" fill="#1f2428"/><circle cx="58.0" cy="87.6" r="2.4" fill="#1f2428"/><rect x="50.4" y="74.8" width="3.2" height="6.8" rx="1.5" fill="#c9a03a"/>
<path d="M72 86 H168" stroke="#2b3036" stroke-width="5"/>
<path d="M156 64 l24 24 M180 64 l-24 24" stroke="#d92b2b" stroke-width="5" stroke-linecap="round"/>
<text x="200" y="72" text-anchor="start" font-size="16.9" font-weight="800" fill="#d92b2b">MODE 1</text>
<text x="200" y="96" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">prise ordinaire, sans contrôle</text>
<text x="200" y="116" text-anchor="start" font-size="13.7" font-weight="500" fill="#5b6673">à proscrire pour une voiture</text>
<rect x="16" y="136" width="608" height="84" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<rect x="32.0" y="158.0" width="40" height="40" rx="5.7" fill="url(#nez)" stroke="#b3b9c0"/><circle cx="52" cy="178" r="14.8" fill="#e4e7ea" stroke="#b3b9c0"/><circle cx="46.0" cy="179.6" r="2.4" fill="#1f2428"/><circle cx="58.0" cy="179.6" r="2.4" fill="#1f2428"/><rect x="50.4" y="166.8" width="3.2" height="6.8" rx="1.5" fill="#c9a03a"/>
<path d="M72 178 H168" stroke="#2b3036" stroke-width="5"/>
<rect x="100" y="164" width="40" height="28" rx="5" fill="#f4f5f7" stroke="#5b6673" stroke-width="2"/><circle cx="112" cy="178" r="3.5" fill="#1e9e5a"/>
<text x="200" y="164" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">MODE 2</text>
<text x="200" y="188" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">prise + boîtier sur le câble</text>
<text x="200" y="208" text-anchor="start" font-size="13.7" font-weight="500" fill="#5b6673">charge lente, à la maison</text>
<rect x="16" y="228" width="608" height="84" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<g transform="translate(42 236) scale(0.74)" filter="url(#ombre)"><rect width="60" height="90" rx="12" fill="#f4f5f7" stroke="#8d949c" stroke-width="2"/><rect x="12" y="12" width="36" height="16" rx="3" fill="#1f3a2a"/><circle cx="30" cy="54" r="12" fill="#2b3036"/><circle cx="30" cy="54" r="5" fill="#1e9e5a"/></g>
<path d="M86 284 Q130 304 168 276" fill="none" stroke="#2b3036" stroke-width="5"/>
<text x="200" y="256" text-anchor="start" font-size="16.9" font-weight="800" fill="#17804c">MODE 3</text>
<text x="200" y="280" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">borne dédiée</text>
<text x="200" y="300" text-anchor="start" font-size="13.7" font-weight="500" fill="#5b6673">elle dialogue avec le véhicule</text>
<rect x="16" y="320" width="608" height="84" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<g filter="url(#ombre)"><rect x="44" y="326" width="46" height="74" rx="6" fill="#2f6fd0" stroke="#1d4a94"/></g><rect x="52" y="336" width="30" height="16" rx="2" fill="#cfe3f7"/><text x="67" y="382" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">DC</text>
<path d="M90 376 Q130 396 168 368" fill="none" stroke="#2b3036" stroke-width="7"/>
<text x="200" y="348" text-anchor="start" font-size="16.9" font-weight="800" fill="#2166d1">MODE 4</text>
<text x="200" y="372" text-anchor="start" font-size="15.6" font-weight="800" fill="#1c2530">courant continu</text>
<text x="200" y="392" text-anchor="start" font-size="13.7" font-weight="500" fill="#5b6673">charge rapide, bornes publiques</text>
</svg>
