<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Montage en série : un seul chemin, la même intensité partout, les tensions s'additionnent, Re = R1 + R2">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">En série : un seul chemin</text>
<polyline points="40,62 280,62 280,122 40,122 40,62" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="31" y="78" width="18" height="28" rx="4" fill="#24282f" stroke="#ffd23f" stroke-width="2"/>
<text x="40" y="95.5" text-anchor="middle" font-size="10" fill="#ffd23f" font-weight="bold">G</text>
<rect x="103.0" y="54" width="34" height="16" rx="2" fill="#24282f" stroke="#ff8c2b" stroke-width="2"/>
<text x="120" y="65.5" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">R1</text>
<rect x="193.0" y="54" width="34" height="16" rx="2" fill="#24282f" stroke="#ff8c2b" stroke-width="2"/>
<text x="210" y="65.5" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">R2</text>
<polygon points="170,62 162,58 162,66" fill="#ffd23f"/>
<polygon points="155,122 163,118 163,126" fill="#ffd23f"/>
<text x="160" y="108" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">le même courant I partout</text>
<text x="160" y="150" text-anchor="middle" font-size="13" fill="#e8eaed" font-weight="bold">Re = R1 + R2</text>
<text x="160" y="166" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">les tensions s'additionnent</text>
<text x="160" y="182" text-anchor="middle" font-size="7.8" fill="#e85b50" font-weight="normal">Un maillon lâche, tout s'arrête</text>
</svg>
