<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Devant un matériel, deux questions : sa classe (I, II ou III) dit comment il protège contre les chocs électriques ; ses indices IP et IK disent sa résistance à l'eau, à la poussière et aux chocs">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Un matériel, deux questions</text>
<polygon points="134,46 158,57 158,81 134,70" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="134,46 158,57 158,81 134,70" fill="#5a626e" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="158,57 186,46 186,70 158,81" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="158,57 186,46 186,70 158,81" fill="#5a626e" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="134,46 162,35 186,46 158,57" fill="#5a626e" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="160" y="96" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">plaque signalétique</text>
<rect x="12" y="106" width="144" height="70" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="84" y="123" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">LA CLASSE</text>
<text x="84" y="137" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">protection contre</text>
<text x="84" y="147" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">les chocs électriques</text>
<text x="84" y="165" text-anchor="middle" font-size="11" fill="#ffd23f" font-weight="bold">I · II · III</text>
<rect x="164" y="106" width="144" height="70" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="236" y="123" text-anchor="middle" font-size="9.5" fill="#ff8c2b" font-weight="bold">IP et IK</text>
<text x="236" y="137" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">résistance à</text>
<text x="236" y="147" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">l'environnement</text>
<text x="236" y="165" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">eau · poussière · chocs</text>
</svg>
