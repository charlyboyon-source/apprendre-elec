<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Deux résistances de 100 ohms : en série, 200 ohms ; en parallèle, 50 ohms. En parallèle, la résistance équivalente est plus petite que la plus petite">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">100 Ω et 100 Ω : série ou parallèle ?</text>
<polygon points="50,62 74,73 74,137 50,126" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="50,62 74,73 74,137 50,126" fill="#ff8c2b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="74,73 102,62 102,126 74,137" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="74,73 102,62 102,126 74,137" fill="#ff8c2b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="50,62 78,51 102,62 74,73" fill="#ff8c2b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="76" y="45" text-anchor="middle" font-size="12" fill="#ff8c2b" font-weight="bold">200 Ω</text>
<text x="76" y="156" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">EN SÉRIE</text>
<text x="76" y="168" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">100 + 100</text>
<polygon points="170,110 194,121 194,137 170,126" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="170,110 194,121 194,137 170,126" fill="#4cd97b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="194,121 222,110 222,126 194,137" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="194,121 222,110 222,126 194,137" fill="#4cd97b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="170,110 198,99 222,110 194,121" fill="#4cd97b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="196" y="93" text-anchor="middle" font-size="12" fill="#4cd97b" font-weight="bold">50 Ω</text>
<text x="196" y="156" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">EN PARALLÈLE</text>
<text x="196" y="168" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">100 ∥ 100</text>
<text x="160" y="184" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">En parallèle, Re est plus petite que la plus petite</text>
</svg>
