<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Deux résistances de 100 Ω : en série, 200 Ω ; en parallèle, 50 Ω. En parallèle, la résistance équivalente est plus petite que la plus petite">
