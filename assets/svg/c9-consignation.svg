<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="La consignation en quatre étapes, dans l'ordre : séparer, condamner, identifier, vérifier l'absence de tension">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">La consignation : 4 étapes, dans cet ordre</text>
<rect x="12" y="28" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="33" width="4" height="23" rx="2" fill="#ffd23f"/>
<text x="24" y="47.5" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">1 · SÉPARER</text>
<text x="116" y="42.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">isoler l'ouvrage de toute source</text>
<text x="116" y="54.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">ouvrir le disjoncteur, retirer les fusibles</text>
<rect x="12" y="66" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="71" width="4" height="23" rx="2" fill="#ff8c2b"/>
<text x="24" y="85.5" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">2 · CONDAMNER</text>
<text x="116" y="80.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">bloquer en position ouverte</text>
<text x="116" y="92.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">cadenas + pancarte « ne pas manœuvrer »</text>
<rect x="12" y="104" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="109" width="4" height="23" rx="2" fill="#5aa9e6"/>
<text x="24" y="123.5" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">3 · IDENTIFIER</text>
<text x="116" y="118.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">être sûr du bon ouvrage</text>
<text x="116" y="130.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">plans, repérage sur place</text>
<rect x="12" y="142" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="147" width="4" height="23" rx="2" fill="#4cd97b"/>
<text x="24" y="161.5" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">4 · VÉRIFIER</text>
<text x="116" y="156.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">l'absence de tension (VAT)</text>
<text x="116" y="168.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">avec un vérificateur dédié</text>
</svg>
