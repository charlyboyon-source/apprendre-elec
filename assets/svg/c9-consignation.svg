<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="La consignation en quatre étapes : 1, séparer l'ouvrage de toute source ; 2, condamner en position ouverte avec un cadenas et une pancarte ; 3, identifier le bon ouvrage ; 4, vérifier l'absence de tension avec un vérificateur dédié">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<linearGradient id="icta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949c"/><stop offset=".3" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6b727a"/></linearGradient>
<linearGradient id="tpc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b02020"/><stop offset=".3" stop-color="#ff6b5e"/><stop offset="1" stop-color="#8e1414"/></linearGradient>
<linearGradient id="irl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1b9"/><stop offset=".3" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8d949c"/></linearGradient>
<linearGradient id="terre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a877"/><stop offset="1" stop-color="#a98557"/></linearGradient>
<pattern id="vj" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2e9e4f"/><rect width="7" height="16" fill="#f2d21a"/></pattern>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
<linearGradient id="cellule" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4a8a"/><stop offset="1" stop-color="#16285a"/></linearGradient>
<linearGradient id="cuve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset=".55" stop-color="#ffb3a0"/><stop offset="1" stop-color="#7fb8f0"/></linearGradient>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">La consignation : 4 étapes, dans cet ordre</text>
<rect x="16" y="44" width="608" height="82" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<g transform="translate(48 50) scale(0.29)"><rect width="70" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="70" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="20" y="30"/><use href="#borne" x="50" y="30"/><use href="#borne" x="20" y="210"/><use href="#borne" x="50" y="210"/><rect x="18" y="72" width="34" height="56" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="22" y="100" width="26" height="30" rx="4" fill="url(#manette)"/><text x="35" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2530"></text><text x="35" y="169" text-anchor="middle" font-size="9" font-weight="500" fill="#5b6673">230 V~</text></g>
<text x="124" y="72" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">1 · SÉPARER</text>
<text x="124" y="96" text-anchor="start" font-size="15.0" font-weight="800" fill="#1c2530">isoler l'ouvrage de toute source</text>
<text x="124" y="116" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">ouvrir le disjoncteur, retirer les fusibles</text>
<rect x="16" y="134" width="608" height="82" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<path d="M57 166 V156 a11 11 0 0 1 22 0 V166" fill="none" stroke="#7d858e" stroke-width="5"/><rect x="51" y="166" width="34" height="28" rx="5" fill="#d92b2b"/><circle cx="68" cy="179" r="4" fill="#fff"/>
<text x="124" y="162" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">2 · CONDAMNER</text>
<text x="124" y="186" text-anchor="start" font-size="15.0" font-weight="800" fill="#1c2530">bloquer en position ouverte</text>
<text x="124" y="206" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">cadenas + pancarte « ne pas manœuvrer »</text>
<rect x="16" y="224" width="608" height="82" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<rect x="44" y="240" width="52" height="50" rx="4" fill="#fff" stroke="#8d949c" stroke-width="2"/><path d="M52 254 H88 M52 266 H80 M52 278 H86" stroke="#aab1b9" stroke-width="3"/>
<text x="124" y="252" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">3 · IDENTIFIER</text>
<text x="124" y="276" text-anchor="start" font-size="15.0" font-weight="800" fill="#1c2530">être sûr du bon ouvrage</text>
<text x="124" y="296" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">plans, repérage sur place</text>
<rect x="16" y="314" width="608" height="82" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<g transform="translate(70 350) scale(0.55)" filter="url(#ombre)"><rect x="-26" y="-50" width="52" height="96" rx="10" fill="#f2b90c" stroke="#b98a05" stroke-width="2"/><rect x="-18" y="-40" width="36" height="34" rx="3" fill="#2b3036"/><circle cx="-8" cy="-30" r="3" fill="#ff5c5c"/><circle cx="0" cy="-30" r="3" fill="#ffd23f"/><circle cx="8" cy="-30" r="3" fill="#4cd97b"/><path d="M0 46 V70" stroke="#d92b2b" stroke-width="5"/><rect x="-4" y="66" width="8" height="18" rx="2" fill="#aab1b9"/></g>
<text x="124" y="342" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">4 · VÉRIFIER</text>
<text x="124" y="366" text-anchor="start" font-size="15.0" font-weight="800" fill="#1c2530">l'absence de tension (VAT)</text>
<text x="124" y="386" text-anchor="start" font-size="13.0" font-weight="500" fill="#5b6673">avec un vérificateur dédié</text>
</svg>
