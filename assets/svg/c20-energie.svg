<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="La domotique au service de l'énergie : le délestage coupe un appareil non prioritaire pour ne pas dépasser la puissance du contrat ; la programmation décale les usages vers les heures creuses ; le suivi montre la consommation">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Piloter l'énergie</text>
<rect x="12" y="30" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="35" width="4" height="26" rx="2" fill="#e85b50"/>
<text x="24" y="51.0" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">DÉLESTAGE</text>
<text x="112" y="45.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">couper le non-prioritaire</text>
<text x="112" y="57.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">pour ne pas dépasser la puissance du contrat</text>
<rect x="12" y="72" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="77" width="4" height="26" rx="2" fill="#4cd97b"/>
<text x="24" y="93.0" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">PROGRAMMATION</text>
<text x="112" y="87.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">décaler vers les heures creuses</text>
<text x="112" y="99.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">chauffe-eau, recharge du véhicule</text>
<rect x="12" y="114" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="119" width="4" height="26" rx="2" fill="#5aa9e6"/>
<text x="24" y="135.0" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">SUIVI</text>
<text x="112" y="129.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">voir ce que l'on consomme</text>
<text x="112" y="141.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">pour agir au bon endroit</text>
<text x="160" y="172" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">La domotique commande ; les protections, elles, restent au tableau</text>
</svg>
