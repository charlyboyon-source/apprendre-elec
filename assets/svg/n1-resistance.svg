<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="'Segoe UI',system-ui,sans-serif">
<text x="160" y="20" text-anchor="middle" font-size="9" fill="#9aa3b0" font-weight="normal">le frein du courant</text>
<rect x="30" y="46" width="180" height="6" rx="3" fill="none" stroke="#ff8c2b" stroke-width="2"/>
<text x="120" y="72" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="normal">long et fin → résiste beaucoup</text>
<rect x="30" y="92" width="80" height="20" rx="6" fill="none" stroke="#ffd23f" stroke-width="2"/>
<text x="150" y="108" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="normal">court et gros → résiste peu</text>
<line x1="30" y1="132" x2="290" y2="132" stroke="#9aa3b0" stroke-width="1.2"/>
<text x="60" y="152" text-anchor="start" font-size="8.5" fill="#9aa3b0" font-weight="normal">3 facteurs :</text>
<text x="70" y="172" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">longueur</text>
<text x="160" y="172" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">section</text>
<text x="250" y="172" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">matériau</text>
<text x="160" y="192" text-anchor="middle" font-size="8.5" fill="#9aa3b0">R en ohms (Ω)</text>
</svg>