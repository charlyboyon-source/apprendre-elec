<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="La résistance freine le courant, en ohms : un fil long et fin résiste plus, un fil court et gros résiste moins ; l'ohmmètre s'utilise hors tension">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">La résistance : un frein, en ohms</text>
<polyline points="24,62 200,62" fill="none" stroke="#ff8c2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="212" y="58" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">long et fin</text>
<text x="212" y="70" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">résiste PLUS</text>
<polyline points="24,104 110,104" fill="none" stroke="#ff8c2b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="100" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">court et gros</text>
<text x="122" y="112" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">résiste MOINS</text>
<rect x="40" y="128" width="240" height="26" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="160" y="145" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal"><tspan fill="#ffd23f" font-weight="bold" font-size="10">R</tspan> : la résistance, en <tspan fill="#ffd23f" font-weight="bold" font-size="10">ohms (Ω)</tspan></text>
<text x="160" y="174" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">Ohmmètre : toujours HORS tension</text>
</svg>
