<rect x="79.9" y="170" width="175.6" height="26" fill="#c9a400"/>
<rect x="255.6" y="170" width="53.7" height="26" fill="#e8790c"/>
<rect x="309.3" y="170" width="27.6" height="26" fill="#d9480f"/>
<rect x="336.9" y="170" width="253.1" height="26" fill="#a81d1d"/>
<path d="M79.9 162 V204" stroke="#1c2530" stroke-width="2.4"/>
<text x="95.9" y="92" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">0,5 mA</text>
<text x="95.9" y="116" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">perception</text>
<path d="M255.6 196 V162" stroke="#1c2530" stroke-width="2.4"/>
<text x="255.6" y="232" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">10 mA</text>
<text x="255.6" y="254" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">non-lâcher</text>
<path d="M309.3 162 V204" stroke="#1c2530" stroke-width="2.4"/>
<text x="309.3" y="92" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">25 mA</text>
<text x="309.3" y="116" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">muscles</text>
<text x="309.3" y="136" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">respiratoires</text>
<path d="M336.9 196 V162" stroke="#1c2530" stroke-width="2.4"/>
<text x="336.9" y="232" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">40 mA (5 s)</text>
<text x="336.9" y="254" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">fibrillation</text>
<text x="336.9" y="274" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">ventriculaire</text>
<path d="M566.2 162 V204" stroke="#1c2530" stroke-width="2.4"/>
<text x="566.2" y="92" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">2 A</text>
<text x="566.2" y="116" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">centres</text>
<text x="566.2" y="136" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">nerveux</text>
<circle cx="320.0" cy="183" r="18" fill="none" stroke="#2166d1" stroke-width="3"/>
<rect x="24" y="300" width="592" height="52" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="321.5" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">30 mA : sensibilité des DDR,</text>
<text x="320" y="342.5" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">sous le seuil de fibrillation</text>
<text x="320" y="388" text-anchor="middle" font-size="13.7" font-weight="500" fill="#5b6673">Courant alternatif · valeurs de l'INRS</text>
</svg>
