<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Échelle des seuils de courant : 0,5 mA perception, 10 mA non-lâcher, 30 mA paralysie respiratoire, 75 mA fibrillation ventriculaire, 1 A arrêt cardiaque">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Les seuils de courant : du picotement à l'arrêt cardiaque</text>
<polygon points="18.0,124.0 42.0,135.0 42.0,151.0 18.0,140.0" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="18.0,124.0 42.0,135.0 42.0,151.0 18.0,140.0" fill="#4cd97b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="42.0,135.0 70.0,124.0 70.0,140.0 42.0,151.0" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="42.0,135.0 70.0,124.0 70.0,140.0 42.0,151.0" fill="#4cd97b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="18.0,124.0 46.0,113.0 70.0,124.0 42.0,135.0" fill="#4cd97b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
