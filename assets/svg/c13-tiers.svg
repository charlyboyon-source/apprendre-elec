<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Deux règles pour l'ICTA : les conducteurs occupent au plus un tiers de la section intérieure du conduit ; le rayon de cintrage vaut au moins six fois le diamètre du conduit">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Remplissage et cintrage</text>
<rect x="12" y="28" width="144" height="150" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">REMPLISSAGE</text>
<circle cx="84" cy="98" r="32" fill="#24282f" stroke="#9aa6b3" stroke-width="3"/>
<circle cx="72" cy="108" r="8.5" fill="#e85b50" fill-opacity="0.45" stroke="#e85b50" stroke-width="1.4"/><circle cx="72" cy="108" r="4" fill="#ff8c2b"/>
<circle cx="90" cy="112" r="8.5" fill="#5aa9e6" fill-opacity="0.45" stroke="#5aa9e6" stroke-width="1.4"/><circle cx="90" cy="112" r="4" fill="#ff8c2b"/>
<circle cx="82" cy="96" r="8.5" fill="#4cd97b" fill-opacity="0.45" stroke="#4cd97b" stroke-width="1.4"/><circle cx="82" cy="96" r="4" fill="#ff8c2b"/>
<text x="84" y="150" text-anchor="middle" font-size="11" fill="#ffd23f" font-weight="bold">1/3 maximum</text>
<text x="84" y="166" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">de la section intérieure</text>
<rect x="164" y="28" width="144" height="150" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="9.5" fill="#ff8c2b" font-weight="bold">CINTRAGE</text>
<path d="M 190,128 L 226,128 A 44,44 0 0 0 270,84 L 270,62" fill="none" stroke="#9aa6b3" stroke-width="9" stroke-linecap="round"/>
<polyline points="226,84 257,115" fill="none" stroke="#ff8c2b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="232" y="102" text-anchor="middle" font-size="10" fill="#ff8c2b" font-weight="bold">R</text>
<text x="236" y="150" text-anchor="middle" font-size="11" fill="#ff8c2b" font-weight="bold">R ≥ 6 × diamètre</text>
<text x="236" y="166" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">ICTA 20 → 120 mm</text>
</svg>
