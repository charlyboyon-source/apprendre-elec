<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Puissances de recharge : prise ordinaire 1,8 kW sous 8 A ; prise renforcée 3,2 kW sous 14 A ; borne monophasée 7,4 kW sous 32 A ; borne triphasée jusqu'à 22 kW">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Plus de puissance, moins d'attente</text>
<polygon points="30,114 54,125 54,135 30,124" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="30,114 54,125 54,135 30,124" fill="#9aa6b3" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="54,125 82,114 82,124 54,135" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="54,125 82,114 82,124 54,135" fill="#9aa6b3" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="30,114 58,103 82,114 54,125" fill="#9aa6b3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="56" y="97" text-anchor="middle" font-size="10.5" fill="#9aa6b3" font-weight="bold">1,8 kW</text>
<text x="56" y="154" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">8 A</text>
<text x="56" y="166" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">prise ordinaire</text>
<polygon points="102,106 126,117 126,135 102,124" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="102,106 126,117 126,135 102,124" fill="#ff8c2b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="126,117 154,106 154,124 126,135" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="126,117 154,106 154,124 126,135" fill="#ff8c2b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="102,106 130,95 154,106 126,117" fill="#ff8c2b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="128" y="89" text-anchor="middle" font-size="10.5" fill="#ff8c2b" font-weight="bold">3,2 kW</text>
<text x="128" y="154" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">14 A</text>
<text x="128" y="166" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">prise renforcée</text>
<polygon points="174,84 198,95 198,135 174,124" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="174,84 198,95 198,135 174,124" fill="#4cd97b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="198,95 226,84 226,124 198,135" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="198,95 226,84 226,124 198,135" fill="#4cd97b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="174,84 202,73 226,84 198,95" fill="#4cd97b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="200" y="67" text-anchor="middle" font-size="10.5" fill="#4cd97b" font-weight="bold">7,4 kW</text>
<text x="200" y="154" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">32 A</text>
<text x="200" y="166" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">borne monophasée</text>
<polygon points="246,56 270,67 270,135 246,124" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="246,56 270,67 270,135 246,124" fill="#5aa9e6" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="270,67 298,56 298,124 270,135" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="270,67 298,56 298,124 270,135" fill="#5aa9e6" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="246,56 274,45 298,56 270,67" fill="#5aa9e6" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="272" y="39" text-anchor="middle" font-size="10.5" fill="#5aa9e6" font-weight="bold">22 kW</text>
<text x="272" y="154" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">triphasé</text>
<text x="272" y="166" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">borne triphasée</text>
<text x="160" y="188" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">P = U × I : 230 V × 32 A = 7 360 W, soit 7,4 kW</text>
</svg>
