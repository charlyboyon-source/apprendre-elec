<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Sections courantes : 1,5 mm² pour l'éclairage, disjoncteur 16 A au plus ; 2,5 mm² pour les prises, 20 A au plus ; 6 mm² pour la plaque de cuisson, 32 A au plus">
