<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Sections courantes : 1,5 mm² pour l'éclairage, disjoncteur 16 A au plus ; 2,5 mm² pour les prises, 20 A au plus ; 6 mm² pour la plaque de cuisson, 32 A au plus">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Trois sections à connaître par cœur</text>
<rect x="12" y="34" width="296" height="38" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<circle cx="38" cy="53" r="10" fill="#e85b50" fill-opacity="0.3" stroke="#e85b50" stroke-width="1.4"/><circle cx="38" cy="53" r="5" fill="#ff8c2b"/>
<text x="66" y="51" text-anchor="start" font-size="11" fill="#e8eaed" font-weight="bold">1,5 mm²</text>
<text x="66" y="64" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">éclairage</text>
<text x="298" y="57" text-anchor="end" font-size="10" fill="#ffd23f" font-weight="bold">16 A maximum</text>
<rect x="12" y="78" width="296" height="38" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<circle cx="38" cy="97" r="12" fill="#e85b50" fill-opacity="0.3" stroke="#e85b50" stroke-width="1.4"/><circle cx="38" cy="97" r="7" fill="#ff8c2b"/>
<text x="66" y="95" text-anchor="start" font-size="11" fill="#e8eaed" font-weight="bold">2,5 mm²</text>
<text x="66" y="108" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">prises de courant</text>
<text x="298" y="101" text-anchor="end" font-size="10" fill="#ffd23f" font-weight="bold">20 A maximum</text>
<rect x="12" y="122" width="296" height="38" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<circle cx="38" cy="141" r="16" fill="#e85b50" fill-opacity="0.3" stroke="#e85b50" stroke-width="1.4"/><circle cx="38" cy="141" r="11" fill="#ff8c2b"/>
<text x="66" y="139" text-anchor="start" font-size="11" fill="#e8eaed" font-weight="bold">6 mm²</text>
<text x="66" y="152" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">plaque de cuisson</text>
<text x="298" y="145" text-anchor="end" font-size="10" fill="#ffd23f" font-weight="bold">32 A maximum</text>
<text x="160" y="180" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Plus le courant est fort, plus la section est grosse</text>
</svg>
