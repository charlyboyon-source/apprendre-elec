<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Une infrastructure de recharge : le tableau alimente un point de recharge par un circuit dédié, et le point de recharge alimente le véhicule">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">IRVE : du tableau au véhicule</text>
<rect x="12" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="57" y="55" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">TABLEAU</text>
<text x="57" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">un circuit dédié</text>
<text x="57" y="78" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">et ses protections</text>
<polyline points="105,65.0 110,65.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,65.0 108,61.0 108,69.0" fill="#9aa6b3"/>
<rect x="115" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="160" y="55" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">RECHARGE</text>
<text x="160" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">prise renforcée</text>
<text x="160" y="78" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">ou borne murale</text>
<polyline points="208,65.0 213,65.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,65.0 211,61.0 211,69.0" fill="#9aa6b3"/>
<rect x="218" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="263" y="55" text-anchor="middle" font-size="8.5" fill="#5aa9e6" font-weight="bold">VÉHICULE</text>
<text x="263" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">son chargeur</text>
<text x="263" y="78" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">et sa batterie</text>
<text x="160" y="118" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">IRVE : infrastructure de recharge pour véhicules électriques</text>
<text x="160" y="140" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">Une charge dure des heures, à pleine puissance</text>
<text x="160" y="160" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">C'est ce qui la rend exigeante pour l'installation</text>
</svg>
