<text x="164" y="252" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">un peu trop de courant</text>
<text x="164" y="273" text-anchor="middle" font-size="16.9" font-weight="500" fill="#1c2530">pendant longtemps</text>
<text x="164" y="303" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">les conducteurs chauffent</text>
<text x="164" y="324" text-anchor="middle" font-size="16.2" font-weight="500" fill="#5b6673">l'isolant se dégrade</text>
<text x="164" y="353" text-anchor="middle" font-size="16.2" font-weight="500" fill="#5b6673">trop d'appareils</text>
<text x="164" y="373" text-anchor="middle" font-size="16.2" font-weight="500" fill="#5b6673">sur le même circuit</text>
