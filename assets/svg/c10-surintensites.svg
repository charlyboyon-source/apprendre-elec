<text x="352" y="112" text-anchor="start" font-size="15.6" font-weight="800" fill="#d92b2b">phase</text>
<text x="352" y="228" text-anchor="start" font-size="15.6" font-weight="800" fill="#2166d1">neutre</text>
<text x="476" y="252" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">un courant énorme</text>
<text x="476" y="273" text-anchor="middle" font-size="16.9" font-weight="500" fill="#1c2530">en une fraction de seconde</text>
<text x="476" y="303" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">il faut couper tout de suite</text>
<text x="476" y="324" text-anchor="middle" font-size="16.2" font-weight="500" fill="#5b6673">arc, fusion, incendie</text>
<text x="476" y="353" text-anchor="middle" font-size="16.2" font-weight="500" fill="#5b6673">phase et neutre</text>
<text x="476" y="373" text-anchor="middle" font-size="16.2" font-weight="500" fill="#5b6673">en contact direct</text>
</svg>
