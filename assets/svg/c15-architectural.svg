<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le schéma architectural : sur le plan du logement, il montre où se trouvent les appareils et quel interrupteur commande quel point lumineux">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le schéma architectural : où ?</text>
<rect x="30" y="34" width="170" height="120" fill="none" stroke="#9aa6b3" stroke-width="3"/>
<polyline points="30,112 30,136" fill="none" stroke="#1c1f24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 30,136 A 24,24 0 0 0 54,112" fill="none" stroke="#9aa6b3" stroke-width="1.2"/>
<circle cx="115" cy="90" r="9" fill="#1c1f24" stroke="#ffd23f" stroke-width="2"/>
<polyline points="108.7,83.7 121.3,96.3" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="108.7,96.3 121.3,83.7" fill="none" stroke="#ffd23f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="46" cy="100" r="4" fill="none" stroke="#ff8c2b" stroke-width="2"/>
<polyline points="49,97 58,86" fill="none" stroke="#ff8c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="58,86 62,90" fill="none" stroke="#ff8c2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 50,98 Q 80,70 106,88" fill="none" stroke="#ff8c2b" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M 170,146 A 8,8 0 0 1 186,146" fill="none" stroke="#4cd97b" stroke-width="2"/>
<polyline points="178,138 178,130" fill="none" stroke="#4cd97b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="212" y="60" text-anchor="start" font-size="9.5" fill="#ffd23f" font-weight="bold">sur le PLAN</text>
<text x="212" y="72" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">du logement</text>
<text x="212" y="98" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">l'emplacement</text>
<text x="212" y="108" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">de chaque appareil</text>
<text x="212" y="132" text-anchor="start" font-size="8" fill="#ff8c2b" font-weight="bold">en pointillé :</text>
<text x="212" y="142" text-anchor="start" font-size="8" fill="#e8eaed" font-weight="normal">qui commande quoi</text>
<text x="160" y="180" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Il ne montre pas le câblage</text>
</svg>
