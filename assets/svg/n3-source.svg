<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le générateur impose la tension : dans un logement, le réseau fournit 230 V entre la phase et le neutre">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le générateur impose la tension</text>
<polygon points="34,72 58,83 58,119 34,108" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="34,72 58,83 58,119 34,108" fill="#ffd23f" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="58,83 86,72 86,108 58,119" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="58,83 86,72 86,108 58,119" fill="#ffd23f" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="34,72 62,61 86,72 58,83" fill="#ffd23f" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="60" y="56" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">le réseau</text>
<polyline points="86,82 220,82" fill="none" stroke="#e85b50" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="86,104 220,104" fill="none" stroke="#5aa9e6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="232" y="86" text-anchor="start" font-size="9" fill="#e85b50" font-weight="bold">phase</text>
<text x="232" y="108" text-anchor="start" font-size="9" fill="#5aa9e6" font-weight="bold">neutre</text>
<polyline points="150,86 150,100" fill="none" stroke="#e8eaed" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="150,80 146,88 154,88" fill="#e8eaed"/>
<polygon points="150,106 146,98 154,98" fill="#e8eaed"/>
<text x="160" y="97" text-anchor="start" font-size="11" fill="#4cd97b" font-weight="bold">230 V</text>
<text x="160" y="146" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">230 V entre la phase et le neutre</text>
<text x="160" y="174" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Tout générateur réel a une résistance interne</text>
</svg>
