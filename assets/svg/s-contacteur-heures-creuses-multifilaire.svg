<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Schéma multifilaire du contacteur heures creuses : en commande, la phase protégée par un disjoncteur 2 A va à la borne C1 du compteur, la borne C2 rejoint la borne A1 de la bobine, A2 est reliée au neutre ; en puissance, la phase et le neutre du disjoncteur 20 A traversent les contacts du contacteur puis alimentent le chauffe-eau en 2,5 mm², la terre va directement au chauffe-eau">
