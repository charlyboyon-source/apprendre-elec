<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Trois pannes d'un allumage : la lampe ne s'allume jamais, ampoule grillée ou conducteur coupé ; la lampe reste allumée, contact collé ou fils inversés ; le disjoncteur déclenche, court-circuit">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">La lampe ne s'allume pas : par où commencer ?</text>
<rect x="12" y="30" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="35" width="4" height="26" rx="2" fill="#ffd23f"/>
<text x="24" y="51.0" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">NE S'ALLUME PAS</text>
<text x="118" y="45.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">l'ampoule d'abord</text>
<text x="118" y="57.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">puis le disjoncteur, puis les connexions</text>
<rect x="12" y="72" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="77" width="4" height="26" rx="2" fill="#ff8c2b"/>
<text x="24" y="93.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">RESTE ALLUMÉE</text>
<text x="118" y="87.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">phase et retour pontés</text>
<text x="118" y="99.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">contact collé ou erreur de câblage</text>
<rect x="12" y="114" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="119" width="4" height="26" rx="2" fill="#e85b50"/>
<text x="24" y="135.0" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">ÇA DISJONCTE</text>
<text x="118" y="129.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">court-circuit</text>
<text x="118" y="141.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">on cherche, on ne réarme pas en boucle</text>
<text x="160" y="172" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">Toute intervention : hors tension, absence de tension vérifiée</text>
</svg>
