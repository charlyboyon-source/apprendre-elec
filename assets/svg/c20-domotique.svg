<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Domotique : des capteurs informent, une commande décide, des actionneurs agissent. Exemple : il fait nuit, la commande ferme les volets">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
