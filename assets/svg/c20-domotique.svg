<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">La domotique : informer, décider, agir</text>
<rect x="16" y="44" width="196" height="224" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="114" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#b85a08">CAPTEURS</text>
<circle cx="114" cy="134" r="34" fill="#f4f5f7" stroke="#8d949c" stroke-width="2"/><circle cx="114" cy="134" r="18" fill="#e4e7ea" stroke="#aab1b9"/><circle cx="114" cy="134" r="6" fill="#d92b2b"/>
<text x="114" y="208" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">ils informent</text>
<text x="114" y="230" text-anchor="middle" font-size="12.3" font-weight="500" fill="#5b6673">détecteur, sonde, bouton</text>
<rect x="220" y="44" width="196" height="224" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="318" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#b85a08">COMMANDE</text>
<g filter="url(#ombre)"><rect x="272" y="104" width="92" height="62" rx="12" fill="#fff" stroke="#8d949c" stroke-width="2"/></g><circle cx="294" cy="135" r="5" fill="#1e9e5a"/><circle cx="310" cy="135" r="5" fill="#1e9e5a"/><circle cx="326" cy="135" r="5" fill="#e4e7ea"/>
<text x="318" y="208" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">elle décide</text>
<text x="318" y="230" text-anchor="middle" font-size="12.3" font-weight="500" fill="#5b6673">centrale, box, appli</text>
<rect x="424" y="44" width="196" height="224" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="522" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#b85a08">ACTIONNEURS</text>
<rect x="476" y="96" width="92" height="80" rx="4" fill="#cfe3f7" stroke="#8d949c" stroke-width="2"/>
<rect x="478" y="98" width="88" height="8.5" fill="#e4e7ea" stroke="#aab1b9" stroke-width=".8"/>
<rect x="478" y="108" width="88" height="8.5" fill="#e4e7ea" stroke="#aab1b9" stroke-width=".8"/>
<rect x="478" y="118" width="88" height="8.5" fill="#e4e7ea" stroke="#aab1b9" stroke-width=".8"/>
<rect x="478" y="128" width="88" height="8.5" fill="#e4e7ea" stroke="#aab1b9" stroke-width=".8"/>
<rect x="478" y="138" width="88" height="8.5" fill="#e4e7ea" stroke="#aab1b9" stroke-width=".8"/>
<text x="522" y="208" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">ils agissent</text>
<text x="522" y="230" text-anchor="middle" font-size="12.3" font-weight="500" fill="#5b6673">relais, variateur, moteur</text>
<path d="M208 134 H224" stroke="#b85a08" stroke-width="4"/><polygon points="222,126 234,134 222,142" fill="#b85a08"/>
<path d="M412 134 H428" stroke="#b85a08" stroke-width="4"/><polygon points="426,126 438,134 426,142" fill="#b85a08"/>
<rect x="24" y="282" width="592" height="40" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="308.0" text-anchor="middle" font-size="14.3" font-weight="800" fill="#1c2530">Exemple : il fait nuit → la commande ferme les volets</text>
<text x="320" y="354" text-anchor="middle" font-size="13.7" font-weight="800" fill="#1c2530">La commande n'est plus câblée « en dur » : elle se programme</text>
<text x="320" y="380" text-anchor="middle" font-size="13.7" font-weight="500" fill="#5b6673">Éclairage, volets, chauffage, alarme, recharge</text>
</svg>
