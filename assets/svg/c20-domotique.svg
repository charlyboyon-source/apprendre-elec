<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="La domotique en trois éléments : des capteurs qui informent, une commande qui décide, des actionneurs qui agissent">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">La domotique : informer, décider, agir</text>
<rect x="12" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="57" y="55" text-anchor="middle" font-size="8.5" fill="#5aa9e6" font-weight="bold">CAPTEURS</text>
<text x="57" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">ils informent</text>
<text x="57" y="78" text-anchor="middle" font-size="6.6" fill="#e8eaed" font-weight="normal">détecteur, sonde, bouton</text>
<polyline points="105,65.0 110,65.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,65.0 108,61.0 108,69.0" fill="#9aa6b3"/>
<rect x="115" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="160" y="55" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">COMMANDE</text>
<text x="160" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">elle décide</text>
<text x="160" y="78" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">centrale, box, appli</text>
<polyline points="208,65.0 213,65.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,65.0 211,61.0 211,69.0" fill="#9aa6b3"/>
<rect x="218" y="40" width="90" height="50" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="263" y="55" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">ACTIONNEURS</text>
<text x="263" y="68" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">ils agissent</text>
<text x="263" y="78" text-anchor="middle" font-size="6.6" fill="#e8eaed" font-weight="normal">relais, variateur, moteur</text>
<text x="160" y="120" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">Exemple : il fait nuit → la commande ferme les volets</text>
<text x="160" y="146" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">La commande n'est plus câblée « en dur » : elle se programme</text>
<text x="160" y="164" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Éclairage, volets, chauffage, alarme, recharge</text>
</svg>
