<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Double allumage : à l'interrupteur, trois fils, la phase commune et deux retours lampe ; à chaque lampe, trois fils, le retour lampe, le neutre et la protection">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<linearGradient id="icta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949c"/><stop offset=".3" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6b727a"/></linearGradient>
<linearGradient id="tpc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b02020"/><stop offset=".3" stop-color="#ff6b5e"/><stop offset="1" stop-color="#8e1414"/></linearGradient>
<linearGradient id="irl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1b9"/><stop offset=".3" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8d949c"/></linearGradient>
<linearGradient id="terre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a877"/><stop offset="1" stop-color="#a98557"/></linearGradient>
<pattern id="vj" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2e9e4f"/><rect width="7" height="16" fill="#f2d21a"/></pattern>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Double allumage : combien de fils ?</text>
<rect x="16" y="44" width="296" height="320" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<rect x="328" y="44" width="296" height="320" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="164" y="72" text-anchor="middle" font-size="17.6" font-weight="800" fill="#b85a08">À L'INTERRUPTEUR</text>
<text x="476" y="72" text-anchor="middle" font-size="17.6" font-weight="800" fill="#b85a08">À CHAQUE LAMPE</text>
<g filter="url(#ombre)"><rect x="54" y="88" width="220" height="96" rx="10" fill="#f4f5f7" stroke="#aab1b9"/></g>
<text x="164.0" y="112" text-anchor="middle" font-size="13.7" font-weight="800" fill="#5b6673">interrupteur double, vu de dos</text>
<path d="M104 170 V220" fill="none" stroke="#d92b2b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="91" y="148" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="104" cy="161" r="7" fill="url(#vis)"/>
<text x="104" y="138" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">L</text>
<path d="M164 170 V220" fill="none" stroke="#f28c28" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="151" y="148" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="164" cy="161" r="7" fill="url(#vis)"/>
<text x="164" y="138" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">1</text>
<path d="M224 170 V220" fill="none" stroke="#f28c28" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="211" y="148" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="224" cy="161" r="7" fill="url(#vis)"/>
<text x="224" y="138" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">2</text>
<g filter="url(#ombre)"><rect x="366" y="88" width="220" height="96" rx="10" fill="#f4f5f7" stroke="#aab1b9"/></g>
<text x="476.0" y="112" text-anchor="middle" font-size="13.7" font-weight="800" fill="#5b6673">DCL, vu de dos</text>
<path d="M416 170 V220" fill="none" stroke="#f28c28" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="403" y="148" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="416" cy="161" r="7" fill="url(#vis)"/>
<text x="416" y="138" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">L</text>
<path d="M476 170 V220" fill="none" stroke="#2166d1" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="463" y="148" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="476" cy="161" r="7" fill="url(#vis)"/>
<text x="476" y="138" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">N</text>
<path d="M536 170 V220" fill="none" stroke="#2e9e4f" stroke-width="6" stroke-linejoin="round"/><path d="M536 170 V220" fill="none" stroke="#f2d21a" stroke-width="6" stroke-dasharray="6 6" stroke-linejoin="round"/>
<rect x="523" y="148" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="536" cy="161" r="7" fill="url(#vis)"/>
<text x="536" y="138" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">⏚</text>
<text x="164" y="248" text-anchor="middle" font-size="19.5" font-weight="800" fill="#1c2530">3 fils</text>
<text x="164" y="276" text-anchor="middle" font-size="15.0" font-weight="500" fill="#d92b2b">1 phase (commune)</text>
<text x="164" y="298" text-anchor="middle" font-size="15.0" font-weight="500" fill="#f28c28">2 retours lampe</text>
<text x="164" y="322" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">un retour par point lumineux</text>
<text x="476" y="248" text-anchor="middle" font-size="19.5" font-weight="800" fill="#1c2530">3 fils</text>
<text x="476" y="276" text-anchor="middle" font-size="15.0" font-weight="500" fill="#f28c28">1 retour lampe</text>
<text x="476" y="298" text-anchor="middle" font-size="15.0" font-weight="500" fill="#2166d1">1 neutre</text>
<text x="476" y="320" text-anchor="middle" font-size="15.0" font-weight="500" fill="#17804c">1 protection</text>
<text x="320" y="392" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">Le neutre ne passe jamais par l'interrupteur</text>
<text x="320" y="418" text-anchor="middle" font-size="13.7" font-weight="500" fill="#5b6673">Tout le circuit est en 1,5 mm²</text>
</svg>
