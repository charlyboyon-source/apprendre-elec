<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Peau sèche : environ 5 000 ohms, tension limite 50 V. Peau mouillée : environ 1 000 ohms, tension limite 25 V">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Mouillé, le corps résiste cinq fois moins</text>
<polygon points="24,60 48,71 48,141 24,130" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="24,60 48,71 48,141 24,130" fill="#4cd97b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="48,71 76,60 76,130 48,141" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="48,71 76,60 76,130 48,141" fill="#4cd97b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="24,60 52,49 76,60 48,71" fill="#4cd97b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="50" y="43" text-anchor="middle" font-size="10" fill="#4cd97b" font-weight="bold">5 000 Ω</text>
<text x="50" y="158" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">peau sèche</text>
<polygon points="100,116 124,127 124,141 100,130" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="100,116 124,127 124,141 100,130" fill="#e85b50" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="124,127 152,116 152,130 124,141" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="124,127 152,116 152,130 124,141" fill="#e85b50" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="100,116 128,105 152,116 124,127" fill="#e85b50" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="126" y="99" text-anchor="middle" font-size="10" fill="#e85b50" font-weight="bold">1 000 Ω</text>
<text x="126" y="158" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">peau mouillée</text>
<rect x="180" y="44" width="126" height="44" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="243" y="61" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">milieu sec</text>
<text x="243" y="77" text-anchor="middle" font-size="11" fill="#4cd97b" font-weight="bold">UL = 50 V</text>
<rect x="180" y="98" width="126" height="44" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="243" y="115" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">milieu mouillé</text>
<text x="243" y="131" text-anchor="middle" font-size="11" fill="#e85b50" font-weight="bold">UL = 25 V</text>
<text x="160" y="181" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Même tension, résistance plus faible : courant plus fort</text>
</svg>
