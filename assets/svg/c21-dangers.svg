<rect x="152.6" y="146.6" width="12.8" height="11.8" fill="url(#cellule)"/>
<rect x="152.6" y="159.6" width="12.8" height="11.8" fill="url(#cellule)"/>
<text x="114" y="214" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">sous tension dès</text>
<text x="114" y="235" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">qu'il fait jour</text>
<text x="114" y="256" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">un panneau ne</text>
<text x="114" y="277" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">s'éteint pas</text>
<rect x="220" y="44" width="196" height="264" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="318" y="72" text-anchor="middle" font-size="15.6" font-weight="800" fill="#d92b2b">TENSION ÉLEVÉE</text>
<path d="M318 92 L370 184 H266 Z" fill="#ffd23f" stroke="#1c2530" stroke-width="4" stroke-linejoin="round"/><path d="M324 114 L306 150 H322 L312 176 L336 138 H320 Z" fill="#1c2530"/>
<text x="318" y="214" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">plusieurs centaines</text>
<text x="318" y="235" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">de volts</text>
<text x="318" y="256" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">limite en continu :</text>
<text x="318" y="277" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">120 V</text>
<rect x="424" y="44" width="196" height="264" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="522" y="72" text-anchor="middle" font-size="15.6" font-weight="800" fill="#d92b2b">ARC ÉLECTRIQUE</text>
<path d="M462 140 H508" stroke="url(#cuivreH)" stroke-width="8"/><path d="M536 140 H582" stroke="url(#cuivreH)" stroke-width="8"/>
<path d="M508 140 l6 -10 l6 14 l6 -16 l6 14 l6 -8" fill="none" stroke="#7fd3ff" stroke-width="3"/><circle cx="522" cy="138" r="16" fill="#7fd3ff" opacity=".35"/>
<text x="522" y="214" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">il ne s'éteint pas</text>
<text x="522" y="235" text-anchor="middle" font-size="13.0" font-weight="800" fill="#1c2530">tout seul</text>
<text x="522" y="256" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">le continu ne passe</text>
<text x="522" y="277" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">jamais par zéro</text>
<rect x="24" y="326" width="592" height="48" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="356.0" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">On ne débranche jamais un connecteur en charge</text>
