<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Trois dangers propres au photovoltaïque : les panneaux sont sous tension dès qu'il fait jour, on ne peut pas les éteindre ; la tension continue d'une chaîne dépasse largement 120 V ; un arc en courant continu ne s'éteint pas tout seul">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le continu : trois dangers à part</text>
<rect x="12" y="30" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="35" width="4" height="26" rx="2" fill="#e85b50"/>
<text x="24" y="51.0" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">TOUJOURS ACTIF</text>
<text x="116" y="45.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">sous tension dès qu'il fait jour</text>
<text x="116" y="57.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">un panneau ne s'éteint pas</text>
<rect x="12" y="72" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="77" width="4" height="26" rx="2" fill="#ff8c2b"/>
<text x="24" y="93.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">TENSION ÉLEVÉE</text>
<text x="116" y="87.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">plusieurs centaines de volts</text>
<text x="116" y="99.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">limite de sécurité en continu : 120 V</text>
<rect x="12" y="114" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="119" width="4" height="26" rx="2" fill="#ffd23f"/>
<text x="24" y="135.0" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">ARC ÉLECTRIQUE</text>
<text x="116" y="129.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">il ne s'éteint pas tout seul</text>
<text x="116" y="141.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">le continu ne passe jamais par zéro</text>
<text x="160" y="172" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">On ne débranche jamais un connecteur en charge</text>
</svg>
