<rect x="138.6" y="120.6" width="12.8" height="11.8" fill="url(#cellule)"/>
<rect x="138.6" y="133.6" width="12.8" height="11.8" fill="url(#cellule)"/>
<rect x="138.6" y="146.6" width="12.8" height="11.8" fill="url(#cellule)"/>
<rect x="138.6" y="159.6" width="12.8" height="11.8" fill="url(#cellule)"/>
<rect x="152.6" y="120.6" width="12.8" height="11.8" fill="url(#cellule)"/>
