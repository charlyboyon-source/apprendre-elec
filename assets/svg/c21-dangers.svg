<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Trois dangers du photovoltaïque : la source est toujours active dès qu'il fait jour ; la tension continue atteint plusieurs centaines de volts, au-delà de la limite de 120 V ; un arc en continu ne s'éteint pas tout seul">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
