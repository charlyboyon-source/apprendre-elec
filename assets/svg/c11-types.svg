<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Au moins deux DDR 30 mA : la cuisson, le lave-linge et la recharge de véhicule sous un type A, ou F, ou B ; les autres circuits, comme l'éclairage et les prises, sous un type AC au minimum">
<defs>
