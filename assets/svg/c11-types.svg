<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Au moins deux interrupteurs différentiels 30 mA : un de type AC pour l'éclairage et les prises, un de type A pour la plaque de cuisson et le lave-linge">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Au moins deux interrupteurs différentiels</text>
<rect x="12" y="28" width="144" height="122" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="9.5" fill="#ffd23f" font-weight="bold">TYPE AC</text>
<text x="84" y="68" text-anchor="middle" font-size="11" fill="#ffd23f" font-weight="bold">30 mA</text>
<text x="84" y="83" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="98" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">éclairage</text>
<text x="84" y="113" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">prises de courant</text>
<text x="84" y="128" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">circuits ordinaires</text>
<rect x="164" y="28" width="144" height="122" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="9.5" fill="#ff8c2b" font-weight="bold">TYPE A</text>
<text x="236" y="68" text-anchor="middle" font-size="11" fill="#ff8c2b" font-weight="bold">30 mA</text>
<text x="236" y="83" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="98" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">plaque de cuisson</text>
<text x="236" y="113" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">lave-linge</text>
<text x="236" y="128" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="normal">électronique de puissance</text>
<text x="160" y="172" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">Minimum : 1 type AC + 1 type A</text>
</svg>
