<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Habilitations courantes : B0 non-électricien, BS intervention élémentaire hors tension, BR intervention générale et dépannage, BC chargé de consignation">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Les habilitations qu'on croise le plus</text>
<rect x="12" y="28" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="33" width="4" height="23" rx="2" fill="#9aa6b3"/>
<text x="24" y="47.5" text-anchor="start" font-size="8.5" fill="#9aa6b3" font-weight="bold">B0</text>
<text x="58" y="42.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">non-électricien</text>
<text x="58" y="54.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">travaux non électriques, sans toucher aux ouvrages</text>
<rect x="12" y="66" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="71" width="4" height="23" rx="2" fill="#4cd97b"/>
<text x="24" y="85.5" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">BS</text>
<text x="58" y="80.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">intervention élémentaire</text>
<text x="58" y="92.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">hors tension, remplacement à l'identique</text>
<rect x="12" y="104" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="109" width="4" height="23" rx="2" fill="#ff8c2b"/>
<text x="24" y="123.5" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">BR</text>
<text x="58" y="118.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">intervention générale</text>
<text x="58" y="130.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">dépannage, recherche de panne, mesures</text>
<rect x="12" y="142" width="296" height="33" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="147" width="4" height="23" rx="2" fill="#ffd23f"/>
<text x="24" y="161.5" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">BC</text>
<text x="58" y="156.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">chargé de consignation</text>
<text x="58" y="168.0" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">met l'installation en sécurité pour les autres</text>
</svg>
