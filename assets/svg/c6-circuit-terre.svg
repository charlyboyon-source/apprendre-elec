<path d="M389 146 V176" fill="none" stroke="#2e9e4f" stroke-width="3" stroke-linejoin="round"/><path d="M389 146 V176" fill="none" stroke="#f2d21a" stroke-width="3" stroke-dasharray="6 6" stroke-linejoin="round"/>
