<text x="446" y="104" text-anchor="start" font-size="13.0" font-weight="800" fill="#1c2530">bornier de terre</text>
<text x="446" y="122" text-anchor="start" font-size="13.0" font-weight="800" fill="#1c2530">du tableau</text>
<text x="446" y="140" text-anchor="start" font-size="12.3" font-weight="500" fill="#5b6673">→ PE des circuits</text>
