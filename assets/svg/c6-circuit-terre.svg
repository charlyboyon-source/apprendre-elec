<text x="446" y="226" text-anchor="start" font-size="13.0" font-weight="800" fill="#1c2530">de terre · barrette</text>
<text x="446" y="244" text-anchor="start" font-size="13.0" font-weight="800" fill="#1c2530">de coupure</text>
