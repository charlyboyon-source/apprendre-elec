<text x="104" y="160" font-size="26" font-weight="800" fill="#d92b2b">?</text>
<text x="114" y="260" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">la lampe ne répond</text>
<text x="114" y="284" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">que dans certaines</text>
<text x="114" y="306" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">positions</text>
<rect x="220" y="44" width="196" height="312" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="318" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#d92b2b">CAUSE</text>
