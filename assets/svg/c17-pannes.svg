<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Le va-et-vient qui ne marche qu'à moitié</text>
<rect x="16" y="44" width="196" height="312" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="114" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#5b6673">SYMPTÔME</text>
<rect x="52" y="88" width="52" height="14" rx="4" fill="#f4f5f7" stroke="#aab1b9"/>
