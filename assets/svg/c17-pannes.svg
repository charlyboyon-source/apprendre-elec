<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Erreurs de câblage du va-et-vient : la phase raccordée sur une navette au lieu du commun, ou le retour lampe raccordé sur une navette ; la lampe ne répond alors que dans certaines positions">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le va-et-vient qui ne marche qu'à moitié</text>
<rect x="12" y="30" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="35" width="4" height="26" rx="2" fill="#e85b50"/>
<text x="24" y="51.0" text-anchor="start" font-size="8.5" fill="#e85b50" font-weight="bold">SYMPTÔME</text>
<text x="100" y="45.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">la lampe ne répond que</text>
<text x="100" y="57.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">dans certaines positions des interrupteurs</text>
<rect x="12" y="72" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="77" width="4" height="26" rx="2" fill="#ff8c2b"/>
<text x="24" y="93.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">CAUSE</text>
<text x="100" y="87.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">un commun et une navette inversés</text>
<text x="100" y="99.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">phase ou retour lampe sur une borne de navette</text>
<rect x="12" y="114" width="296" height="36" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="119" width="4" height="26" rx="2" fill="#4cd97b"/>
<text x="24" y="135.0" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">REMÈDE</text>
<text x="100" y="129.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">repérer le commun de chaque appareil</text>
<text x="100" y="141.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">phase sur l'un, retour lampe sur l'autre</text>
<text x="160" y="172" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">On corrige hors tension, absence de tension vérifiée</text>
</svg>
