<rect x="355" y="140" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="368" cy="153" r="7" fill="url(#vis)"/>
<text x="368" y="130" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">2</text>
<path d="M306 182 l20 20 M326 182 l-20 20" stroke="#d92b2b" stroke-width="4" stroke-linecap="round"/>
<text x="318" y="260" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">un commun et une</text>
<text x="318" y="284" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">navette inversés</text>
<text x="318" y="306" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">phase sur une navette</text>
