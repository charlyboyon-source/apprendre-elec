<text x="522" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#17804c">REMÈDE</text>
<g filter="url(#ombre)"><rect x="442" y="90" width="160" height="86" rx="10" fill="#f4f5f7" stroke="#aab1b9"/></g>
<path d="M472 162 V200" fill="none" stroke="#d92b2b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="459" y="140" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="472" cy="153" r="7" fill="url(#vis)"/>
<text x="472" y="130" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">L</text>
<path d="M522 162 V200" fill="none" stroke="#7b4fc9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="509" y="140" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="522" cy="153" r="7" fill="url(#vis)"/>
<text x="522" y="130" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">1</text>
<path d="M572 162 V200" fill="none" stroke="#7b4fc9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="559" y="140" width="26" height="26" rx="4" fill="#d9b25a" stroke="#8a6416"/><circle cx="572" cy="153" r="7" fill="url(#vis)"/>
<text x="572" y="130" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">2</text>
<path d="M454 194 l8 9 l16 -18" fill="none" stroke="#17804c" stroke-width="4" stroke-linecap="round"/>
<text x="522" y="260" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">repérer le commun</text>
<text x="522" y="284" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">phase sur l'un,</text>
<text x="522" y="306" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">retour lampe sur l'autre</text>
