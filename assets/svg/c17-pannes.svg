<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Panne classique du va-et-vient : la lampe ne répond que dans certaines positions, parce qu'un commun et une navette ont été inversés">
