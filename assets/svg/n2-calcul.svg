<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Trois calculs avec la loi d'Ohm : 230 V divisés par 23 ohms donnent 10 A ; 230 V divisés par 0,5 A donnent 460 ohms ; 6 ohms fois 2 A donnent 12 V">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">La loi d'Ohm en chiffres</text>
<rect x="12" y="34" width="296" height="32" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="39" width="4" height="22" rx="2" fill="#5aa9e6"/>
<text x="24" y="53.0" text-anchor="start" font-size="8.5" fill="#5aa9e6" font-weight="bold">I = U / R</text>
<text x="120" y="53.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">230 V / 23 Ω = 10 A</text>
<rect x="12" y="74" width="296" height="32" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="79" width="4" height="22" rx="2" fill="#ff8c2b"/>
<text x="24" y="93.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">R = U / I</text>
<text x="120" y="93.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">230 V / 0,5 A = 460 Ω</text>
<rect x="12" y="114" width="296" height="32" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="119" width="4" height="22" rx="2" fill="#ffd23f"/>
<text x="24" y="133.0" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">U = R × I</text>
<text x="120" y="133.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">6 Ω × 2 A = 12 V</text>
<text x="160" y="170" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">Toujours en volts, ohms et ampères</text>
</svg>
