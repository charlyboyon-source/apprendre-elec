<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un circuit est une boucle : fermée, le courant circule et la lampe s'allume ; ouverte, rien ne passe">
