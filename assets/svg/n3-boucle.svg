<polyline points="272,90 284,102" fill="none" stroke="#5a626e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="272,102 284,90" fill="none" stroke="#5a626e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="236" y="150" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">rien ne passe</text>
