<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le calibre est le courant que l'appareil laisse passer en permanence, en ampères. Le pouvoir de coupure est le plus fort courant de court-circuit qu'il peut couper : 3 000 A au minimum en domestique, 4 500 A en petit tertiaire">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Calibre et pouvoir de coupure</text>
<g transform="translate(277 44) scale(1.22)" filter="url(#ombre)"><rect width="70" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="70" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="20" y="30"/><use href="#borne" x="50" y="30"/><use href="#borne" x="20" y="210"/><use href="#borne" x="50" y="210"/><rect x="18" y="72" width="34" height="56" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="22" y="72" width="26" height="30" rx="4" fill="url(#manette)"/><text x="35" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2530">C16</text><rect x="14" y="157" width="42" height="17" rx="2" fill="none" stroke="#1c2530" stroke-width="1.5"/><text x="35" y="170.5" text-anchor="middle" font-size="12" font-weight="800" fill="#1c2530">3000</text></g>
<path d="M296 222 H254" fill="none" stroke="#b85a08" stroke-width="2"/><circle cx="296" cy="222" r="4" fill="#b85a08"/>
<path d="M348 247 H398 V182 H410" fill="none" stroke="#d92b2b" stroke-width="2"/><circle cx="348" cy="247" r="4" fill="#d92b2b"/>
<text x="16" y="160" text-anchor="start" font-size="18.2" font-weight="800" fill="#b85a08">LE CALIBRE (In)</text>
<text x="16" y="184" text-anchor="start" font-size="16.9" font-weight="500" fill="#1c2530">le courant admis</text>
<text x="16" y="206" text-anchor="start" font-size="16.9" font-weight="500" fill="#1c2530">en permanence</text>
<text x="16" y="242" text-anchor="start" font-size="18.9" font-weight="800" fill="#1c2530">10 · 16 · 20 · 32 A</text>
<text x="16" y="264" text-anchor="start" font-size="16.2" font-weight="500" fill="#5b6673">en ampères</text>
<text x="418" y="78" text-anchor="start" font-size="17.6" font-weight="800" fill="#d92b2b">POUVOIR DE COUPURE</text>
<text x="418" y="102" text-anchor="start" font-size="16.9" font-weight="500" fill="#1c2530">le plus fort</text>
<text x="418" y="124" text-anchor="start" font-size="16.9" font-weight="500" fill="#1c2530">court-circuit</text>
<text x="418" y="146" text-anchor="start" font-size="16.9" font-weight="500" fill="#1c2530">qu'il sait couper</text>
<text x="418" y="188" text-anchor="start" font-size="22.1" font-weight="800" fill="#1c2530">3 000 A</text>
<text x="418" y="210" text-anchor="start" font-size="16.2" font-weight="500" fill="#5b6673">minimum en domestique</text>
<text x="418" y="250" text-anchor="start" font-size="22.1" font-weight="800" fill="#1c2530">4 500 A</text>
<text x="418" y="272" text-anchor="start" font-size="16.2" font-weight="500" fill="#5b6673">petit tertiaire,</text>
<text x="418" y="293" text-anchor="start" font-size="16.2" font-weight="500" fill="#5b6673">moins de 36 kVA</text>
<text x="320" y="366" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">Le calibre dit quand il coupe ;</text>
<text x="320" y="387" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">le pouvoir de coupure, s'il y survit</text>
</svg>
