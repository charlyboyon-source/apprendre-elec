<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Un conducteur isolé : une âme en cuivre entourée d'un isolant. Un câble : plusieurs conducteurs isolés réunis sous une gaine commune">
