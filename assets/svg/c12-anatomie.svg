<text x="410" y="228" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">la gaine</text>
<text x="476" y="300" text-anchor="middle" font-size="16.9" font-weight="800" fill="#1c2530">plusieurs conducteurs</text>
<text x="476" y="324" text-anchor="middle" font-size="16.2" font-weight="500" fill="#1c2530">sous une gaine commune</text>
