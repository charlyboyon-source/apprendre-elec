<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Quatre types de DDR : AC détecte l'alternatif sinusoïdal, A ajoute le continu pulsé, F ajoute les fréquences mélangées, B ajoute le continu lisse">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Quatre types, du plus simple au plus complet</text>
<polygon points="30,110 54,121 54,141 30,130" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="30,110 54,121 54,141 30,130" fill="#9aa6b3" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="54,121 82,110 82,130 54,141" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="54,121 82,110 82,130 54,141" fill="#9aa6b3" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="30,110 58,99 82,110 54,121" fill="#9aa6b3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="56" y="93" text-anchor="middle" font-size="12" fill="#9aa6b3" font-weight="bold">AC</text>
<text x="56" y="158" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">alternatif</text>
<text x="56" y="168" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">sinusoïdal</text>
<polygon points="102,94 126,105 126,141 102,130" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="102,94 126,105 126,141 102,130" fill="#ffd23f" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="126,105 154,94 154,130 126,141" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="126,105 154,94 154,130 126,141" fill="#ffd23f" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="102,94 130,83 154,94 126,105" fill="#ffd23f" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="128" y="77" text-anchor="middle" font-size="12" fill="#ffd23f" font-weight="bold">A</text>
<text x="128" y="158" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">+ continu</text>
<text x="128" y="168" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">pulsé</text>
<polygon points="174,78 198,89 198,141 174,130" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="174,78 198,89 198,141 174,130" fill="#ff8c2b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="198,89 226,78 226,130 198,141" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="198,89 226,78 226,130 198,141" fill="#ff8c2b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="174,78 202,67 226,78 198,89" fill="#ff8c2b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="200" y="61" text-anchor="middle" font-size="12" fill="#ff8c2b" font-weight="bold">F</text>
<text x="200" y="158" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">+ fréquences</text>
<text x="200" y="168" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">mélangées</text>
<polygon points="246,62 270,73 270,141 246,130" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="246,62 270,73 270,141 246,130" fill="#4cd97b" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="270,73 298,62 298,130 270,141" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="270,73 298,62 298,130 270,141" fill="#4cd97b" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="246,62 274,51 298,62 270,73" fill="#4cd97b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="272" y="45" text-anchor="middle" font-size="12" fill="#4cd97b" font-weight="bold">B</text>
<text x="272" y="158" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">+ continu</text>
<text x="272" y="168" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">lisse</text>
<text x="160" y="190" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Chaque type détecte aussi ce que voit le précédent</text>
</svg>
