<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Méthode aval : on additionne les calibres des disjoncteurs placés derrière l'interrupteur différentiel et on divise par deux ; le chauffage, le chauffe-eau et la recharge de véhicule comptent en entier. Exemple : 10 + 16 + 20 + 20 = 66, divisé par 2 = 33 A, donc un interrupteur différentiel de 40 A">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">Méthode aval : la somme divisée par 2</text>
<g transform="translate(26 46) scale(0.4)" filter="url(#ombre)"><rect width="70" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="70" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="20" y="30"/><use href="#borne" x="50" y="30"/><use href="#borne" x="20" y="210"/><use href="#borne" x="50" y="210"/><rect x="18" y="72" width="34" height="56" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="22" y="72" width="26" height="30" rx="4" fill="url(#manette)"/><text x="35" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2530">C10</text><text x="35" y="169" text-anchor="middle" font-size="9" font-weight="500" fill="#5b6673">230 V~</text></g>
<text x="65" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2530">+</text>
<g transform="translate(76 46) scale(0.4)" filter="url(#ombre)"><rect width="70" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="70" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="20" y="30"/><use href="#borne" x="50" y="30"/><use href="#borne" x="20" y="210"/><use href="#borne" x="50" y="210"/><rect x="18" y="72" width="34" height="56" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="22" y="72" width="26" height="30" rx="4" fill="url(#manette)"/><text x="35" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2530">C16</text><text x="35" y="169" text-anchor="middle" font-size="9" font-weight="500" fill="#5b6673">230 V~</text></g>
<text x="115" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2530">+</text>
<g transform="translate(126 46) scale(0.4)" filter="url(#ombre)"><rect width="70" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="70" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="20" y="30"/><use href="#borne" x="50" y="30"/><use href="#borne" x="20" y="210"/><use href="#borne" x="50" y="210"/><rect x="18" y="72" width="34" height="56" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="22" y="72" width="26" height="30" rx="4" fill="url(#manette)"/><text x="35" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2530">C20</text><text x="35" y="169" text-anchor="middle" font-size="9" font-weight="500" fill="#5b6673">230 V~</text></g>
<text x="165" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2530">+</text>
<g transform="translate(176 46) scale(0.4)" filter="url(#ombre)"><rect width="70" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="70" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="20" y="30"/><use href="#borne" x="50" y="30"/><use href="#borne" x="20" y="210"/><use href="#borne" x="50" y="210"/><rect x="18" y="72" width="34" height="56" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="22" y="72" width="26" height="30" rx="4" fill="url(#manette)"/><text x="35" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2530">C20</text><text x="35" y="169" text-anchor="middle" font-size="9" font-weight="500" fill="#5b6673">230 V~</text></g>
<text x="240" y="66" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">1 · ADDITIONNER</text>
<text x="240" y="94" text-anchor="start" font-size="19.5" font-weight="800" fill="#1c2530">10 + 16 + 20 + 20 = 66 A</text>
<text x="240" y="118" text-anchor="start" font-size="15.0" font-weight="500" fill="#5b6673">les calibres des disjoncteurs en aval</text>
<path d="M20 152 H620" stroke="#e3dccf" stroke-width="2"/><path d="M20 246 H620" stroke="#e3dccf" stroke-width="2"/>
<circle cx="112" cy="199" r="34" fill="#fff1c2" stroke="#ffc21a" stroke-width="2"/><text x="112" y="210" text-anchor="middle" font-size="30" font-weight="800" fill="#1c2530">÷ 2</text>
<text x="240" y="178" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">2 · DIVISER PAR 2</text>
<text x="240" y="206" text-anchor="start" font-size="19.5" font-weight="800" fill="#1c2530">66 / 2 = 33 A</text>
<text x="240" y="230" text-anchor="start" font-size="15.0" font-weight="500" fill="#5b6673">tout ne fonctionne pas en même temps</text>
<g transform="translate(84 254) scale(0.37)" filter="url(#ombre)"><rect width="140" height="240" rx="6" fill="url(#corps)" stroke="#b3b9c0"/><rect y="60" width="140" height="120" fill="url(#nez)" stroke="#c5cad0"/><use href="#borne" x="35" y="30"/><use href="#borne" x="105" y="30"/><use href="#borne" x="35" y="210"/><use href="#borne" x="105" y="210"/><rect x="20" y="72" width="34" height="62" rx="4" fill="#d5d9de" stroke="#b3b9c0"/><rect x="24" y="72" width="26" height="34" rx="4" fill="url(#manette)"/><rect x="76" y="72" width="46" height="24" rx="4" fill="#f2a20c" stroke="#b97a05"/><text x="99" y="89" text-anchor="middle" font-size="13" font-weight="800" fill="#3a2a00">TEST</text><text x="99" y="120" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2530">40 A</text><text x="99" y="141" text-anchor="middle" font-size="16" font-weight="800" fill="#2166d1">30 mA</text><g transform="translate(0 -84)"><rect x="18" y="222" width="38" height="24" rx="3" fill="none" stroke="#1c2530" stroke-width="1.4"/><path d="M24 232 q4 -10 8 0 t8 0" fill="none" stroke="#1c2530" stroke-width="1.4"/></g><text x="99" y="166" text-anchor="middle" font-size="14" font-weight="800" fill="#1c2530">type AC</text></g>
<text x="240" y="272" text-anchor="start" font-size="16.9" font-weight="800" fill="#b85a08">3 · CHOISIR</text>
<text x="240" y="300" text-anchor="start" font-size="18.9" font-weight="800" fill="#1c2530">interrupteur différentiel 40 A</text>
<text x="240" y="324" text-anchor="start" font-size="15.0" font-weight="500" fill="#5b6673">le calibre courant juste au-dessus</text>
<rect x="30" y="346" width="580" height="48" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="366" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">Chauffage, chauffe-eau, recharge de véhicule :</text>
<text x="320" y="386" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">leur calibre compte EN ENTIER, sans diviser</text>
</svg>
