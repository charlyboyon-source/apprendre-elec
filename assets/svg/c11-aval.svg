<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Méthode aval : on additionne les calibres des disjoncteurs placés derrière l'interrupteur différentiel et on divise par deux ; le chauffage, le chauffe-eau et la recharge de véhicule comptent en entier. Exemple : 10 + 16 + 20 + 20 = 66, divisé par 2 = 33 A, donc un interrupteur différentiel de 40 A">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Méthode aval : la somme divisée par 2</text>
<rect x="12" y="28" width="296" height="34" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="33" width="4" height="24" rx="2" fill="#9aa6b3"/>
<text x="24" y="48.0" text-anchor="start" font-size="8.5" fill="#9aa6b3" font-weight="bold">1 · ADDITIONNER</text>
<text x="128" y="42.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">10 + 16 + 20 + 20 = 66 A</text>
<text x="128" y="54.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">les calibres des disjoncteurs en aval</text>
<rect x="12" y="68" width="296" height="34" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="73" width="4" height="24" rx="2" fill="#ff8c2b"/>
<text x="24" y="88.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">2 · DIVISER PAR 2</text>
<text x="128" y="82.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">66 / 2 = 33 A</text>
<text x="128" y="94.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">tout ne fonctionne pas en même temps</text>
<rect x="12" y="108" width="296" height="34" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="113" width="4" height="24" rx="2" fill="#4cd97b"/>
<text x="24" y="128.0" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">3 · CHOISIR</text>
<text x="128" y="122.5" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">interrupteur différentiel 40 A</text>
<text x="128" y="134.5" text-anchor="start" font-size="7.8" fill="#9aa6b3" font-weight="normal">le calibre courant juste au-dessus</text>
<rect x="12" y="150" width="296" height="34" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="160" y="164" text-anchor="middle" font-size="8" fill="#e85b50" font-weight="bold">Chauffage, chauffe-eau, recharge de véhicule :</text>
<text x="160" y="177" text-anchor="middle" font-size="8" fill="#e8eaed" font-weight="bold">leur calibre compte EN ENTIER, sans diviser</text>
</svg>
