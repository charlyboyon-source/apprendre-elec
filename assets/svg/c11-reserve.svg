<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Dans le tableau : 20 % de réserve, dont 6 modules libres consécutifs, et 2 prises de courant modulaires">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Prévoir la suite : la réserve</text>
<rect x="30" y="44" width="208" height="28" rx="4" fill="#9aa6b3" fill-opacity="0.25" stroke="#9aa6b3" stroke-width="1.4"/><rect x="238" y="44" width="52" height="28" rx="4" fill="#4cd97b" fill-opacity="0.25" stroke="#4cd97b" stroke-width="1.6"/>
<text x="134" y="62" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">modules occupés</text>
<text x="264" y="62" text-anchor="middle" font-size="10" fill="#4cd97b" font-weight="bold">20 %</text>
<rect x="12" y="92" width="90" height="48" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="57" y="107" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">20 %</text>
<text x="57" y="120" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">de réserve</text>
<text x="57" y="130" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">au minimum</text>
<polyline points="105,116.0 110,116.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,116.0 108,112.0 108,120.0" fill="#9aa6b3"/>
<rect x="115" y="92" width="90" height="48" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="160" y="107" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">6 MODULES</text>
<text x="160" y="120" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">libres</text>
<text x="160" y="130" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">consécutifs</text>
<polyline points="208,116.0 213,116.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,116.0 211,112.0 211,120.0" fill="#9aa6b3"/>
<rect x="218" y="92" width="90" height="48" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="263" y="107" text-anchor="middle" font-size="8.5" fill="#ff8c2b" font-weight="bold">2 PRISES</text>
<text x="263" y="120" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">de courant</text>
<text x="263" y="130" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">modulaires</text>
<text x="160" y="166" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Un tableau plein dès le premier jour est un tableau mal conçu</text>
</svg>
