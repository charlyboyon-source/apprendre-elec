<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Régime TT : le neutre du transformateur est relié à la terre côté distributeur, les masses du logement sont reliées à une prise de terre distincte, les deux n'étant reliées que par le sol">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Régime TT : deux prises de terre distinctes</text>
<polyline points="80,70 240,70" fill="none" stroke="#e85b50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="80,82 240,82" fill="none" stroke="#5aa9e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="65" text-anchor="middle" font-size="7.5" fill="#e85b50" font-weight="normal">phase</text>
<text x="160" y="93" text-anchor="middle" font-size="7.5" fill="#5aa9e6" font-weight="normal">neutre</text>
<text x="54" y="44" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">transformateur</text>
<polygon points="28,62 52,73 52,103 28,92" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="28,62 52,73 52,103 28,92" fill="#ffd23f" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="52,73 80,62 80,92 52,103" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="52,73 80,62 80,92 52,103" fill="#ffd23f" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="28,62 56,51 80,62 52,73" fill="#ffd23f" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<text x="266" y="44" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">logement</text>
<polygon points="240,62 264,73 264,103 240,92" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="240,62 264,73 264,103 240,92" fill="#5a626e" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="264,73 292,62 292,92 264,103" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="264,73 292,62 292,92 264,103" fill="#5a626e" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="240,62 268,51 292,62 264,73" fill="#5a626e" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
<polyline points="52,103 52,140" fill="none" stroke="#5aa9e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="42,142.0 62,142.0" fill="none" stroke="#5aa9e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="45.5,146.5 58.5,146.5" fill="none" stroke="#5aa9e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="49,151.0 55,151.0" fill="none" stroke="#5aa9e6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="264,103 264,140" fill="none" stroke="#4cd97b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="264,103 264,140" fill="none" stroke="#ffd23f" stroke-width="3" stroke-dasharray="4 5" stroke-linejoin="round"/>
<polyline points="254,142.0 274,142.0" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="257.5,146.5 270.5,146.5" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="261,151.0 267,151.0" fill="none" stroke="#4cd97b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="120" text-anchor="start" font-size="11" fill="#ffd23f" font-weight="bold">1er T</text>
<text x="66" y="131" text-anchor="start" font-size="7.5" fill="#e8eaed" font-weight="normal">neutre à la terre</text>
<text x="250" y="120" text-anchor="end" font-size="11" fill="#ffd23f" font-weight="bold">2e T</text>
<text x="250" y="131" text-anchor="end" font-size="7.5" fill="#e8eaed" font-weight="normal">masses à la terre</text>
<polyline points="72,150 244,150" fill="none" stroke="#9aa6b3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<text x="160" y="146" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">le sol</text>
<text x="52" y="170" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">côté distributeur</text>
<text x="264" y="170" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">chez l'usager</text>
<text x="160" y="188" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="normal">Les deux terres ne sont reliées que par le sol</text>
</svg>
