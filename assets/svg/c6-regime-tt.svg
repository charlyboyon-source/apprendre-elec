<text x="86" y="392" text-anchor="middle" font-size="16.9" font-weight="800" fill="#2166d1">1er T</text>
<text x="86" y="412" text-anchor="middle" font-size="13.0" font-weight="500" fill="#5b6673">neutre à la terre</text>
