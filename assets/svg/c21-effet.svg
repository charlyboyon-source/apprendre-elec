<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'effet photovoltaïque : le soleil éclaire une cellule en silicium, qui produit directement un courant continu, avec un plus et un moins">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<linearGradient id="icta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949c"/><stop offset=".3" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6b727a"/></linearGradient>
<linearGradient id="tpc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b02020"/><stop offset=".3" stop-color="#ff6b5e"/><stop offset="1" stop-color="#8e1414"/></linearGradient>
<linearGradient id="irl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1b9"/><stop offset=".3" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8d949c"/></linearGradient>
<linearGradient id="terre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a877"/><stop offset="1" stop-color="#a98557"/></linearGradient>
<pattern id="vj" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2e9e4f"/><rect width="7" height="16" fill="#f2d21a"/></pattern>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
<linearGradient id="cellule" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4a8a"/><stop offset="1" stop-color="#16285a"/></linearGradient>
<linearGradient id="cuve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset=".55" stop-color="#ffb3a0"/><stop offset="1" stop-color="#7fb8f0"/></linearGradient>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">De la lumière au courant</text>
<rect x="16" y="44" width="196" height="230" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="114" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#b85a08">LUMIÈRE</text>
<path d="M150.0 140.0 L159.0 140.0" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M145.2 158.0 L153.0 162.5" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M132.0 171.2 L136.5 179.0" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M114.0 176.0 L114.0 185.0" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M96.0 171.2 L91.5 179.0" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M82.8 158.0 L75.0 162.5" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M78.0 140.0 L69.0 140.0" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M82.8 122.0 L75.0 117.5" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M96.0 108.8 L91.5 101.0" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M114.0 104.0 L114.0 95.0" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M132.0 108.8 L136.5 101.0" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/><path d="M145.2 122.0 L153.0 117.5" stroke="#f2a20c" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="114" cy="140" r="30" fill="#ffd23f" stroke="#f2a20c" stroke-width="2"/>
<text x="114" y="226" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">le soleil éclaire</text>
<text x="114" y="248" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">la cellule</text>
<rect x="220" y="44" width="196" height="230" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="318" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#b85a08">CELLULE</text>
<rect x="268" y="96" width="100" height="100" rx="4" fill="url(#cellule)" stroke="#16285a"/>
<path d="M268 106 H368" stroke="#c3c8ce" stroke-width="1.2"/>
<path d="M268 126 H368" stroke="#c3c8ce" stroke-width="1.2"/>
<path d="M268 146 H368" stroke="#c3c8ce" stroke-width="1.2"/>
<path d="M268 166 H368" stroke="#c3c8ce" stroke-width="1.2"/>
<path d="M268 186 H368" stroke="#c3c8ce" stroke-width="1.2"/>
<path d="M300 96 V196 M336 96 V196" stroke="#e4e7ea" stroke-width="3"/>
<text x="318" y="226" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">en silicium :</text>
<text x="318" y="248" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">effet photovoltaïque</text>
<rect x="424" y="44" width="196" height="230" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="522" y="72" text-anchor="middle" font-size="16.9" font-weight="800" fill="#b85a08">COURANT</text>
<path d="M462 126 H582" stroke="#d92b2b" stroke-width="6"/><path d="M462 166 H582" stroke="#1c2530" stroke-width="6"/>
<text x="448" y="132" text-anchor="middle" font-size="20.8" font-weight="800" fill="#d92b2b">+</text>
<text x="448" y="172" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">−</text>
<text x="522" y="226" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">continu</text>
<text x="522" y="248" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">un + et un −</text>
<path d="M208 140 H224" stroke="#b85a08" stroke-width="4"/><polygon points="222,132 234,140 222,148" fill="#b85a08"/>
<path d="M412 140 H428" stroke="#b85a08" stroke-width="4"/><polygon points="426,132 438,140 426,148" fill="#b85a08"/>
<text x="320" y="302" text-anchor="middle" font-size="13.7" font-weight="500" fill="#5b6673">Pas de pièce en mouvement, pas de bruit, pas de combustible</text>
<rect x="24" y="318" width="592" height="40" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="344.0" text-anchor="middle" font-size="15.6" font-weight="800" fill="#1c2530">Du courant CONTINU, comme une pile</text>
<text x="320" y="390" text-anchor="middle" font-size="14.3" font-weight="800" fill="#d92b2b">Dès qu'il y a de la lumière, il y a de la tension</text>
</svg>
