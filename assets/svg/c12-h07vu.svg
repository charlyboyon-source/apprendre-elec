<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Lire H07V-U : H pour harmonisé, 07 pour une tension de 450/750 V, V pour un isolant en PVC, U pour une âme rigide massive">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Lire une désignation : H07V-U</text>
<text x="46.0" y="62" text-anchor="middle" font-size="26" fill="#ffd23f" font-weight="bold">H</text>
<rect x="12.0" y="82" width="68.0" height="58" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="46.0" y="98" text-anchor="middle" font-size="8" fill="#ffd23f" font-weight="bold">NORME</text>
<text x="46.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">harmonisée</text>
<text x="46.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">européenne</text>
<text x="122.0" y="62" text-anchor="middle" font-size="26" fill="#ff8c2b" font-weight="bold">07</text>
<rect x="88.0" y="82" width="68.0" height="58" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="122.0" y="98" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">TENSION</text>
<text x="122.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">450 / 750 V</text>
<text x="122.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal"></text>
<text x="198.0" y="62" text-anchor="middle" font-size="26" fill="#5aa9e6" font-weight="bold">V</text>
<rect x="164.0" y="82" width="68.0" height="58" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="198.0" y="98" text-anchor="middle" font-size="8" fill="#5aa9e6" font-weight="bold">ISOLANT</text>
<text x="198.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">PVC</text>
<text x="198.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal"></text>
<text x="274.0" y="62" text-anchor="middle" font-size="26" fill="#4cd97b" font-weight="bold">U</text>
<rect x="240.0" y="82" width="68.0" height="58" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="274.0" y="98" text-anchor="middle" font-size="8" fill="#4cd97b" font-weight="bold">ÂME</text>
<text x="274.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">rigide</text>
<text x="274.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">massive</text>
<text x="160" y="160" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Le fil rigide des tableaux et des conduits</text>
</svg>
