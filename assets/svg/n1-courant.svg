<path d="M110 248 V300 M110 134 V80" stroke="#1c2530" stroke-width="4"/><path d="M500 194 V300" stroke="#1c2530" stroke-width="4"/>
<path d="M200 80 L292.0 80.0" stroke="#d92b2b" stroke-width="4"/><polygon points="300.0,80.0 288.0,74.0 288.0,86.0" fill="#d92b2b"/>
<path d="M300 300 L208.0 300.0" stroke="#d92b2b" stroke-width="4"/><polygon points="200.0,300.0 212.0,306.0 212.0,294.0" fill="#d92b2b"/>
<path d="M300 96 L208.0 96.0" stroke="#2166d1" stroke-width="3"/><polygon points="200.0,96.0 212.0,102.0 212.0,90.0" fill="#2166d1"/>
<path d="M200 284 L292.0 284.0" stroke="#2166d1" stroke-width="3"/><polygon points="300.0,284.0 288.0,278.0 288.0,290.0" fill="#2166d1"/>
<text x="320" y="124" text-anchor="middle" font-size="15.0" font-weight="800" fill="#d92b2b">sens conventionnel : du + vers le −</text>
<text x="320" y="260" text-anchor="middle" font-size="15.0" font-weight="800" fill="#2166d1">les électrons vont en sens inverse</text>
<rect x="24" y="328" width="592" height="52" rx="12" fill="#fff1c2" stroke="#ffc21a"/>
<text x="320" y="349.5" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">Ils avancent lentement,</text>
<text x="320" y="370.5" text-anchor="middle" font-size="15.0" font-weight="800" fill="#1c2530">mais l'effet est immédiat</text>
</svg>
