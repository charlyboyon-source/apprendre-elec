<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Le sens conventionnel du courant va du plus vers le moins ; les électrons circulent en sens inverse, du moins vers le plus">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le courant : deux sens à ne pas confondre</text>
<rect x="56" y="76" width="208" height="26" rx="13" fill="#24282f" stroke="#ff8c2b" stroke-width="2"/>
<circle cx="34" cy="89" r="13" fill="#e85b50"/><circle cx="286" cy="89" r="13" fill="#5aa9e6"/>
<text x="34" y="94" text-anchor="middle" font-size="15" fill="#1c1f24" font-weight="bold">+</text>
<text x="286" y="94" text-anchor="middle" font-size="15" fill="#1c1f24" font-weight="bold">−</text>
<circle cx="92" cy="89" r="4" fill="#5aa9e6"/>
<polygon points="77,89 85,85 85,93" fill="#5aa9e6"/>
<circle cx="134" cy="89" r="4" fill="#5aa9e6"/>
<polygon points="119,89 127,85 127,93" fill="#5aa9e6"/>
<circle cx="176" cy="89" r="4" fill="#5aa9e6"/>
<polygon points="161,89 169,85 169,93" fill="#5aa9e6"/>
<circle cx="218" cy="89" r="4" fill="#5aa9e6"/>
<polygon points="203,89 211,85 211,93" fill="#5aa9e6"/>
<polyline points="70,58 244,58" fill="none" stroke="#ffd23f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="253,58 245,54 245,62" fill="#ffd23f"/>
<text x="160" y="48" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">sens conventionnel : du + vers le −</text>
<polyline points="250,122 76,122" fill="none" stroke="#5aa9e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="67,122 75,118 75,126" fill="#5aa9e6"/>
<text x="160" y="138" text-anchor="middle" font-size="8.5" fill="#5aa9e6" font-weight="bold">les électrons vont en sens inverse</text>
<text x="160" y="168" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">Ils avancent lentement, mais l'effet est immédiat</text>
</svg>
