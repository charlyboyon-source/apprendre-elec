<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Dimensions de l'ETEL : 60 cm de large, 25 cm de profondeur, du sol au plafond. Distances à respecter : 10 cm d'une canalisation de gaz, 40 cm d'une source de chaleur, 60 cm d'un point d'eau">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">L'ETEL : ses dimensions, ses distances</text>
<rect x="12" y="30" width="90" height="60" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="57" y="54" text-anchor="middle" font-size="15" fill="#ffd23f" font-weight="bold">60 cm</text>
<text x="57" y="71" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">de large</text>
<text x="57" y="83" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">au minimum</text>
<rect x="115" y="30" width="90" height="60" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="160" y="54" text-anchor="middle" font-size="15" fill="#ffd23f" font-weight="bold">25 cm</text>
<text x="160" y="71" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">de profondeur</text>
<text x="160" y="83" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">au minimum</text>
<rect x="218" y="30" width="90" height="60" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="263" y="54" text-anchor="middle" font-size="15" fill="#ffd23f" font-weight="bold">toute</text>
<text x="263" y="71" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">la hauteur</text>
<text x="263" y="83" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">du sol au plafond</text>
<rect x="12" y="100" width="296" height="22" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="160" y="115" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">Et il se tient à distance de :</text>
<rect x="12" y="126" width="90" height="58" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="57" y="150" text-anchor="middle" font-size="15" fill="#e85b50" font-weight="bold">10 cm</text>
<text x="57" y="167" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">d'une canalisation</text>
<text x="57" y="179" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">de gaz</text>
<rect x="115" y="126" width="90" height="58" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="160" y="150" text-anchor="middle" font-size="15" fill="#ff8c2b" font-weight="bold">40 cm</text>
<text x="160" y="167" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">d'une source</text>
<text x="160" y="179" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">de chaleur</text>
<rect x="218" y="126" width="90" height="58" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="263" y="150" text-anchor="middle" font-size="15" fill="#5aa9e6" font-weight="bold">60 cm</text>
<text x="263" y="167" text-anchor="middle" font-size="7.8" fill="#e8eaed" font-weight="bold">d'un point</text>
<text x="263" y="179" text-anchor="middle" font-size="7.3" fill="#9aa6b3" font-weight="normal">d'eau</text>
</svg>
