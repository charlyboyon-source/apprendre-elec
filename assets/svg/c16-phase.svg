<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'interrupteur coupe toujours la phase : interrupteur ouvert, la douille n'est plus sous tension et on peut changer l'ampoule sans risque">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">L'interrupteur coupe la phase, jamais le neutre</text>
<rect x="12" y="28" width="144" height="140" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="84" y="46" text-anchor="middle" font-size="9.5" fill="#4cd97b" font-weight="bold">SUR LA PHASE</text>
<text x="84" y="68" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">interrupteur ouvert :</text>
<text x="84" y="83" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="98" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">la douille est</text>
<text x="84" y="113" text-anchor="middle" font-size="10" fill="#4cd97b" font-weight="bold">HORS TENSION</text>
<text x="84" y="128" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="84" y="143" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">on change l'ampoule</text>
<text x="84" y="158" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">sans risque</text>
<rect x="164" y="28" width="144" height="140" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="236" y="46" text-anchor="middle" font-size="9.5" fill="#e85b50" font-weight="bold">SUR LE NEUTRE</text>
<text x="236" y="68" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">interrupteur ouvert :</text>
<text x="236" y="83" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="98" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="normal">la lampe est éteinte</text>
<text x="236" y="113" text-anchor="middle" font-size="9.5" fill="#e85b50" font-weight="bold">MAIS SOUS TENSION</text>
<text x="236" y="128" text-anchor="middle" font-size="6" fill="#e8eaed" font-weight="normal"></text>
<text x="236" y="143" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">la phase arrive toujours</text>
<text x="236" y="158" text-anchor="middle" font-size="8" fill="#9aa6b3" font-weight="normal">à la douille</text>
</svg>
