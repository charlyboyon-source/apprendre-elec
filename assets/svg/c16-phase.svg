<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Interrupteur sur la phase : ouvert, la douille est hors tension. Interrupteur sur le neutre : la lampe est éteinte mais la douille reste sous tension">
<defs>
<linearGradient id="corps" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eef0f2"/><stop offset=".5" stop-color="#fdfdfd"/><stop offset="1" stop-color="#dfe2e6"/></linearGradient>
<linearGradient id="nez" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
<linearGradient id="manette" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5058"/><stop offset="1" stop-color="#23272c"/></linearGradient>
<radialGradient id="vis" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f2f4"/><stop offset="1" stop-color="#8d949c"/></radialGradient>
<linearGradient id="cuivreH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b77a"/><stop offset=".5" stop-color="#c9782f"/><stop offset="1" stop-color="#8f4f17"/></linearGradient>
<linearGradient id="cuivreV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f4f17"/><stop offset=".45" stop-color="#f0b77a"/><stop offset="1" stop-color="#9a5a1f"/></linearGradient>
<linearGradient id="acierH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#aab1b9"/><stop offset="1" stop-color="#7d858e"/></linearGradient>
<linearGradient id="cylH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde1"/><stop offset=".35" stop-color="#ffffff"/><stop offset="1" stop-color="#c3c8ce"/></linearGradient>
<linearGradient id="gaineV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81d1d"/><stop offset=".4" stop-color="#ef4a4a"/><stop offset="1" stop-color="#b02020"/></linearGradient>
<linearGradient id="chaud" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f46"/><stop offset=".5" stop-color="#e8590c"/><stop offset="1" stop-color="#ff3b1f"/></linearGradient>
<linearGradient id="icta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949c"/><stop offset=".3" stop-color="#dfe3e7"/><stop offset="1" stop-color="#6b727a"/></linearGradient>
<linearGradient id="tpc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b02020"/><stop offset=".3" stop-color="#ff6b5e"/><stop offset="1" stop-color="#8e1414"/></linearGradient>
<linearGradient id="irl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab1b9"/><stop offset=".3" stop-color="#f1f3f5"/><stop offset="1" stop-color="#8d949c"/></linearGradient>
<linearGradient id="terre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a877"/><stop offset="1" stop-color="#a98557"/></linearGradient>
<pattern id="vj" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="16" height="16" fill="#2e9e4f"/><rect width="7" height="16" fill="#f2d21a"/></pattern>
<filter id="ombre" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".25"/></filter>
<g id="borne"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#2b3036"/><circle r="8" fill="url(#vis)"/><rect x="-6" y="-1.2" width="12" height="2.4" rx="1" fill="#5a616a" transform="rotate(-25)"/></g>
</defs>
<text x="320.0" y="26" text-anchor="middle" font-size="20.8" font-weight="800" fill="#1c2530">L'interrupteur coupe la phase, jamais le neutre</text>
<rect x="16" y="44" width="296" height="346" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="164" y="72" text-anchor="middle" font-size="18.2" font-weight="800" fill="#17804c">SUR LA PHASE</text>
<path d="M36 128 H76" fill="none" stroke="#d92b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(76 128) rotate(-90)"><path d="M0 0 V20 M0 40 V60" stroke="#1c2530" stroke-width="2.6"/><path d="M0 20 L14 40" stroke="#1c2530" stroke-width="2.6" stroke-linecap="round"/><path d="M-5 40 H5" stroke="#1c2530" stroke-width="2.6"/></g>
<path d="M136 128 H162" fill="none" stroke="#f28c28" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="162" y="114" width="24" height="22" rx="3" fill="#d9b25a" stroke="#8a6416"/><circle cx="174" cy="150" r="14" fill="#f4f5f7" stroke="#aab1b9" stroke-width="2"/>
<path d="M186 128 H292" fill="none" stroke="#2166d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="36" y="114" text-anchor="start" font-size="13.7" font-weight="800" fill="#d92b2b">phase</text>
<text x="292" y="114" text-anchor="end" font-size="13.7" font-weight="800" fill="#2166d1">neutre</text>
<text x="164" y="214" text-anchor="middle" font-size="15.0" font-weight="500" fill="#1c2530">interrupteur ouvert :</text>
<text x="164" y="238" text-anchor="middle" font-size="15.0" font-weight="500" fill="#1c2530">la douille est</text>
<text x="164" y="268" text-anchor="middle" font-size="18.2" font-weight="800" fill="#17804c">HORS TENSION</text>
<text x="164" y="308" text-anchor="middle" font-size="14.3" font-weight="500" fill="#5b6673">on change l'ampoule</text>
<text x="164" y="330" text-anchor="middle" font-size="14.3" font-weight="500" fill="#5b6673">sans risque</text>
<rect x="328" y="44" width="296" height="346" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="476" y="72" text-anchor="middle" font-size="18.2" font-weight="800" fill="#d92b2b">SUR LE NEUTRE</text>
<path d="M348 128 H474" fill="none" stroke="#d92b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="486" cy="138" r="30" fill="#ff5c5c" opacity=".22"/>
<rect x="474" y="114" width="24" height="22" rx="3" fill="#d9b25a" stroke="#8a6416"/><circle cx="486" cy="150" r="14" fill="#f4f5f7" stroke="#aab1b9" stroke-width="2"/>
<path d="M498 128 H524" fill="none" stroke="#2166d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(524 128) rotate(-90)"><path d="M0 0 V20 M0 40 V60" stroke="#1c2530" stroke-width="2.6"/><path d="M0 20 L14 40" stroke="#1c2530" stroke-width="2.6" stroke-linecap="round"/><path d="M-5 40 H5" stroke="#1c2530" stroke-width="2.6"/></g>
<path d="M584 128 H604" fill="none" stroke="#2166d1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="348" y="114" text-anchor="start" font-size="13.7" font-weight="800" fill="#d92b2b">phase</text>
<text x="604" y="114" text-anchor="end" font-size="13.7" font-weight="800" fill="#2166d1">neutre</text>
<text x="476" y="214" text-anchor="middle" font-size="15.0" font-weight="500" fill="#1c2530">interrupteur ouvert :</text>
<text x="476" y="238" text-anchor="middle" font-size="15.0" font-weight="500" fill="#1c2530">la lampe est éteinte</text>
<text x="476" y="268" text-anchor="middle" font-size="18.2" font-weight="800" fill="#d92b2b">MAIS SOUS TENSION</text>
<text x="476" y="308" text-anchor="middle" font-size="14.3" font-weight="500" fill="#5b6673">la phase arrive toujours</text>
<text x="476" y="330" text-anchor="middle" font-size="14.3" font-weight="500" fill="#5b6673">à la douille</text>
</svg>
