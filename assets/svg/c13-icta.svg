<text x="92" y="176" text-anchor="middle" font-size="46" font-weight="800" fill="#1c2530">I</text>
<text x="92" y="214" text-anchor="middle" font-size="16.2" font-weight="800" fill="#b85a08">ISOLANT</text>
<text x="92" y="248" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">en matière</text>
<text x="92" y="270" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">plastique</text>
<rect x="174" y="118" width="140" height="206" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="244" y="176" text-anchor="middle" font-size="46" font-weight="800" fill="#1c2530">C</text>
<text x="244" y="214" text-anchor="middle" font-size="16.2" font-weight="800" fill="#b85a08">CINTRABLE</text>
<text x="244" y="248" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">se courbe</text>
<text x="244" y="270" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">à la main</text>
<rect x="326" y="118" width="140" height="206" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="396" y="176" text-anchor="middle" font-size="46" font-weight="800" fill="#1c2530">T</text>
<text x="396" y="214" text-anchor="middle" font-size="16.2" font-weight="800" fill="#b85a08">TRANSV.</text>
<text x="396" y="248" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">reprend sa forme</text>
<text x="396" y="270" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">après écrasement</text>
<rect x="478" y="118" width="140" height="206" rx="14" fill="#f6f2ea" stroke="#e3dccf"/>
<text x="548" y="176" text-anchor="middle" font-size="46" font-weight="800" fill="#1c2530">A</text>
<text x="548" y="214" text-anchor="middle" font-size="16.2" font-weight="800" fill="#b85a08">ANNELÉ</text>
<text x="548" y="248" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">paroi</text>
<text x="548" y="270" text-anchor="middle" font-size="13.7" font-weight="500" fill="#1c2530">en anneaux</text>
