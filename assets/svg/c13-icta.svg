<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="ICTA : Isolant, Cintrable, Transversalement élastique, Annelé. La gaine annelée que l'on encastre dans les murs et les dalles">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Le conduit ICTA, lettre par lettre</text>
<text x="46.0" y="62" text-anchor="middle" font-size="26" fill="#ffd23f" font-weight="bold">I</text>
<rect x="12.0" y="82" width="68.0" height="58" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="46.0" y="98" text-anchor="middle" font-size="8" fill="#ffd23f" font-weight="bold">ISOLANT</text>
<text x="46.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">en matière</text>
<text x="46.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">plastique</text>
<text x="122.0" y="62" text-anchor="middle" font-size="26" fill="#ff8c2b" font-weight="bold">C</text>
<rect x="88.0" y="82" width="68.0" height="58" rx="9" fill="#24282f" stroke="#ff8c2b" stroke-width="1.2" />
<text x="122.0" y="98" text-anchor="middle" font-size="8" fill="#ff8c2b" font-weight="bold">CINTRABLE</text>
<text x="122.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">se courbe</text>
<text x="122.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">à la main</text>
<text x="198.0" y="62" text-anchor="middle" font-size="26" fill="#5aa9e6" font-weight="bold">T</text>
<rect x="164.0" y="82" width="68.0" height="58" rx="9" fill="#24282f" stroke="#5aa9e6" stroke-width="1.2" />
<text x="198.0" y="98" text-anchor="middle" font-size="8" fill="#5aa9e6" font-weight="bold">TRANSV.</text>
<text x="198.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">reprend sa forme</text>
<text x="198.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">après écrasement</text>
<text x="274.0" y="62" text-anchor="middle" font-size="26" fill="#4cd97b" font-weight="bold">A</text>
<rect x="240.0" y="82" width="68.0" height="58" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="274.0" y="98" text-anchor="middle" font-size="8" fill="#4cd97b" font-weight="bold">ANNELÉ</text>
<text x="274.0" y="114" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">paroi</text>
<text x="274.0" y="126" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">en anneaux</text>
<text x="160" y="160" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">La « gaine annelée » des murs, des cloisons et des dalles</text>
</svg>
