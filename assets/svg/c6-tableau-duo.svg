<text x="279" y="127" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">32 A</text>
<rect x="12" y="138" width="144" height="56" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="84" y="153" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">DISJONCTEUR</text>
<text x="84" y="166" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">ampères (A)</text>
<text x="84" y="178" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">protège les conducteurs</text>
<text x="84" y="188" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">surcharge, court-circuit</text>
<rect x="164" y="138" width="144" height="56" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<text x="236" y="153" text-anchor="middle" font-size="9" fill="#e8eaed" font-weight="bold">DIFFÉRENTIEL</text>
<text x="236" y="166" text-anchor="middle" font-size="9" fill="#4cd97b" font-weight="bold">milliampères (mA)</text>
<text x="236" y="178" text-anchor="middle" font-size="7.5" fill="#e8eaed" font-weight="normal">protège les personnes</text>
<text x="236" y="188" text-anchor="middle" font-size="7" fill="#9aa6b3" font-weight="normal">fuite à la terre</text>
</svg>
