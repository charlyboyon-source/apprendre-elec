<polygon points="98,58 114,69 114,113 98,102" fill="#262c34" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="98,58 114,69 114,113 98,102" fill="#5a626e" fill-opacity="0.3" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="114,69 136,58 136,102 114,113" fill="#1f242b" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="114,69 136,58 136,102 114,113" fill="#5a626e" fill-opacity="0.16" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="98,58 120,47 136,58 114,69" fill="#5a626e" stroke="#5a626e" stroke-width="1.4" stroke-linejoin="round"/>
