<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 204" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Dans le tableau, l'interrupteur différentiel 40 A 30 mA est en tête de rangée, suivi des disjoncteurs 10, 16, 20 et 32 A. Disjoncteur : ampères, protège les conducteurs. Différentiel : milliampères, protège les personnes">
