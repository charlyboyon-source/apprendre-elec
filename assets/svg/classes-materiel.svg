<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170" viewBox="0 0 300 170" role="img" aria-label="Classes de matériel électrique">
  <g font-family="monospace">
  <text x="50" y="20" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">CLASSE I</text>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#e8ecf0" stroke-width="1.6"/>
  <path d="M50 38 v14 M44 52 h12 M46 56 h8 M48 60 h4" stroke="#4cd97b" stroke-width="1.6"/>
  <text x="50" y="90" text-anchor="middle" font-size="7.5" fill="#9aa6b3">isolation +</text>
  <text x="50" y="100" text-anchor="middle" font-size="7.5" fill="#9aa6b3">borne de TERRE</text>
  <text x="50" y="114" text-anchor="middle" font-size="7" fill="#5b6775">four, lave-linge</text>
  <text x="150" y="20" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">CLASSE II</text>
  <rect x="136" y="40" width="28" height="22" fill="none" stroke="#e8ecf0" stroke-width="1.6"/>
  <rect x="141" y="45" width="18" height="12" fill="none" stroke="#e8ecf0" stroke-width="1.4"/>
  <text x="150" y="90" text-anchor="middle" font-size="7.5" fill="#9aa6b3">double isolation</text>
  <text x="150" y="100" text-anchor="middle" font-size="7.5" fill="#9aa6b3">PAS de terre</text>
  <text x="150" y="114" text-anchor="middle" font-size="7" fill="#5b6775">perceuse, sèche-cheveux</text>
  <text x="250" y="20" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">CLASSE III</text>
  <path d="M250 38 l16 12 l-16 12 l-16 -12 z" fill="none" stroke="#e8ecf0" stroke-width="1.6"/>
  <text x="250" y="54" text-anchor="middle" font-size="8" fill="#5ab0f0">III</text>
  <text x="250" y="90" text-anchor="middle" font-size="7.5" fill="#9aa6b3">alimenté en TBTS</text>
  <text x="250" y="100" text-anchor="middle" font-size="7.5" fill="#9aa6b3">≤ 50 V</text>
  <text x="250" y="114" text-anchor="middle" font-size="7" fill="#5b6775">rasoir, spot 12 V</text>
  <text x="150" y="140" text-anchor="middle" font-size="8" fill="#e8ecf0">La classe dit COMMENT le matériel se protège</text>
  <text x="150" y="156" text-anchor="middle" font-size="7.5" fill="#5b6775">La classe 0 (sans terre ni double isolation) est interdite en France</text>
  </g></svg>