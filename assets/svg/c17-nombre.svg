<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="Nombre d'appareils selon le nombre d'endroits : deux endroits, deux va-et-vient ; trois endroits, deux va-et-vient et un permutateur ; quatre endroits, deux va-et-vient et deux permutateurs">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">Combien d'appareils ?</text>
<rect x="12" y="32" width="296" height="30" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="37" width="4" height="20" rx="2" fill="#4cd97b"/>
<text x="24" y="50.0" text-anchor="start" font-size="8.5" fill="#4cd97b" font-weight="bold">2 ENDROITS</text>
<text x="110" y="50.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">2 va-et-vient</text>
<rect x="12" y="68" width="296" height="30" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="73" width="4" height="20" rx="2" fill="#ffd23f"/>
<text x="24" y="86.0" text-anchor="start" font-size="8.5" fill="#ffd23f" font-weight="bold">3 ENDROITS</text>
<text x="110" y="86.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">2 va-et-vient + 1 permutateur</text>
<rect x="12" y="104" width="296" height="30" rx="9" fill="#24282f" stroke="#3a404b" stroke-width="1.2" />
<rect x="12" y="109" width="4" height="20" rx="2" fill="#ff8c2b"/>
<text x="24" y="122.0" text-anchor="start" font-size="8.5" fill="#ff8c2b" font-weight="bold">4 ENDROITS</text>
<text x="110" y="122.0" text-anchor="start" font-size="8.5" fill="#e8eaed" font-weight="bold">2 va-et-vient + 2 permutateurs</text>
<rect x="12" y="142" width="296" height="34" rx="9" fill="#24282f" stroke="#e85b50" stroke-width="1.2" />
<text x="160" y="156" text-anchor="middle" font-size="8.5" fill="#e8eaed" font-weight="bold">À partir de 3 endroits, le télérupteur est plus simple</text>
<text x="160" y="169" text-anchor="middle" font-size="7.5" fill="#9aa6b3" font-weight="normal">(module 18)</text>
</svg>
