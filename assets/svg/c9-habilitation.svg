<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" font-family="'Segoe UI',system-ui,sans-serif" role="img" aria-label="L'habilitation électrique : après une formation à la prévention du risque électrique, l'employeur habilite et remet un titre d'habilitation. Recyclage recommandé tous les 3 ans">
<text x="160" y="18" text-anchor="middle" font-size="9.5" fill="#9aa6b3" font-weight="normal">L'habilitation : c'est l'employeur qui la délivre</text>
<rect x="12" y="38" width="90" height="48" rx="9" fill="#24282f" stroke="#9aa6b3" stroke-width="1.2" />
<text x="57" y="53" text-anchor="middle" font-size="8.5" fill="#9aa6b3" font-weight="bold">FORMATION</text>
<text x="57" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">à la prévention du</text>
<text x="57" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">risque électrique</text>
<polyline points="105,62.0 110,62.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="116,62.0 108,58.0 108,66.0" fill="#9aa6b3"/>
<rect x="115" y="38" width="90" height="48" rx="9" fill="#24282f" stroke="#ffd23f" stroke-width="1.2" />
<text x="160" y="53" text-anchor="middle" font-size="8.5" fill="#ffd23f" font-weight="bold">EMPLOYEUR</text>
<text x="160" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">il vérifie l'aptitude</text>
<text x="160" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">et il habilite</text>
<polyline points="208,62.0 213,62.0" fill="none" stroke="#9aa6b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="219,62.0 211,58.0 211,66.0" fill="#9aa6b3"/>
<rect x="218" y="38" width="90" height="48" rx="9" fill="#24282f" stroke="#4cd97b" stroke-width="1.2" />
<text x="263" y="53" text-anchor="middle" font-size="8.5" fill="#4cd97b" font-weight="bold">TITRE</text>
<text x="263" y="66" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">d'habilitation</text>
<text x="263" y="76" text-anchor="middle" font-size="7.3" fill="#e8eaed" font-weight="normal">signé par l'employeur</text>
<rect x="40" y="104" width="240" height="28" rx="9" fill="#ffd23f" stroke="#ffd23f" stroke-width="1.2" fill-opacity="0.07"/>
<text x="160" y="122" text-anchor="middle" font-size="9" fill="#ffd23f" font-weight="bold">Recyclage recommandé tous les 3 ans</text>
<text x="160" y="156" text-anchor="middle" font-size="7.8" fill="#9aa6b3" font-weight="normal">L'habilitation n'est pas une compétence métier</text>
</svg>
